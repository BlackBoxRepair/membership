<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 電池限時優惠 | 黑盒子專業維修</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, sans-serif;
            color: #ffffff;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('batrepair.png');
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5); 
            z-index: -1;
        }

        .container {
            max-width: 500px; margin: 0 auto; padding: 40px 20px;
            text-align: center; z-index: 1; position: relative;
        }

        /* 促銷標語區塊 */
        .promo-banner {
            background: rgba(255, 159, 10, 0.9);
            color: #000;
            padding: 10px;
            border-radius: 12px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 15px;
        }

        h1 { font-size: 30px; margin-bottom: 5px; }
        .subtitle { color: #e0e0e0; font-size: 16px; margin-bottom: 25px; }

        select { 
            width: 100%; padding: 18px; border-radius: 20px; 
            background: rgba(0, 0, 0, 0.7); color: white; border: 2px solid #fff; 
            font-size: 16px; margin-bottom: 20px; cursor: pointer;
        }

        .battery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .battery-btn { 
            border: 2px solid #fff; background: rgba(0, 0, 0, 0.7); color: #fff; 
            padding: 20px 10px; border-radius: 20px; cursor: pointer; transition: 0.3s; 
        }
        .battery-btn:hover { border-color: #ff9f0a; background: rgba(255, 159, 10, 0.2); }
        .price-tag { display: block; font-size: 24px; font-weight: bold; color: #ff9f0a; margin-top: 5px; }
        
        .cta-box { 
            margin-top: 30px; padding: 25px; 
            background: rgba(0, 0, 0, 0.8); border-radius: 20px; border: 2px solid #ff9f0a; display: none; 
        }
        .booking-btn { 
            display: block; background: linear-gradient(135deg, #ff9f0a, #ffb340); 
            color: #000; padding: 16px; border-radius: 15px; text-decoration: none; 
            font-weight: bold; font-size: 18px; margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="bg-image"></div>
<div class="bg-overlay"></div>

<div class="container">
    <div class="promo-banner">🔥 本月限定：電池維修現折優惠，名額有限！</div>
    
    <h1>iPhone 電池限時優惠</h1>
    <p class="subtitle">現場 30 分鐘快速更換，原廠品質、數據不流失</p>
    
    <select id="modelSelect"><option value="">👉 選擇您的機型，立即查詢價格</option></select>
    <div class="battery-grid" id="batteryGrid"></div>
    <div class="cta-box" id="ctaBox">
        <div id="finalPriceText" style="font-size: 18px;"></div>
        <a href="https://blackboxrepair.github.io/bookingonline/" class="booking-btn">立即預約，現場免等候</a>
    </div>
</div>

<script>
    if (!window.mySupabase) {
        window.mySupabase = supabase.createClient(
            'https://hkygeqtxtvnslyrmfiux.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhreWdlcXR4dHZuc2x5cm1maXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMTY2MDUsImV4cCI6MjA5MjU5MjYwNX0.VY_XEmXpuiKaYiIH2H57gMTozaZtEDiqvaBSZ9A6kfQ'
        );
    }

    async function init() {
        const select = document.getElementById('modelSelect');
        const { data } = await window.mySupabase.from('iphone_prices').select('id, model_name').order('model_name');
        if (data) data.forEach(m => select.innerHTML += `<option value="${m.id}">${m.model_name}</option>`);
    }

    document.getElementById('modelSelect').addEventListener('change', async (e) => {
        const id = e.target.value;
        const grid = document.getElementById('batteryGrid');
        const ctaBox = document.getElementById('ctaBox');
        grid.innerHTML = ''; ctaBox.style.display = 'none';
        if (!id) return;

        const { data } = await window.mySupabase.from('iphone_prices').select('*').eq('id', id).single();
        const options = [{ key: 'original_battery', label: '原廠品質電池' }, { key: 'third_party_battery', label: '高品質副廠電池' }];

        options.forEach(opt => {
            if (data[opt.key]) {
                const btn = document.createElement('button');
                btn.className = 'battery-btn';
                btn.innerHTML = `${opt.label}<span class="price-tag">$${data[opt.key]}</span>`;
                btn.onclick = () => {
                    document.getElementById('finalPriceText').innerHTML = `選擇：<strong>${opt.label}</strong><br><span style="font-size:26px; color:#ff9f0a; font-weight:bold;">$${data[opt.key]} 元</span>`;
                    ctaBox.style.display = 'block';
                };
                grid.appendChild(btn);
            }
        });
    });

    init();
</script>
</body>
</html>
