<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 電池限時優惠 | 黑盒子專業維修</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* 背景圖片層 */
        .bg-image {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            /* 這裡直接引用您提供的維修背景圖 URL */
            background-image: url('https://ai-public.canva.com/PROD/image-asset/image_7.png');
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        /* 遮罩層：確保上方的文字清晰 */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); /* 黑色半透明遮罩 */
            z-index: -1;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
            z-index: 1;
            position: relative;
        }

        h1 {
            font-size: 32px;
            color: #f5f5f7;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); /* 文字發光效果 */
        }

        .subtitle {
            color: #a1a1a6;
            font-size: 16px;
            margin-bottom: 30px;
        }

        /* 活潑的霓虹選單樣式 */
        select {
            width: 100%;
            padding: 18px;
            border-radius: 20px; /* 大圓角 */
            background: rgba(44, 44, 46, 0.7); /* 半透明背景 */
            color: white;
            border: 2px solid #333;
            font-size: 16px;
            margin-bottom: 25px;
            outline: none;
            transition: 0.3s;
            backdrop-filter: blur(5px); /* 毛玻璃效果 */
            box-shadow: 0 0 15px rgba(0, 122, 255, 0.3); /* 霓虹藍陰影 */
        }
        select:focus {
            border-color: #007aff;
            box-shadow: 0 0 20px rgba(0, 122, 255, 0.6);
        }

        .battery-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* 活潑、強調優惠的按鈕樣式 */
        .battery-btn {
            border: 2px solid #333;
            background: rgba(28, 28, 30, 0.6);
            color: #a1a1a6;
            padding: 25px 15px;
            border-radius: 25px; /* 加大圓角 */
            cursor: pointer;
            transition: all 0.4s ease-out; /* 變慢動態 */
            text-align: center;
            backdrop-filter: blur(5px);
        }
        .battery-btn:hover {
            border-color: #ff9f0a; /* 金黃色邊框 */
            background: rgba(44, 44, 46, 0.8);
            color: white;
            transform: translateY(-5px) scale(1.03); /* 滑過時稍微放大並上移 */
            box-shadow: 0 10px 30px rgba(255, 159, 10, 0.5); /* 金黃色光芒 */
        }

        .battery-btn .label-text {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .price-tag {
            display: block;
            font-size: 26px; /* 加大價格字體 */
            font-weight: bold;
            color: #ff9f0a; /* 金黃色 */
        }

        /* 活潑的報價顯示框 */
        .cta-box {
            margin-top: 40px;
            padding: 30px;
            background: rgba(28, 28, 30, 0.8);
            border-radius: 25px;
            border: 2px solid #333;
            backdrop-filter: blur(5px);
            display: none; /* 預設隱藏 */
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.5s ease-out; /* 出現動畫 */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #finalPriceText {
            font-size: 18px;
            color: #f5f5f7;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* 活潑的預約按鈕 */
        .booking-btn {
            display: block;
            background: linear-gradient(135deg, #ff9f0a, #ffb340); /* 漸層金黃色 */
            color: #000;
            padding: 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 159, 10, 0.4);
        }
        .booking-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 159, 10, 0.7);
        }
    </style>
</head>
<body>

<div class="bg-image"></div>
<div class="bg-overlay"></div>

<div class="container">
    <h1>iPhone 電池限時優惠</h1>
    <div class="subtitle">現場 30 分鐘快速更換，專業品質保證</div>
    
    <select id="modelSelect">
        <option value="">👉 請先選擇您的 iPhone 機型</option>
    </select>
    
    <div class="battery-grid" id="batteryGrid">
        </div>

    <div class="cta-box" id="ctaBox">
        <div id="finalPriceText"></div>
        <a href="https://blackboxrepair.github.io/bookingonline/" class="booking-btn">🎯 立即預約，鎖定優惠</a>
    </div>
</div>

<script>
    // 使用 var 初始化 Supabase，確保只有這一次初始化
    var supabaseUrl = 'https://hkygeqtxtvnslyrmfiux.supabase.co';
    var supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhreWdlcXR4dHZuc2x5cm1maXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMTY2MDUsImV4cCI6MjA5MjU5MjYwNX0.VY_XEmXpuiKaYiIH2H57gMTozaZtEDiqvaBSZ9A6kfQ';
    var supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // 1. 載入機型下拉選單
    async function init() {
        const select = document.getElementById('modelSelect');
        const { data, error } = await supabase.from('iphone_prices').select('id, model_name').order('model_name');
        
        if (error) {
            console.error("初始化錯誤:", error);
            return;
        }
        
        if (data) {
            data.forEach(m => {
                select.innerHTML += `<option value="${m.id}">${m.model_name}</option>`;
            });
        }
    }

    // 2. 當選擇機型時，生成電池選項按鈕
    document.getElementById('modelSelect').addEventListener('change', async (e) => {
        const id = e.target.value;
        const grid = document.getElementById('batteryGrid');
        const ctaBox = document.getElementById('ctaBox');
        
        // 清空舊資料
        grid.innerHTML = '';
        ctaBox.style.display = 'none';

        if (!id) return;

        // 抓取該機型的價格資料
        const { data, error } = await supabase.from('iphone_prices').select('*').eq('id', id).single();
        
        if (error) {
            console.error("讀取價格錯誤:", error);
            return;
        }

        // 定義要顯示的項目與標籤
        const options = [
            { key: 'original_battery', label: '原廠品質電池' },
            { key: 'third_party_battery', label: '高品質副廠電池' }
        ];

        // 動態生成按鈕
        options.forEach(opt => {
            if (data[opt.key]) {
                const btn = document.createElement('button');
                btn.className = 'battery-btn';
                btn.innerHTML = `
                    <span class="label-text">${opt.label}</span>
                    <span class="price-tag">$${data[opt.key]}</span>
                `;
                
                // 點擊按鈕顯示報價與 CTA
                btn.onclick = () => {
                    document.getElementById('finalPriceText').innerHTML = `
                        您選擇了：<strong>${opt.label}</strong><br>
                        優惠活動價：<span style="font-size:24px; color:#ff9f0a; font-weight:bold;">$${data[opt.key]} 元</span>
                    `;
                    ctaBox.style.display = 'block';
                    
                    // 滾動到 CTA 區域讓體驗更好 (手機端)
                    setTimeout(() => {
                        ctaBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }, 100);
                };
                
                grid.appendChild(btn);
            }
        });
    });

    init();
</script>
</body>
</html>
