<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 電池限時優惠 | 黑盒子專業維修</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            /* 加入文字陰影，確保在清楚的背景上依然好讀 */
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* 背景圖片層：使用您提供的 batrepair.png，確保設定為清楚顯示 */
        .bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('batrepair.png');
            background-size: cover;
            background-position: center;
            z-index: -2;
            /* 確保圖片本身沒有被濾鏡模糊 */
            filter: none;
        }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            /* === 關鍵修改：將透明度從 0.85 降低為 0.5，讓背景圖變清楚 === */
            background-color: rgba(0, 0, 0, 0.5); 
            z-index: -1;
        }

        .container {
            max-width: 500px; margin: 0 auto; padding: 40px 20px;
            text-align: center; z-index: 1; position: relative;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            /* 強化標題陰影 */
            text-shadow: 0px 4px 8px rgba(0, 0, 0, 0.9);
        }

        .subtitle {
            color: #e0e0e0; /* 稍微調亮副標題顏色 */
            font-size: 16px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* 選單區域加上半透明背景，確保文字不會被背景圖干擾 */
        #modelSelect { 
            width: 100%; padding: 18px; border-radius: 20px; 
            background: rgba(0, 0, 0, 0.7); /* 深色半透明背景 */
            color: white; border: 2px solid #fff; /* 白色邊框 */
            font-size: 16px; margin-bottom: 25px; outline: none;
            cursor: pointer;
            text-shadow: none; /* 選單內文字不需陰影 */
        }

        .battery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .battery-btn { 
            border: 2px solid #fff; /* 白色邊框 */
            background: rgba(0, 0, 0, 0.7); /* 深色半透明背景 */
            color: #fff; 
            padding: 25px 15px; border-radius: 25px; cursor: pointer; transition: 0.3s; 
            text-shadow: none; /* 按鈕內文字不需陰影 */
        }
        .battery-btn:hover { border-color: #ff9f0a; background: rgba(255, 159, 10, 0.2); }
        
        .price-tag { display: block; font-size: 28px; font-weight: bold; color: #ff9f0a; margin-top: 5px; }
        
        .cta-box { 
            margin-top: 40px; padding: 30px; 
            background: rgba(0, 0, 0, 0.8); /* 更深的半透明背景 */
            border-radius: 25px; border: 2px solid #ff9f0a; display: none; 
            text-shadow: none;
        }
        
        .booking-btn { 
            display: block; background: linear-gradient(135deg, #ff9f0a, #ffb340); 
            color: #000; padding: 18px; border-radius: 20px; text-decoration: none; 
            font-weight: bold; font-size: 18px; margin-top: 15px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div class="bg-image"></div>
<div class="bg-overlay"></div>

<div class="container">
    <h1>iPhone 電池限時優惠</h1>
    <p class="subtitle">現場 30 分鐘快速更換，專業品質保證</p>
    
    <select id="modelSelect"><option value="">👉 請選擇 iPhone 機型</option></select>
    <div class="battery-grid" id="batteryGrid"></div>
    <div class="cta-box" id="ctaBox">
        <div id="finalPriceText" style="color:#fff; font-size: 18px;"></div>
        <a href="https://blackboxrepair.github.io/bookingonline/" class="booking-btn">立即預約享優惠</a>
    </div>
</div>

<script>
    // 確保 supabase 變數在整個生命週期中只被定義一次
    if (!window.mySupabase) {
        window.mySupabase = supabase.createClient(
            'https://hkygeqtxtvnslyrmfiux.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhreWdlcXR4dHZuc2x5cm1maXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMTY2MDUsImV4cCI6MjA5MjU5MjYwNX0.VY_XEmXpuiKaYiIH2H57gMTozaZtEDiqvaBSZ9A6kfQ'
        );
    }

    async function init() {
        const select = document.getElementById('modelSelect');
        const { data, error } = await window.mySupabase.from('iphone_prices').select('id, model_name').order('model_name');
        if (data) data.forEach(m => select.innerHTML += `<option value="${m.id}">${m.model_name}</option>`);
    }

    document.getElementById('modelSelect').addEventListener('change', async (e) => {
        const id = e.target.value;
        const grid = document.getElementById('batteryGrid');
        const ctaBox = document.getElementById('ctaBox');
        grid.innerHTML = ''; ctaBox.style.display = 'none';
        if (!id) return;

        const { data } = await window.mySupabase.from('iphone_prices').select('*').eq('id', id).single();
        const options = [{ key: 'original_battery', label: '原廠品質電池' }, { key: 'third_party_battery', label: '高品質副廠電池' }];

        options.forEach(opt => {
            if (data[opt.key]) {
                const btn = document.createElement('button');
                btn.className = 'battery-btn';
                btn.innerHTML = `${opt.label}<span class="price-tag">$${data[opt.key]}</span>`;
                btn.onclick = () => {
                    document.getElementById('finalPriceText').innerHTML = `選擇：<strong>${opt.label}</strong><br><span style="font-size:26px; color:#ff9f0a; font-weight:bold;">$${data[opt.key]} 元</span>`;
                    ctaBox.style.display = 'block';
                };
                grid.appendChild(btn);
            }
        });
    });

    init();
</script>
</body>
</html>
