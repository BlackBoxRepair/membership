<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>黑盒子報價查詢</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #1c1c1e; color: #fff; font-family: sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; }
        select { width: 100%; padding: 15px; border-radius: 12px; background: #2c2c2e; color: white; border: 1px solid #444; margin-bottom: 20px; }
        .parts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .part-btn { border: 1px solid #333; background: #1c1c1e; color: #a1a1a6; padding: 15px; border-radius: 12px; cursor: pointer; text-align: center; }
        .part-btn:hover { border-color: #007aff; background: #2c2c2e; color: white; }
        .display-box { margin-top: 30px; padding: 25px; text-align: center; background: #2c2c2e; border-radius: 16px; }
    </style>
</head>
<body>

<div class="container">
    <select id="modelSelect"><option value="">讀取中...</option></select>
    <div id="partsGrid" class="parts-grid"></div>
    <div class="display-box">
        <div id="finalPrice">請選擇機型與零件</div>
    </div>
</div>

<script>
    // 使用 var 以強制覆蓋任何可能存在的重複宣告，並確保只有這一次初始化
    var supabase = supabase.createClient(
        'https://hkygeqtxtvnslyrmfiux.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhreWdlcXR4dHZuc2x5cm1maXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMTY2MDUsImV4cCI6MjA5MjU5MjYwNX0.VY_XEmXpuiKaYiIH2H57gMTozaZtEDiqvaBSZ9A6kfQ'
    );

    async function init() {
        const select = document.getElementById('modelSelect');
        const { data, error } = await supabase.from('iphone_prices').select('id, model_name');
        
        if (error) {
            select.innerHTML = '<option value="">連線錯誤，請檢查 Console</option>';
            console.error(error);
            return;
        }
        
        select.innerHTML = '<option value="">請選擇 iPhone 機型</option>';
        data.forEach(m => {
            select.innerHTML += `<option value="${m.id}">${m.model_name}</option>`;
        });
    }

    document.getElementById('modelSelect').addEventListener('change', async (e) => {
        const id = e.target.value;
        const grid = document.getElementById('partsGrid');
        grid.innerHTML = '';
        if (!id) return;

        const { data } = await supabase.from('iphone_prices').select('*').eq('id', id).single();
        const mapping = [
            { key: 'third_party_battery', label: '副廠電池' },
            { key: 'original_battery', label: '原廠電池' },
            { key: 'third_party_screen', label: '副廠螢幕' },
            { key: 'screen_defect_repair', label: '螢幕通病維修' },
            { key: 'original_screen', label: '原廠螢幕' },
            { key: 'charging_port', label: '充電孔' },
            { key: 'earpiece', label: '聽筒' },
            { key: 'camera', label: '相機' },
            { key: 'face_id', label: 'Face ID' }
        ];

        mapping.forEach(p => {
            if (data[p.key]) {
                const btn = document.createElement('button');
                btn.className = 'part-btn';
                btn.innerText = p.label;
                btn.onclick = () => document.getElementById('finalPrice').innerText = `${p.label}：$${data[p.key]} 元`;
                grid.appendChild(btn);
            }
        });
    });

    init();
</script>
</body>
</html>
