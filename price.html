<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 電池限時優惠 | 黑盒子專業維修</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        .bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('batrepair.png');
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }

        .container {
            max-width: 500px; margin: 0 auto; padding: 30px 20px;
            text-align: center; z-index: 1; position: relative;
        }

        .promo-banner {
            background: rgba(247, 181, 0, 0.2);
            border: 1px solid #F7B500;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 15px;
        }

        h1 { font-size: 28px; margin-bottom: 5px; letter-spacing: 1px; }
        .subtitle { color: #aaaaaa; font-size: 15px; margin-bottom: 25px; }

        select { 
            width: 100%; padding: 18px; border-radius: 12px; 
            background: rgba(0, 0, 0, 0.5); color: white; border: 1px solid #555; 
            font-size: 16px; margin-bottom: 20px; outline: none;
        }

        .battery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .battery-btn { 
            border: 1px solid #444; background: rgba(30, 30, 30, 0.8); color: #fff; 
            padding: 20px 10px; border-radius: 12px; cursor: pointer; transition: 0.3s; 
        }
        .battery-btn:hover { border-color: #F7B500; background: rgba(50, 50, 50, 0.9); }
        
        .btn-title { display: block; font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .price-tag { display: block; font-size: 22px; font-weight: bold; color: #F7B500; }
        .bsmi-note { font-size: 12px; color: #00e676; margin-top: 5px; display: block; }
        
        .cta-box { 
            margin-top: 25px; padding: 25px; background: rgba(0, 0, 0, 0.7); 
            border-radius: 15px; border: 1px solid #F7B500; display: none; 
            box-shadow: 0 0 20px rgba(247, 181, 0, 0.2);
        }

        .booking-btn { 
            display: block; background: #F7B500; color: #000; 
            padding: 16px; border-radius: 10px; text-decoration: none; 
            font-weight: bold; font-size: 18px; margin-top: 15px;
            transition: transform 0.2s;
        }
        .booking-btn:active { transform: scale(0.98); }

        /* === 門市資訊調整：上下排列 === */
        .store-section { margin-top: 40px; text-align: left; }
        .store-card { 
            background: rgba(255, 255, 255, 0.05);
            padding: 20px 130px 20px 20px; 
            border-radius: 12px; border: 1px solid #333; 
            margin-bottom: 20px; /* 卡片間距 */
            position: relative;
        }
        
        .license-icon {
            position: absolute; 
            top: 50%; 
            right: 15px; 
            width: 110px; 
            height: auto;
            transform: translateY(-50%);
            z-index: 5;
        }
        
        .store-name { font-size: 16px; font-weight: bold; color: #F7B500; margin-bottom: 5px; }
        .store-info { font-size: 14px; color: #ccc; margin-bottom: 8px; }
        .map-link { 
            display: inline-block; background: #333; color: white; 
            padding: 6px 12px; border-radius: 6px; text-decoration: none; 
            font-size: 13px; border: 1px solid #F7B500;
        }
        .map-link:hover { background: #F7B500; color: #000; }
    </style>
</head>
<body>

<div class="bg-image"></div>
<div class="bg-overlay"></div>

<div class="container">
    <div class="promo-banner">🔥 本月限定：電池維修現折優惠，名額有限！</div>
    
    <h1>iPhone 電池限時優惠</h1>
    <p class="subtitle">現場維修快速更換，原廠品質、數據不流失</p>
    
    <select id="modelSelect"><option value="">👉 選擇機型，立即查詢價格</option></select>
    <div class="battery-grid" id="batteryGrid"></div>
    
    <div class="cta-box" id="ctaBox">
        <div id="finalPriceText" style="font-size: 18px;"></div>
        <a href="https://blackboxrepair.github.io/bookingonline/" class="booking-btn">立即預約，現場免等候</a>
    </div>

    <div class="store-section">
        <h2 style="text-align: center; font-size: 20px; margin-bottom: 20px; color: #F7B500;">門市據點</h2>
        
        <div class="store-card">
            <img src="lisense.png" class="license-icon" alt="認證標示">
            <div class="store-name">黑盒子 - 公益門市</div>
            <div class="store-info">地址：台中市西區公益路145號</div>
            <div class="store-info">營業時間：11:00-20:00</div>
            <a href="https://maps.app.goo.gl/SBgcEZbhB2pguB4T6" class="map-link">Google Maps</a>
        </div>

        <div class="store-card">
            <img src="lisense.png" class="license-icon" alt="認證標示">
            <div class="store-name">黑盒子 - 沙鹿門市</div>
            <div class="store-info">地址：台中市沙鹿區沙田路149號</div>
            <div class="store-info">營業時間：12:00-21:00</div>
            <a href="https://maps.app.goo.gl/qBY5HAx8Hy7rcPHx7" class="map-link">Google Maps</a>
        </div>
    </div>
</div>

<script>
    if (!window.mySupabase) {
        window.mySupabase = supabase.createClient(
            'https://hkygeqtxtvnslyrmfiux.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhreWdlcXR4dHZuc2x5cm1maXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMTY2MDUsImV4cCI6MjA5MjU5MjYwNX0.VY_XEmXpuiKaYiIH2H57gMTozaZtEDiqvaBSZ9A6kfQ'
        );
    }

    async function init() {
        const select = document.getElementById('modelSelect');
        const { data } = await window.mySupabase.from('iphone_prices').select('id, model_name').order('model_name');
        if (data) data.forEach(m => select.innerHTML += `<option value="${m.id}">${m.model_name}</option>`);
    }

    document.getElementById('modelSelect').addEventListener('change', async (e) => {
        const id = e.target.value;
        const grid = document.getElementById('batteryGrid');
        const ctaBox = document.getElementById('ctaBox');
        grid.innerHTML = ''; ctaBox.style.display = 'none';
        if (!id) return;

        const { data } = await window.mySupabase.from('iphone_prices').select('*').eq('id', id).single();
        const options = [
            { key: 'original_battery', label: '蘋果原廠電池', note: '系統可查維修紀錄' }, 
            { key: 'third_party_battery', label: 'BSMI認證電池', note: '支援健康度顯示' }
        ];

        options.forEach(opt => {
            if (data[opt.key]) {
                const btn = document.createElement('button');
                btn.className = 'battery-btn';
                btn.innerHTML = `<span class="btn-title">${opt.label}</span> <span class="price-tag">$${data[opt.key]}</span> <span class="bsmi-note">${opt.note}</span>`;
                btn.onclick = () => {
                    document.getElementById('finalPriceText').innerHTML = `選擇：<strong>${opt.label}</strong><br><span style="font-size:26px; color:#F7B500; font-weight:bold;">$${data[opt.key]} 元</span>`;
                    ctaBox.style.display = 'block';
                    ctaBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                };
                grid.appendChild(btn);
            }
        });
    });
    init();
</script>
</body>
</html>
