<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑盒子手機維修報價中心</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            background-color: #1c1c1e; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px; 
            margin: 0;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h2 { text-align: center; color: #f5f5f7; margin-bottom: 20px; }
        
        select { 
            width: 100%; padding: 15px; border-radius: 12px; 
            background: #2c2c2e; color: white; border: 1px solid #444; 
            font-size: 16px; margin-bottom: 20px; outline: none;
        }
        
        .parts-grid { 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; 
        }
        
        .part-btn { 
            border: 1px solid #333; background: #1c1c1e; color: #a1a1a6; 
            padding: 15px 10px; border-radius: 12px; cursor: pointer; 
            transition: all 0.2s ease; text-align: center;
        }
        .part-btn:hover { border-color: #007aff; background: #2c2c2e; color: white; }
        
        .price-display-box { 
            margin-top: 30px; padding: 25px; text-align: center; 
            background: #2c2c2e; border-radius: 16px; border: 1px solid #333;
        }
        #finalPrice { font-size: 24px; font-weight: bold; color: #ffffff; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>維修報價查詢</h2>
    <select id="modelSelect"><option value="">請選擇 iPhone 機型</option></select>
    <div id="partsGrid" class="parts-grid"></div>
    <div class="price-display-box">
        <div>選擇零件查看報價</div>
        <div id="finalPrice">-</div>
    </div>
</div>

<script>
    // 1. 初始化 Supabase (確保整個檔案只有這一處 const supabase 初始化)
    const supabaseUrl = 'https://hkygeqtxtvnslyrmfiux.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhreWdlcXR4dHZuc2x5cm1maXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMTY2MDUsImV4cCI6MjA5MjU5MjYwNX0.VY_XEmXpuiKaYiIH2H57gMTozaZtEDiqvaBSZ9A6kfQ';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);
    
    // 2. 定義維修欄位映射
    const partMapping = [
        { key: 'third_party_battery', label: '副廠電池' },
        { key: 'original_battery', label: '原廠電池' },
        { key: 'third_party_screen', label: '副廠螢幕' },
        { key: 'screen_defect_repair', label: '螢幕通病維修' },
        { key: 'original_screen', label: '原廠螢幕' },
        { key: 'charging_port', label: '充電孔' },
        { key: 'earpiece', label: '聽筒' },
        { key: 'camera', label: '相機' },
        { key: 'face_id', label: 'Face ID' }
    ];

    // 3. 載入機型選單
    async function init() {
        try {
            const { data, error } = await supabase.from('iphone_prices').select('id, model_name');
            if (error) throw error;
            
            const select = document.getElementById('modelSelect');
            data.forEach(m => {
                select.innerHTML += `<option value="${m.id}">${m.model_name}</option>`;
            });
        } catch (err) {
            console.error("資料載入錯誤:", err);
        }
    }

    // 4. 當機型選定，動態產生按鈕
    document.getElementById('modelSelect').addEventListener('change', async (e) => {
        const id = e.target.value;
        const grid = document.getElementById('partsGrid');
        document.getElementById('finalPrice').innerText = '-';
        
        if (!id) { grid.innerHTML = ''; return; }
        
        const { data, error } = await supabase.from('iphone_prices').select('*').eq('id', id).single();
        if (error) { console.error("查詢錯誤:", error); return; }
        
        grid.innerHTML = partMapping.map(p => {
            return (data[p.key] !== null && data[p.key] !== undefined) 
                ? `<button class="part-btn" onclick="showPrice(${data[p.key]}, '${p.label}')">${p.label}</button>` 
                : '';
        }).join('');
    });

    // 5. 顯示結果
    function showPrice(price, name) {
        document.getElementById('finalPrice').innerText = `$${price} 元`;
    }

    // 啟動程式
    init();
</script>
</body>
</html>
