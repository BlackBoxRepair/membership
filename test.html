<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小星運 - 黑盒子會員中心</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: url('game desk.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: "Microsoft JhengHei", sans-serif;
        }

        /* 旋轉木馬容器 */
        .scene {
            width: 100%;
            height: 100vh;
            perspective: 1200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel {
            width: 200px;
            height: 300px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.3, 1);
        }

        /* 卡牌基礎樣式 */
        .card {
            position: absolute;
            width: 200px;
            height: 300px;
            left: 0;
            top: 0;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
            cursor: pointer;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* 正面：Taro Front */
        .card-front {
            background: url('Taro Front.jpg') no-repeat center center;
            background-size: cover;
        }

        /* 背面：Taro Back */
        .card-back {
            background: url('Taro Back.jpg') no-repeat center center;
            background-size: cover;
            transform: rotateY(180deg);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 運勢文字顯示在黃框範圍內 */
        .fortune-text {
            color: #5d4037;
            font-size: 1.6rem;
            font-weight: bold;
            text-align: center;
            padding: 0 20px;
            margin-top: -10px; /* 配合圖片黃框位置調整 */
            opacity: 0;
            transition: opacity 0.5s ease 0.3s;
        }

        .card.is-flipped {
            transform: rotateY(180deg) translateY(-150px) scale(1.2) !important;
            z-index: 1000 !important;
        }

        .card.is-flipped .fortune-text {
            opacity: 1;
        }

        /* 隱藏未載入前的內容 */
        #app { opacity: 0; transition: opacity 0.5s; }
        #app.loaded { opacity: 1; }
    </style>
</head>
<body>

<div id="app">
    <div class="scene">
        <div class="carousel" id="carousel"></div>
    </div>
</div>

<script>
    // 1. 配置區域 (請替換為你的 Supabase 資訊)
    const SUPABASE_URL = 'https://nszwpwimtwxvjguolzwt.supabase.co';
    const SUPABASE_KEY = 'YOUR_ANON_KEY'; // 請填入你 RTF 檔案中的 anon key
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const fortunes = ["財運大吉", "心想事成", "小星運降臨", "貴人相助", "驚喜連連", "美夢成真", "元氣滿滿", "萬事順心"];
    
    let currentRotation = 0;
    let startX = 0;
    let isMoving = false;
    let hasParticipated = false;

    // 2. 初始化活動
    async function initEvent() {
        // 這裡模擬 LINE 登入檢查邏輯
        // 實際運作時需串接你的 LINE Login 或 LIFF
        const lineId = "USER_LINE_ID_FROM_LINE"; 

        if (!lineId) {
            alert("請先透過 LINE 登入");
            return;
        }

        // 檢查是否參與過 (查詢 cny_logs 表格)
        const { data, error } = await _supabase
            .from('cny_logs')
            .select('*')
            .eq('prize_type', 'STAR_EVENT'); // 假設這活動標記為 STAR_EVENT

        if (data && data.length > 0) {
            alert("您已參加過「小星運」活動囉！");
            // 這裡顯示第二畫面邏輯
            return;
        }

        renderCards();
        document.getElementById('app').classList.add('loaded');
        setupInteractions();
    }

    // 3. 渲染 10 張卡牌環狀排列
    function renderCards() {
        const carousel = document.getElementById('carousel');
        const totalCards = 10;
        const radius = 450; // 圓環半徑

        for (let i = 0; i < totalCards; i++) {
            const card = document.createElement('div');
            card.className = 'card';
            const angle = i * (360 / totalCards);
            card.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
            
            card.innerHTML = `
                <div class="card-face card-front"></div>
                <div class="card-back card-face">
                    <div class="fortune-text">${fortunes[Math.floor(Math.random() * fortunes.length)]}</div>
                </div>
            `;

            // 點擊/上滑翻牌邏輯
            card.addEventListener('click', function() {
                if(!hasParticipated) flipCard(this);
            });
            
            carousel.appendChild(card);
        }
    }

    // 4. 交互邏輯 (左右滑動旋轉)
    function setupInteractions() {
        const carousel = document.getElementById('carousel');

        window.addEventListener('touchstart', e => {
            startX = e.touches[0].pageX;
            isMoving = true;
        });

        window.addEventListener('touchmove', e => {
            if (!isMoving) return;
            const moveX = e.touches[0].pageX;
            const diffX = startX - moveX;
            // 左右滑動旋轉圓盤
            currentRotation -= diffX * 0.1; 
            carousel.style.transform = `rotateY(${currentRotation}deg)`;
            startX = moveX;
        });

        window.addEventListener('touchend', () => isMoving = false);
    }

    // 5. 翻牌與存檔
    async function flipCard(cardElement) {
        hasParticipated = true; // 防止重複點擊
        cardElement.classList.add('is-flipped');

        // 隨機選一個結果
        const finalFortune = cardElement.querySelector('.fortune-text').innerText;

        // 寫入 Supabase 紀錄
        const { error } = await _supabase.from('cny_logs').insert([
            { 
                prize_name: finalFortune, 
                prize_type: 'STAR_EVENT',
                created_at: new Date().toISOString()
            }
        ]);

        if (error) console.error('紀錄失敗:', error);
    }

    // 啟動
    initEvent();
</script>

</body>
</html>
