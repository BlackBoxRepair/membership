<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BLACKBOX | 測試中心 (質感 App 版)</title>
    
    <link rel="icon" type="image/jpeg" href="https://blackboxrepair.github.io/membership/icon.jpg?v=2">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        html, body { 
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6; color: #111827;
            overscroll-behavior: none; touch-action: pan-y;
            height: 100dvh; width: 100%; overflow: hidden; position: fixed;
        }
        #app { height: 100%; width: 100%; display: flex; flex-direction: column; }
        .content-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 130px; }
        .tab-content { display: none; opacity: 0; transition: opacity 0.3s ease-in-out; height: 100%; }
        .tab-content.active { display: block; opacity: 1; }
        
        .card-black-gold { 
            background-image: url('Card.jpg'); background-size: cover; background-position: center;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5); min-height: 180px; position: relative;
        }
        .rank-badge { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); border: 1px solid rgba(255, 215, 0, 0.2); display: flex; align-items: center; justify-content: center; min-width: 80px; height: 28px; }

        /* 🛠️ 視覺升級：深色磨砂 App 導航欄 */
        .nav-full-width { 
            background: #1a1a1a; 
            border-top: 1px solid #333333;
            display: flex; justify-content: space-around; align-items: center; 
            z-index: 50; 
            padding-bottom: env(safe-area-inset-bottom); 
            padding-top: 10px;
            height: 55px; 
            box-sizing: content-box; 
            position: fixed; bottom: 0; width: 100%;
        }
        .nav-btn { color: #888888; transition: all 0.2s; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-btn.active { color: #ca8a04; } /* 點擊後變金黃色 */
        .nav-text { font-size: 11px; font-weight: 500; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 1000; padding: 20px; align-items: center; justify-content: center; }
        .ticket-card { background: white; border-radius: 16px; overflow: hidden; display: flex; box-shadow: 0 4px 10px rgba(0,0,0,0.03); margin-bottom: 16px; min-height: 110px; border: 1px solid #f3f4f6; }
        .ticket-stub { width: 80px; background-color: #f9fafb; border-left: 2px dashed #e5e7eb; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

    <div id="loading-overlay" class="fixed inset-0 bg-white z-[200] flex flex-col justify-center items-center">
        <div class="w-10 h-10 border-2 border-gray-100 border-t-black rounded-full animate-spin mb-4"></div>
        <p class="text-[10px] font-bold text-gray-400 tracking-[0.3em] uppercase">Testing Mode</p>
    </div>

    <div id="info-modal" class="modal-overlay" onclick="closeInfoModal()">
        <div class="bg-white w-full max-w-xs rounded-[2rem] p-8 text-center shadow-2xl" onclick="event.stopPropagation()">
            <div class="w-12 h-12 bg-yellow-50 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-600" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.39 2.1-1.39 1.47 0 2.01.59 2.06 1.47h1.73c-.07-1.72-1.1-2.89-3.01-3.32V5h-2v1.31c-1.78.38-3.22 1.49-3.22 3.36 0 2.15 1.8 3.21 4.41 3.84 2.12.53 2.54 1.15 2.54 1.87 0 .85-.88 1.39-2.48 1.39-1.57 0-2.29-.73-2.4-1.87H7.5c.11 2.19 1.63 3.31 3.51 3.69V20h2v-1.3c1.87-.41 3.31-1.48 3.31-3.41 0-2.61-2.11-3.32-4.51-4.15z"/></svg>
            </div>
            <h3 class="text-xl font-black text-gray-900 mb-2">會籍積分</h3>
            <p class="text-sm text-gray-500 font-bold leading-relaxed mb-6">每10積分<br>可折抵消費金額10元</p>
            <div class="space-y-1 text-[10px] text-gray-400 font-normal">
                <p>（若有違法使用或消費退款，系統會追回已發放之積分）</p>
                <p>（本系統目前僅適用於勤美公益門市、沙鹿站前門市）</p>
            </div>
        </div>
    </div>

    <div id="coupon-qr-modal" class="modal-overlay" style="z-index: 1500;">
        <div class="bg-white w-full max-w-xs rounded-[2.5rem] p-8 text-center relative shadow-2xl">
            <button onclick="document.getElementById('coupon-qr-modal').style.display='none'" class="absolute top-5 right-5 text-gray-300 text-xl w-8 h-8 flex items-center justify-center rounded-full bg-gray-50">✕</button>
            <h3 class="text-2xl font-black text-gray-900 mb-1" id="cqr-title">優惠券</h3>
            <p class="text-xs text-gray-400 mb-8 font-bold">請出示給店員掃描核銷</p>
            <div class="flex justify-center mb-8"><canvas id="cqr-canvas"></canvas></div>
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100"><p class="text-xs font-bold text-gray-900 uppercase">One-Time Use Only</p></div>
        </div>
    </div>

    <div id="app" class="max-w-md mx-auto relative">
        <header id="main-header" class="px-6 pt-4 pb-2 flex justify-between items-center shrink-0">
            <div class="flex flex-col">
                <span class="text-[10px] font-bold text-yellow-600 tracking-widest uppercase mb-1">BLACK BOX REPAIR</span>
                <h1 id="page-title" class="text-3xl font-black text-gray-900 tracking-tight">會員中心</h1>
            </div>
            <div class="flex gap-3">
                <button onclick="openInfoModal()" class="w-10 h-10 flex items-center justify-center bg-white border border-gray-100 rounded-full text-yellow-600 active:scale-90 shadow-sm"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></button>
                <button onclick="alert('測試模式：修改功能鎖定')" class="w-10 h-10 flex items-center justify-center bg-white border border-gray-100 rounded-full text-gray-400 active:scale-90 shadow-sm"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg></button>
            </div>
        </header>
        
        <div id="main-content" class="content-scroll hidden">
            <main id="tab-blackbox" class="tab-content h-full"><div id="activity-container" class="h-full w-full"></div></main>
            
            <main id="tab-card" class="tab-content active px-6 pt-2">
                <div class="card-black-gold rounded-[2.2rem] p-7 mb-3 relative overflow-hidden flex flex-col justify-between">
                    <div class="relative z-10 flex justify-start items-start">
                        <div class="rank-badge px-3 rounded-xl"><span class="text-[10px] text-yellow-500 font-black tracking-[0.2em] uppercase">MEMBER</span></div>
                    </div>
                    <div class="absolute top-7 right-7 z-10 text-right">
                        <p class="text-[10px] text-yellow-500/50 uppercase mb-1 font-bold">Points</p>
                        <p id="m-points" class="text-4xl font-black text-yellow-400">0</p>
                    </div>
                    <div class="relative z-10 flex justify-between items-end mt-12">
                        <div class="flex flex-col">
                            <p class="text-[10px] text-yellow-500/50 uppercase mb-1 font-bold">Member Name</p>
                            <h2 id="m-name" class="text-xl font-black text-white italic">---</h2>
                        </div>
                        <div class="flex flex-col text-right">
                            <span class="text-[8px] text-white/30 uppercase mb-1 font-bold">Phone Number</span>
                            <p id="m-phone" class="text-xs text-white/70 font-mono tracking-widest font-bold">---</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-[2.5rem] p-6 shadow-sm border border-gray-100 text-center">
                    <div class="inline-block bg-white p-2 rounded-xl mb-2"><canvas id="qr-code"></canvas></div>
                    <p class="text-[10px] font-bold text-gray-300 uppercase tracking-widest">Scan to collect points</p>
                </div>
            </main>

            <main id="tab-coupon" class="tab-content p-6"><div id="coupon-list" class="space-y-4"></div></main>
        </div>

        <nav class="nav-full-width">
            <button id="nav-blackbox" onclick="switchTab('blackbox')" class="nav-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span class="nav-text">神秘盒</span>
            </button>
            
            <button id="nav-card" onclick="switchTab('card')" class="nav-btn active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span class="nav-text">會員卡</span>
            </button>
            
            <button id="nav-coupon" onclick="switchTab('coupon')" class="nav-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 12c0-1.1.9-2 2-2V6c0-1.1-.9-2-2-2H4c-1.1 0-1.99.9-1.99 2v4c1.1 0 1.99.9 1.99 2s-.89 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2zm-4.42 4.8L12 14.5l-3.58 2.3 1.08-4.12-3.29-2.69 4.24-.25L12 5.8l1.54 3.95 4.24.25-3.29 2.69 1.09 4.11z"/></svg>
                <span class="nav-text">優惠券</span>
            </button>
        </nav>
    </div>

    <script>
        const LIFF_ID = '2008733642-8wMmnKuw'; 
        const SUPABASE_URL = 'https://nszwpwimwxvjguoalzwt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zendwd2ltd3h2amd1b2Fsend0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMzY1NzYsImV4cCI6MjA4MTcxMjU3Nn0.TaAt4aqEhDsONWtDCagD5rlTMknEWfhq8fMVL1Rt4lg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUserLineId = null;

        function openInfoModal() { document.getElementById('info-modal').style.display = 'flex'; }
        function closeInfoModal() { document.getElementById('info-modal').style.display = 'none'; }
        function openCouponQR(couponId, couponName) {
            document.getElementById('cqr-title').innerText = couponName;
            new QRious({ element: document.getElementById('cqr-canvas'), value: "CPN-" + couponId, size: 180, level: 'H' });
            document.getElementById('coupon-qr-modal').style.display = 'flex';
        }

        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) { liff.login(); } 
                else {
                    const profile = await liff.getProfile();
                    currentUserLineId = profile.userId;
                    let { data } = await _supabase.from('profiles').select('*').eq('line_id', profile.userId).single();
                    if(data) renderApp(data, profile.userId);
                }
            } catch (err) { console.error(err); }
        }

        async function loadUserCoupons() {
            const list = document.getElementById('coupon-list');
            const { data, error } = await _supabase.from('user_coupons').select('*').eq('line_id', currentUserLineId).eq('status', 'unused');
            if (error || !data || data.length === 0) {
                list.innerHTML = `<div class="bg-white rounded-[2rem] p-8 shadow-sm text-center"><p class="text-gray-400 font-bold text-sm">目前沒有可用的優惠券</p></div>`;
                return;
            }
            list.innerHTML = data.map(coupon => {
                const dateText = coupon.valid_until ? `有效期限：${coupon.valid_until}` : '永久有效';
                const typeBadge = coupon.type === 'cash' ? `<span class="absolute top-4 right-4 text-[10px] font-black text-red-600 bg-red-50 px-1.5 py-0.5 rounded border border-red-100 tracking-wider">-$${coupon.discount_amount || 0}</span>` : `<span class="absolute top-4 right-4 text-[10px] font-black text-yellow-600 bg-yellow-50 px-1.5 py-0.5 rounded border border-yellow-200 tracking-wider">兌換</span>`;
                return `<div class="ticket-card"><div class="ticket-main">${typeBadge}<h4 class="text-lg font-black text-gray-900 pr-12">${coupon.coupon_name}</h4><p class="text-xs text-gray-400 mb-2">${coupon.description || '使用規範依現場告示為主'}</p><p class="text-[10px] text-gray-500 font-mono">${dateText}</p></div><div class="ticket-stub" onclick="openCouponQR('${coupon.id}', '${coupon.coupon_name}')"><div class="chip-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2" /><path d="M2 8H4M2 12H4M2 16H4M20 8H22M20 12H22M20 16H22M8 2V4M12 2V4M16 2V4M8 20V22M12 20V22M16 20V22" /><rect x="8" y="8" width="8" height="8" rx="1" stroke-opacity="0.6" /></svg></div><span class="text-[10px] font-bold text-gray-500 [writing-mode:vertical-lr] tracking-widest uppercase">使用</span></div></div>`;
            }).join('');
        }

        function renderApp(data, lineId) {
            document.getElementById('m-name').innerText = data.full_name;
            document.getElementById('m-points').innerText = (data.total_points || 0).toLocaleString();
            document.getElementById('m-phone').innerText = data.phone;
            new QRious({ element: document.getElementById('qr-code'), value: 'BBX-' + lineId, size: 200, level: 'H' });
            document.getElementById('loading-overlay').style.display = 'none';
            document.getElementById('main-content').classList.remove('hidden');
            renderActivityTab();
        }

        function renderActivityTab() {
            const container = document.getElementById('activity-container');
            container.innerHTML = `<div class="h-[60vh] flex flex-col items-center justify-center text-center p-6"><div class="w-20 h-20 bg-gray-900 rounded-3xl flex items-center justify-center mb-6 shadow-2xl rotate-6"><svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4" /></svg></div><h3 class="text-2xl font-black text-gray-900 mb-2">神秘盒驚喜</h3><p class="text-gray-400 text-sm font-medium">即將在此登場，敬請期待！</p></div>`;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.getElementById('page-title').innerText = { 'blackbox': '神秘盒', 'card': '會員中心', 'coupon': '優惠券' }[tab];
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('nav-' + tab).classList.add('active');
            if(tab === 'coupon') loadUserCoupons();
        }

        window.onload = initLiff;
    </script>
</body>
</html>
