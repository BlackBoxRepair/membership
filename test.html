<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BLACKBOX | 會員中心</title>
    
    <link rel="icon" type="image/jpeg" href="https://blackboxrepair.github.io/membership/icon.jpg?v=2">
    <link rel="shortcut icon" type="image/jpeg" href="https://blackboxrepair.github.io/membership/icon.jpg?v=2">
    <link rel="apple-touch-icon" href="https://blackboxrepair.github.io/membership/icon.jpg?v=2">
    <link rel="apple-touch-icon-precomposed" href="https://blackboxrepair.github.io/membership/icon.jpg?v=2">

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* 基礎設定 */
        html, body { 
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(180deg, #EDF2F7 0%, #F3F5F7 300px, #F3F5F7 100%);
            color: #191F28; 
            overscroll-behavior: none;
            touch-action: pan-y;
            height: 100dvh; width: 100%;
            overflow: hidden; 
            position: fixed;
        }
        
        #app { height: 100%; width: 100%; display: flex; flex-direction: column; }
        
        .content-scroll { 
            flex: 1; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            padding-bottom: 160px; 
            padding-top: 8px;
        }
        .content-scroll::-webkit-scrollbar { display: none; }
        
        .tab-content { display: none; opacity: 0; transition: opacity 0.3s ease-in-out; height: 100%; }
        .tab-content.active { display: block; opacity: 1; }
        
        /* 會員卡面設計 */
        .card-black-gold { 
            background-image: url('Card.png'); 
            background-size: cover;          
            background-repeat: no-repeat;    
            background-position: center;     
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.15); 
            border-radius: 14px; 
            min-height: 180px; 
            position: relative;
            padding: 28px;
            overflow: hidden;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .click-wrapper:active .card-black-gold {
            transform: scale(0.97);
            box-shadow: 0 4px 15px -5px rgba(0, 0, 0, 0.1); 
        }

        .rank-badge { 
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(8px); 
            display: flex; align-items: center; justify-content: center; 
            padding: 6px 14px;
            border-radius: 12px;
        }

        .toss-card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            padding: 24px;
        }

        /* 底部導航 */
        .nav-full-width { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(20px); 
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.03);
            display: flex; justify-content: space-around; align-items: center; 
            z-index: 50; 
            padding-bottom: env(safe-area-inset-bottom); 
            padding-top: 8px;
            height: 54px; 
            box-sizing: content-box; 
            position: fixed; bottom: 0; width: 100%;
        }
        .nav-btn { color: #B0B8C1; transition: all 0.2s ease; transform: scale(0.95); }
        .nav-btn.active { color: #F7B500; transform: scale(1.02); } 
        .nav-btn.active svg { stroke-width: 2.5px; }

        .soft-input { 
            background-color: #F2F4F6; 
            border: none; 
            border-radius: 16px; 
            padding: 16px; 
            font-size: 16px; 
            font-weight: 500;
            color: #191F28;
            width: 100%; 
            outline: none; 
            appearance: none; 
            -webkit-appearance: none; 
            transition: background 0.2s;
        }
        .soft-input:focus { background-color: #E5E8EB; }
        .locked-input { background-color: #F2F4F6; color: #8B95A1; cursor: not-allowed; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(6px); z-index: 1000; padding: 20px; align-items: center; justify-content: center; animation: fadeIn 0.2s ease-out; }
        .msg-modal-content { background: white; border-radius: 32px; padding: 32px 24px; text-align: center; width: 100%; max-width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }

        /* 深色底部條碼彈窗 */
        .bottom-sheet-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 2500;
            flex-direction: column;
            justify-content: flex-end; 
        }

        .bottom-sheet-content {
            background-color: #242426; 
            width: 100%;
            border-radius: 28px 28px 0 0;
            padding: 16px 24px calc(32px + env(safe-area-inset-bottom)); 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
            max-height: 95vh;
            overflow-y: auto;
            transform: translateY(100%);
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes slideDown { from { transform: translateY(0); } to { transform: translateY(100%); } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .sheet-handle { width: 36px; height: 5px; background-color: #555555; border-radius: 3px; margin: 0 auto 20px; }
        .qr-wrapper { background-color: #ffffff; padding: 16px; border-radius: 16px; display: inline-block; margin: 16px 0 32px; border: 1px solid rgba(255,255,255,0.1); }
        .select-wrapper { position: relative; width: 100%; }
        .select-wrapper::after { content: '▼'; font-size: 10px; color: #8B95A1; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); pointer-events: none; }
        iframe { border: none; width: 100%; height: 100%; display: block; }
        .text-gold { color: #FFD700; }
    </style>
</head>
<body>

    <div id="loading-overlay" class="fixed inset-0 bg-white z-[200] flex flex-col justify-center items-center">
        <div class="w-10 h-10 border-4 border-[#F2F4F6] border-t-[#F7B500] rounded-full animate-spin mb-4"></div>
        <p class="text-[11px] font-bold text-[#8B95A1] tracking-widest uppercase">Loading</p>
    </div>

    <div id="qr-bottom-sheet" class="bottom-sheet-overlay" onclick="closeQrSheet()">
        <div id="qr-sheet-content" class="bottom-sheet-content" onclick="event.stopPropagation()">
            <div class="sheet-handle"></div>
            <div class="flex justify-between items-center mb-4">
                <div class="w-8"></div> 
                <h3 class="text-[17px] font-bold text-white tracking-wide">掃碼賺取或兌換積分</h3>
                <button onclick="closeQrSheet()" class="w-8 h-8 flex items-center justify-center text-[#8B95A1] bg-[#333333] rounded-full active:scale-95 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div class="text-center">
                <div class="qr-wrapper shadow-lg"><canvas id="qr-code" class="rounded-[8px]"></canvas></div>
            </div>
            <div class="space-y-6 mb-8 px-2">
                <div class="flex items-start gap-4">
                    <svg class="w-6 h-6 text-white shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" /></svg>
                    <div>
                        <h4 class="text-[16px] font-bold text-white mb-1 tracking-wide">掃描您的會員條碼</h4>
                        <p class="text-[13px] text-[#A0A0A0]">請向門市服務人員出示您的會員二維碼</p>
                    </div>
                </div>
                <div class="flex items-start gap-4">
                    <svg class="w-6 h-6 text-white shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                    <div>
                        <h4 class="text-[16px] font-bold text-white mb-1 tracking-wide">積分活動</h4>
                        <p class="text-[13px] text-[#A0A0A0]">所賺取積分將於消費結帳後計入您的帳戶</p>
                    </div>
                </div>
            </div>
            <button onclick="closeQrSheet()" class="w-full bg-white text-[#191F28] py-[16px] rounded-[14px] font-bold text-[17px] active:scale-95 transition tracking-wide">完成</button>
        </div>
    </div>

    <div id="info-modal" class="modal-overlay" onclick="closeInfoModal()">
        <div class="bg-white w-full max-w-xs rounded-[32px] p-8 text-center shadow-2xl" onclick="event.stopPropagation()">
            <div class="w-14 h-14 bg-[#F2F4F6] rounded-full flex items-center justify-center mx-auto mb-5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-[#191F28]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </div>
            <h3 class="text-[22px] font-bold text-[#191F28] mb-3">會籍積分</h3>
            <p class="text-[15px] text-[#4E5968] font-medium leading-relaxed mb-6">每 10 積分<br>可折抵消費金額 10 元</p>
            <div class="bg-[#F2F4F6] p-4 rounded-2xl text-left">
                <p class="text-[11px] text-[#8B95A1] font-medium mb-1">・若有違法使用或消費退款，系統會追回已發放之積分。</p>
                <p class="text-[11px] text-[#8B95A1] font-medium">・本系統目前僅適用於勤美公益門市、沙鹿站前門市。</p>
            </div>
        </div>
    </div>

    <div id="msg-modal" class="modal-overlay" style="z-index: 2000;">
        <div class="msg-modal-content">
            <h3 id="msg-title" class="text-[22px] font-bold text-[#191F28] mb-3">提示</h3>
            <p id="msg-body" class="text-[15px] text-[#4E5968] mb-8 leading-relaxed font-medium">---</p>
            <button onclick="closeMsgModal()" class="w-full bg-[#F7B500] text-white py-[16px] rounded-[16px] font-bold active:scale-95 transition">確定</button>
        </div>
    </div>

    <div id="app" class="max-w-md mx-auto relative">
        <header id="main-header" class="px-6 pt-6 pb-2 flex justify-between items-center shrink-0">
            <div class="flex flex-col">
                <span class="text-[12px] font-bold text-[#F7B500] tracking-widest uppercase mb-0.5">BLACKBOX</span>
                <h1 id="page-title" class="text-[26px] font-bold text-[#191F28] tracking-tight">會員中心</h1>
            </div>
            <div class="flex gap-2.5">
                <button onclick="openInfoModal()" class="w-[42px] h-[42px] flex items-center justify-center bg-white rounded-full text-[#F7B500] active:scale-95 transition shadow-[0_2px_8px_rgba(0,0,0,0.04)]"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></button>
                <button onclick="openEditModal()" class="w-[42px] h-[42px] flex items-center justify-center bg-white rounded-full text-[#8B95A1] active:scale-95 transition shadow-[0_2px_8px_rgba(0,0,0,0.04)]"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg></button>
            </div>
        </header>
        
        <div id="main-content" class="content-scroll hidden">
            <main id="tab-card" class="tab-content active px-6 pt-2">
                <div class="click-wrapper" onclick="openQrSheet()" style="cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-user-select: none;">
                    <div class="card-black-gold mb-5">
                        <div class="relative z-10 flex justify-between items-start mb-12">
                            <div>
                                <p class="text-[11px] text-[#8B95A1] uppercase tracking-widest mb-1 font-bold">Member Name</p>
                                <h2 id="m-name" class="text-[20px] font-bold text-white tracking-wide">---</h2>
                            </div>
                            <div class="text-right">
                                <p class="text-[11px] text-[#8B95A1] uppercase tracking-widest mb-1 font-bold">Points</p>
                                <p id="m-points" class="text-[36px] font-bold text-gold tracking-tighter leading-none">0</p>
                            </div>
                        </div>
                        <div class="relative z-10 flex justify-between items-end">
                            <div class="flex flex-col">
                                <span class="text-[10px] text-[#8B95A1] uppercase tracking-widest mb-1 font-bold">Phone Number</span>
                                <p id="m-phone" class="text-[14px] text-[#D1D6DB] font-mono tracking-widest font-medium">---</p>
                            </div>
                            <div class="rank-badge flex items-center gap-1.5">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4h4v16H4V4zm6 0h2v16h-2V4zm4 0h2v16h-2V4zm4 0h2v16h-2V4z" /></svg>
                                <span class="text-[11px] text-white font-bold tracking-widest uppercase leading-none">MEMBER</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="toss-card mb-5 relative flex flex-col items-center py-8">
                    <div class="w-full max-w-[260px] relative">
                        <svg viewBox="0 0 200 120" class="w-full h-auto overflow-visible">
                            <defs>
                                <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#F7B500" />
                                    <stop offset="100%" stop-color="#FFD700" />
                                </linearGradient>
                            </defs>
                            <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#F2F4F6" stroke-width="12" stroke-linecap="round"/>
                            <path id="progress-arc" d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="url(#arcGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="251.3" style="transition: stroke-dashoffset 1.5s cubic-bezier(0.16, 1, 0.3, 1);"/>

                            <circle cx="35" cy="53" r="5" fill="#ffffff" stroke="#E5E8EB" stroke-width="3" id="node-1" style="transition: stroke 0.5s 1s ease;"/>
                            <text x="22" y="53" font-size="10" fill="#8B95A1" font-weight="bold">3</text>
                            
                            <circle cx="75" cy="24" r="5" fill="#ffffff" stroke="#E5E8EB" stroke-width="3" id="node-2" style="transition: stroke 0.5s 1s ease;"/>
                            <text x="70" y="14" text-anchor="middle" font-size="10" fill="#8B95A1" font-weight="bold">6</text>
                            
                            <circle cx="140" cy="31" r="5" fill="#ffffff" stroke="#E5E8EB" stroke-width="3" id="node-3" style="transition: stroke 0.5s 1s ease;"/>
                            <text x="145" y="21" font-size="10" fill="#8B95A1" font-weight="bold">10</text>

                            <circle cx="180" cy="100" r="5" fill="#ffffff" stroke="#E5E8EB" stroke-width="3" id="node-4" style="transition: stroke 0.5s 1s ease;"/>
                            <text x="195" y="103" font-size="10" fill="#8B95A1" font-weight="bold">15</text>
                        </svg>
                        
                        <div class="absolute inset-0 flex flex-col items-center justify-end pb-[6px]">
                            <span id="yearly-count" class="text-[56px] font-black text-[#191F28] leading-none mb-1 tracking-tighter">0</span>
                            <div class="flex items-center text-[#8B95A1] text-[12px] font-bold">本年度消費次數 <svg class="w-3 h-3 ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" /></svg></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <nav class="nav-full-width">
            <button id="nav-card" onclick="switchTab('card')" class="flex-1 py-1 flex flex-col items-center gap-1 nav-btn active">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2" /></svg>
                <span class="text-[11px] font-bold">會員卡</span>
            </button>
            <button id="nav-coupon" onclick="switchTab('coupon')" class="flex-1 py-1 flex flex-col items-center gap-1 nav-btn">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" /></svg>
                <span class="text-[11px] font-bold">優惠券</span>
            </button>
        </nav>
    </div>

    <script>
        const LIFF_ID = '2008733642-8wMmnKuw'; 
        const SUPABASE_URL = 'https://nszwpwimwxvjguoalzwt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zendwd2ltd3h2amd1b2Fsend0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMzY1NzYsImV4cCI6MjA4MTcxMjU3Nn0.TaAt4aqEhDsONWtDCagD5rlTMknEWfhq8fMVL1Rt4lg';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUserLineId = null;

        function openQrSheet() {
            const sheet = document.getElementById('qr-bottom-sheet');
            const content = document.getElementById('qr-sheet-content');
            sheet.style.display = 'flex';
            content.style.animation = 'slideUp 0.3s forwards cubic-bezier(0.16, 1, 0.3, 1)';
            sheet.style.animation = 'fadeIn 0.3s ease-out';
        }

        function closeQrSheet() {
            const sheet = document.getElementById('qr-bottom-sheet');
            const content = document.getElementById('qr-sheet-content');
            content.style.animation = 'slideDown 0.3s forwards cubic-bezier(0.16, 1, 0.3, 1)';
            sheet.style.animation = 'fadeOut 0.3s forwards ease-out';
            setTimeout(() => { sheet.style.display = 'none'; }, 300); 
        }

        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) { liff.login(); } 
                else {
                    const profile = await liff.getProfile();
                    currentUserLineId = profile.userId;
                    checkMemberStatus(profile);
                }
            } catch (err) { console.error('Init Fail', err); }
        }

        async function checkMemberStatus(lineProfile) {
            let { data } = await _supabase.from('profiles').select('*').eq('line_id', lineProfile.userId).single();
            if (data) {
                document.getElementById('m-name').innerText = data.full_name;
                document.getElementById('m-points').innerText = (data.total_points || 0).toLocaleString();
                document.getElementById('m-phone').innerText = data.phone;
                new QRious({ element: document.getElementById('qr-code'), value: 'BBX-' + lineProfile.userId, size: 200, level: 'M' });
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('main-content').classList.remove('hidden');
                loadYearlyConsumption();
            }
        }

        // ==========================================
        // 年度消費數據載入邏輯更新：基準改為 15 次
        // ==========================================
        async function loadYearlyConsumption() {
            const currentYear = new Date().getFullYear();
            const startDate = `${currentYear}-01-01T00:00:00.000Z`;
            
            try {
                const { count, error } = await _supabase
                    .from('point_logs')
                    .select('*', { count: 'exact', head: true })
                    .eq('line_id', currentUserLineId)
                    .gte('created_at', startDate);
                    
                if (error) throw error;
                
                const times = count || 0;
                document.getElementById('yearly-count').innerText = times;
                
                const MAX_TIMES = 15; // 滿圈基準改為 15
                const percentage = Math.min(times / MAX_TIMES, 1);
                const dashoffset = 251.3 - (251.3 * percentage);
                
                setTimeout(() => {
                    document.getElementById('progress-arc').style.strokeDashoffset = dashoffset;
                    // 根據消費次數點亮對應節點
                    if(times >= 3) document.getElementById('node-1').style.stroke = '#F7B500';
                    if(times >= 6) document.getElementById('node-2').style.stroke = '#F7B500';
                    if(times >= 10) document.getElementById('node-3').style.stroke = '#F7B500';
                    if(times >= 15) document.getElementById('node-4').style.stroke = '#F7B500';
                }, 300);
            } catch (err) { console.error('載入失敗', err); }
        }

        window.onload = () => { initLiff(); };
    </script>
</body>
</html>
