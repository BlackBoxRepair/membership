<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小星運 - 黑盒子手機維修中心</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --card-w: 180px; --card-h: 270px; }
        * { box-sizing: border-box; }
        
        /* 防全黑設定：給定基礎色 */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #1a1a1a; 
            overflow: hidden; 
        }

        /* 遊戲背景：如果圖片沒出來，至少有深灰色背景 */
        .game-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a url('game desk.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }

        .stage {
            width: 100%; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            perspective: 1200px;
        }

        .carousel {
            position: relative;
            width: var(--card-w); height: var(--card-h);
            transform-style: preserve-3d;
        }

        /* 卡牌樣式：先給灰色背景，確保一定看得到方塊 */
        .card {
            position: absolute; width: 100%; height: 100%;
            left: 0; top: 0;
            transform-style: preserve-3d;
            transition: all 0.5s ease;
            opacity: 0;
        }

        .card.active { opacity: 1; z-index: 10; transform: translateZ(180px); }
        .card.prev { opacity: 0.8; z-index: 5; transform: translateX(-150px) rotateY(30deg); }
        .card.next { opacity: 0.8; z-index: 5; transform: translateX(150px) rotateY(-30deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background-color: #333; /* 圖片出不來時顯示這個顏色 */
            border: 1px solid #444;
        }

        /* 強制指定圖片路徑 */
        .card-front {
            background-image: url('Taro Front.jpg');
            background-size: cover; background-position: center;
        }

        .card-back {
            background-image: url('Taro Back.jpg');
            background-size: cover; background-position: center;
            transform: rotateY(180deg);
            display: flex; align-items: center; justify-content: center;
        }

        .fortune-text {
            color: #432a0a; font-size: 1.4rem; font-weight: bold; text-align: center;
            opacity: 0; pointer-events: none;
        }

        .card.is-flipped {
            transform: translateZ(350px) rotateY(180deg) translateY(-100px) !important;
            z-index: 100 !important;
        }
        .card.is-flipped .fortune-text { opacity: 1; transition: 0.5s 0.3s; }
    </style>
</head>
<body>

    <div class="game-bg"></div>
    <div class="stage" id="mainStage">
        <div class="carousel" id="cardBox"></div>
    </div>

<script>
    // 參數設定
    const config = {
        url: 'https://nszwpwimtwxvjguolzwt.supabase.co',
        key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zendwd2ltd3h2amd1b2Fsend0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMzY1NzYsImV4cCI6MjA4MTcxMjU3Nn0.TaAt4aqEhDsONWtDCagD5rlTMknEWfhq8fMVL1Rt4lg',
        fortunes: ["財運大吉", "心想事成", "驚喜連連", "貴人相助", "元氣滿滿", "萬事如意", "美夢成真", "步步高升", "福氣滿滿", "吉星高照"]
    };

    let currentIndex = 0;
    let startX = 0, startY = 0, isFlipped = false;
    let _sb = null;

    // 啟動函式
    window.onload = function() {
        console.log("頁面載入成功");
        
        // 1. 先把卡牌做出來 (這步絕對不能失敗)
        try {
            const box = document.getElementById('cardBox');
            for (let i = 0; i < 10; i++) {
                const el = document.createElement('div');
                el.className = 'card';
                el.innerHTML = `
                    <div class="card-face card-front"></div>
                    <div class="card-back card-face"><div class="fortune-text">${config.fortunes[i]}</div></div>
                `;
                box.appendChild(el);
            }
            update();
            console.log("卡牌渲染完畢");
        } catch (err) {
            console.error("渲染失敗:", err);
        }

        // 2. 初始化 Supabase (失敗也不影響畫面)
        try {
            if (typeof supabase !== 'undefined') {
                _sb = supabase.createClient(config.url, config.key);
                console.log("Supabase 已就緒");
            }
        } catch (e) {
            console.warn("Supabase 沒跑起來，但沒關係");
        }

        bindEvents();
    };

    function update() {
        const list = document.querySelectorAll('.card');
        list.forEach((c, i) => {
            c.classList.remove('active', 'prev', 'next');
            c.style.opacity = "0";
            if (i === currentIndex) {
                c.classList.add('active');
            } else if (i === (currentIndex - 1 + 10) % 10) {
                c.classList.add('prev');
                c.style.opacity = "1";
            } else if (i === (currentIndex + 1) % 10) {
                c.classList.add('next');
                c.style.opacity = "1";
            }
        });
    }

    function bindEvents() {
        const stage = document.getElementById('mainStage');
        stage.addEventListener('touchstart', e => {
            startX = e.touches[0].pageX;
            startY = e.touches[0].pageY;
        });

        stage.addEventListener('touchend', e => {
            if (isFlipped) return;
            const dx = startX - e.changedTouches[0].pageX;
            const dy = startY - e.changedTouches[0].pageY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) {
                    currentIndex = dx > 0 ? (currentIndex + 1) % 10 : (currentIndex - 1 + 10) % 10;
                    update();
                }
            } else if (dy > 60) {
                const active = document.querySelector('.card.active');
                if (active) flip(active);
            }
        });
    }

    async function flip(card) {
        isFlipped = true;
        card.classList.add('is-flipped');
        const prize = card.querySelector('.fortune-text').innerText;
        
        if (_sb) {
            await _sb.from('cny_logs').insert([{ 
                prize_name: prize, 
                prize_type: 'STAR_EVENT',
                created_at: new Date().toISOString()
            }]);
        }
    }
</script>
</body>
</html>
