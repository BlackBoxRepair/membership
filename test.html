<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小星運 - 黑盒子手機維修中心</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --card-w: 180px; --card-h: 270px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #1a1a1a; /* 基礎背景色，防止全黑 */
            overflow: hidden; 
        }

        /* 整個網站背景 */
        .game-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a url('game desk.png') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }

        .stage {
            width: 100%; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            perspective: 1200px;
        }

        .carousel {
            position: relative;
            width: var(--card-w); height: var(--card-h);
            transform-style: preserve-3d;
        }

        .card {
            position: absolute; width: 100%; height: 100%;
            left: 0; top: 0;
            transform-style: preserve-3d;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0;
        }

        /* 扇形排列邏輯 */
        .card.active { opacity: 1; z-index: 10; transform: translateZ(200px); }
        .card.prev { opacity: 0.8; z-index: 5; transform: translateX(-150px) rotateY(30deg); }
        .card.next { opacity: 0.8; z-index: 5; transform: translateX(150px) rotateY(-30deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background-color: #444; /* 若圖片讀取失敗，至少會顯示深灰色方塊 */
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* 抽取前：Taro Front.png */
        .card-front {
            background-image: url('Taro Front.png');
            background-size: cover;
            background-position: center;
        }

        /* 抽取後：Taro Back.png */
        .card-back {
            background-image: url('Taro Back.png');
            background-size: cover;
            background-position: center;
            transform: rotateY(180deg);
            display: flex; align-items: center; justify-content: center;
        }

        .fortune-text {
            color: #432a0a; font-size: 1.5rem; font-weight: bold; text-align: center;
            padding: 0 20px; opacity: 0; margin-top: -10px;
        }

        .card.is-flipped {
            transform: translateZ(400px) rotateY(180deg) translateY(-120px) !important;
            z-index: 100 !important;
        }
        .card.is-flipped .fortune-text { opacity: 1; transition: 0.5s 0.3s; }
    </style>
</head>
<body>

    <div class="game-bg"></div>
    <div class="stage" id="touchArea">
        <div class="carousel" id="cardContainer"></div>
    </div>

<script>
    const config = {
        url: 'https://nszwpwimtwxvjguolzwt.supabase.co',
        key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zendwd2ltd3h2amd1b2Fsend0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMzY1NzYsImV4cCI6MjA4MTcxMjU3Nn0.TaAt4aqEhDsONWtDCagD5rlTMknEWfhq8fMVL1Rt4lg',
        fortunes: ["財運大吉", "心想事成", "驚喜連連", "貴人相助", "元氣滿滿", "萬事如意", "美夢成真", "步步高升", "福氣滿滿", "吉星高照"]
    };

    let currentIndex = 0;
    let startX = 0, startY = 0, isFlipped = false;
    let _supabase = null;

    window.onload = function() {
        // 渲染卡牌
        const container = document.getElementById('cardContainer');
        for (let i = 0; i < 10; i++) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-face card-front"></div>
                <div class="card-back card-face">
                    <div class="fortune-text">${config.fortunes[i]}</div>
                </div>
            `;
            container.appendChild(card);
        }
        update();

        // 啟動 Supabase
        try {
            _supabase = supabase.createClient(config.url, config.key);
        } catch (e) { console.error("Supabase Error"); }

        // 綁定事件
        const area = document.getElementById('touchArea');
        area.addEventListener('touchstart', e => {
            startX = e.touches[0].pageX;
            startY = e.touches[0].pageY;
        });

        area.addEventListener('touchend', e => {
            if (isFlipped) return;
            const dx = startX - e.changedTouches[0].pageX;
            const dy = startY - e.changedTouches[0].pageY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) {
                    currentIndex = dx > 0 ? (currentIndex + 1) % 10 : (currentIndex - 1 + 10) % 10;
                    update();
                }
            } else if (dy > 60) {
                const activeCard = document.querySelector('.card.active');
                if (activeCard) flip(activeCard);
            }
        });
    };

    function update() {
        const cards = document.querySelectorAll('.card');
        cards.forEach((card, i) => {
            card.classList.remove('active', 'prev', 'next');
            card.style.opacity = "0";
            if (i === currentIndex) {
                card.classList.add('active');
            } else if (i === (currentIndex - 1 + 10) % 10) {
                card.classList.add('prev');
                card.style.opacity = "1";
            } else if (i === (currentIndex + 1) % 10) {
                card.classList.add('next');
                card.style.opacity = "1";
            }
        });
    }

    async function flip(card) {
        isFlipped = true;
        card.classList.add('is-flipped');
        const prize = card.querySelector('.fortune-text').innerText;
        if (_supabase) {
            await _supabase.from('cny_logs').insert([{ 
                prize_name: prize, 
                prize_type: 'STAR_EVENT',
                created_at: new Date().toISOString()
            }]);
        }
    }
</script>
</body>
</html>
