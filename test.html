<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑盒子維修中心 - 官方網站</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- 核心樣式與顏色定義 (黑、白、金) --- */
        :root {
            --primary-black: #1a1a1a;
            --secondary-black: #2d2d2d;
            --gold-accent: #d4af37;
            --gold-light: #f4ebd0;
            --bg-light: #f9f9f9;
            --text-dark: #333333;
            --text-gray: #777777;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* --- 上排固定導覽列 (Top Header) --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #ffffff;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* 漢堡選單按鈕 */
        .menu-toggle {
            font-size: 24px;
            color: var(--primary-black);
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
            transition: var(--transition);
        }
        
        .menu-toggle:hover {
            color: var(--gold-accent);
        }

        /* 圖片 Logo 樣式優化 */
        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 28px; /* 這裡已縮小，讓 Logo 比例更精緻 */
            width: auto;
            object-fit: contain;
        }

        /* 右上角功能按鈕組 (維持圖片圓形底色風格) */
        .header-right {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: var(--primary-black);
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            transition: var(--transition);
            position: relative;
        }

        .nav-btn:hover {
            background-color: var(--gold-accent);
            transform: translateY(-2px);
        }

        /* 滑鼠懸停提示文字 */
        .nav-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--secondary-black);
            color: #fff;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .nav-btn:hover::after {
            opacity: 1;
            visibility: visible;
        }

        /* --- 側邊展開選單 (Sidebar) --- */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: var(--primary-black);
            z-index: 2000;
            transition: var(--transition);
            padding: 30px 20px;
            box-shadow: 5px 0 20px rgba(0,0,0,0.2);
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 500;
        }

        .close-btn {
            font-size: 22px;
            color: #ffffff;
            background: none;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .close-btn:hover {
            color: var(--gold-accent);
        }

        /* 側邊選單連結列表 */
        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #cccccc;
            text-decoration: none;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 16px;
            transition: var(--transition);
        }

        .sidebar-menu a:hover {
            color: #ffffff;
            background-color: var(--secondary-black);
            padding-left: 24px;
            border-left: 4px solid var(--gold-accent);
        }

        /* 側邊選單開啟時的背景遮罩 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1500;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* --- 網頁主要內容區 (暫時留白) --- */
        main {
            margin-top: 70px;
            padding: 40px 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            min-height: calc(100vh - 180px); /* 確保留白時頁尾維持在下方 */
        }

        /* 頁尾 */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-gray);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="menu-toggle" id="openMenu" aria-label="開啟選單">
                <i class="fa-solid fa-bars"></i>
            </button>
            <a href="#" class="logo-container">
                <img src="site logo.png" alt="Black Box Logo" class="logo-img">
            </a>
        </div>
        <div class="header-right">
            <a href="https://blackboxrepair.github.io/membership/" class="nav-btn" data-tooltip="會員中心">
                <i class="fa-solid fa-user"></i>
            </a>
            <a href="https://blackboxrepair.github.io/bookingonline/" class="nav-btn" data-tooltip="線上預約">
                <i class="fa-solid fa-calendar-check"></i>
            </a>
        </div>
    </header>

    <div class="overlay" id="overlay"></div>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">項目選單</span>
            <button class="close-btn" id="closeMenu" aria-label="關閉選單">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="#process"><i class="fa-solid fa-arrows-spin"></i>服務流程</a></li>
            <li><a href="#cases"><i class="fa-solid fa-toolbox"></i>維修案例</a></li>
            <li><a href="#prices"><i class="fa-solid fa-tags"></i>價格查詢</a></li>
            <li><a href="#locations"><i class="fa-solid fa-shop"></i>服務站點</a></li>
        </ul>
    </nav>

    <main>
        </main>

    <footer>
        <p>&copy; 2026 BLACK BOX 維修中心. All Rights Reserved.</p>
    </footer>

    <script>
        const openMenuBtn = document.getElementById('openMenu');
        const closeMenuBtn = document.getElementById('closeMenu');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const sidebarLinks = document.querySelectorAll('.sidebar-menu a');

        function toggleMenu() {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        openMenuBtn.addEventListener('click', toggleMenu);
        closeMenuBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        // 點擊選單連結後，自動關閉選單並滾動到該區塊
        sidebarLinks.forEach(link => {
            link.addEventListener('click', () => {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            });
        });
    </script>
</body>
</html>
