<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小星運 - 黑盒子手機維修中心</title>
    <style>
        :root { 
            --w: 220px; 
            --h: 330px; 
            --gap: 240px; 
        }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #000; overflow: hidden; font-family: sans-serif; }
        
        #loading {
            position: fixed; inset: 0; background: #000; z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.4s ease;
        }
        .lds-ring { display: inline-block; width: 40px; height: 40px; border: 4px solid #fff; border-color: #fff transparent #fff transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .game-bg { position: fixed; inset: 0; background: url('game desk.png') center/cover; z-index: 1; }
        
        /* 舞台：使用 Flex 並確保垂直水平皆居中 */
        .stage { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            perspective: 1200px; 
            z-index: 10; 
        }
        
        .carousel { position: relative; width: var(--w); height: var(--h); transform-style: preserve-3d; }
        
        .card { 
            position: absolute; inset: 0; 
            transform-style: preserve-3d; 
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); 
            display: none; 
        }
        
        .card-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .card-front { background: url('Taro Front.png') center/100% 100% no-repeat; }
        .card-back { background: url('Taro Back.png') center/100% 100% no-repeat; transform: rotateY(180deg); display: flex; align-items: center; justify-content: center; }
        .fortune { color: #432a0a; font-size: 1.8rem; font-weight: bold; text-align: center; opacity: 0; margin-top: -15px; }

        /* --- 核心修正區：移除 translateY 偏移，達成 X 與 Y 軸絕對置中 --- */
        .card.is-flipped { 
            /* 將 translateY 設為 0，並增加 translateZ 讓卡牌放大靠近 */
            transform: translateZ(500px) rotateY(180deg) translateY(0) !important; 
            z-index: 100 !important; 
            display: block !important; 
        }
        /* --------------------------------------------------------- */

        .card.is-flipped .fortune { opacity: 1; transition: 0.5s 0.3s; }

        .hint { position: fixed; bottom: 30px; width: 100%; text-align: center; color: rgba(255,255,255,0.8); font-size: 0.9rem; z-index: 20; text-shadow: 0 2px 4px #000; letter-spacing: 1px;}
    </style>
</head>
<body>

    <div id="loading">
        <div class="lds-ring"></div>
        <p style="color:white; margin-top:15px; font-weight: bold;">正在載入星運...</p>
    </div>

    <div class="game-bg"></div>
    <div class="hint">左右滑動切換，向上滑動選定</div>
    <div class="stage" id="main">
        <div class="carousel" id="box"></div>
    </div>

<script>
    const FORTUNES = ["財運大吉", "心想事成", "萬事如意", "驚喜連連", "美夢成真", "元氣滿滿", "步步高升", "福氣滿門", "貴人相助", "吉星高照"];
    let idx = 0, sx = 0, sy = 0, isFlip = false;

    function render() {
        const cards = document.querySelectorAll('.card');
        const total = cards.length;
        
        cards.forEach((c, i) => {
            c.style.display = "none";
            
            if (i === idx) {
                // 正中間
                c.style.display = "block";
                c.style.zIndex = "20";
                c.style.transform = "translateZ(250px)";
            } else if (i === (idx - 1 + total) % total) {
                // 左側
                c.style.display = "block";
                c.style.zIndex = "10";
                c.style.transform = "translateX(calc(var(--gap) * -1)) rotateY(25deg) translateZ(0px)";
            } else if (i === (idx + 1) % total) {
                // 右側
                c.style.display = "block";
                c.style.zIndex = "10";
                c.style.transform = "translateX(var(--gap)) rotateY(-25deg) translateZ(0px)";
            }
        });
    }

    window.onload = () => {
        const b = document.getElementById('box');
        for (let i = 0; i < 10; i++) {
            const d = document.createElement('div');
            d.className = 'card';
            d.innerHTML = `
                <div class="card-face card-front"></div>
                <div class="card-back card-face">
                    <div class="fortune">${FORTUNES[i]}</div>
                </div>`;
            b.appendChild(d);
        }
        render();

        setTimeout(() => {
            const ld = document.getElementById('loading');
            if(ld) {
                ld.style.opacity = '0';
                setTimeout(() => ld.remove(), 400);
            }
        }, 800);

        const m = document.getElementById('main');
        m.ontouchstart = e => { sx = e.touches[0].pageX; sy = e.touches[0].pageY; };
        m.ontouchend = e => {
            if (isFlip) return;
            const dx = sx - e.changedTouches[0].pageX;
            const dy = sy - e.changedTouches[0].pageY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 35) {
                    idx = dx > 0 ? (idx + 1) % 10 : (idx - 1 + 10) % 10;
                    render();
                }
            } else {
                // 向上滑動觸發翻牌
                if (dy > 65) {
                    const ac = document.querySelectorAll('.card')[idx];
                    if (ac) {
                        isFlip = true;
                        ac.classList.add('is-flipped');
                    }
                }
            }
        };
    };
</script>
</body>
</html>
