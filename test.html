<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小星運 - 黑盒子</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --card-w: 180px;
            --card-h: 270px;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #1a1a1a; /* 預設深色背景防止全黑 */
        }

        /* 遊戲背景 */
        .game-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('game desk.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }

        .stage {
            width: 100%; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            perspective: 1000px;
            position: relative;
        }

        .carousel {
            position: relative;
            width: var(--card-w);
            height: var(--card-h);
            transform-style: preserve-3d;
        }

        .card {
            position: absolute;
            width: var(--card-w); height: var(--card-h);
            left: 0; top: 0;
            transform-style: preserve-3d;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0;
            pointer-events: none;
        }

        /* 顯示邏輯 */
        .card.active { opacity: 1; z-index: 10; transform: translateZ(180px); pointer-events: auto; }
        .card.prev { opacity: 0.8; z-index: 5; transform: translateX(-150px) rotateY(35deg) translateZ(0px); }
        .card.next { opacity: 0.8; z-index: 5; transform: translateX(150px) rotateY(-35deg) translateZ(0px); }

        .card-face {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            background-color: #333; /* 圖片沒出來時顯示灰色 */
        }

        .card-front {
            background: url('Taro Front.jpg') no-repeat center center;
            background-size: cover;
        }

        .card-back {
            background: url('Taro Back.jpg') no-repeat center center;
            background-size: cover;
            transform: rotateY(180deg);
            display: flex; align-items: center; justify-content: center;
        }

        .fortune-text {
            color: #432a0a; font-size: 1.5rem; font-weight: bold; text-align: center;
            padding: 0 20px; opacity: 0;
        }

        .card.is-flipped {
            transform: translateZ(350px) rotateY(180deg) translateY(-100px) !important;
            z-index: 100 !important;
        }
        .card.is-flipped .fortune-text { opacity: 1; transition: 0.5s 0.3s; }

        .hint {
            position: absolute; bottom: 8%; color: rgba(255,255,255,0.7);
            font-size: 0.8rem; text-align: center; width: 100%;
        }
    </style>
</head>
<body>

<div class="game-bg"></div>
<div class="stage" id="touchArea">
    <div class="carousel" id="carousel"></div>
    <div class="hint">左右滑動切換卡牌，向上滑動翻開</div>
</div>

<script>
    // ⚠️ 請務必填入你的 ANON KEY
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zendwd2ltd3h2amd1b2Fsend0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMzY1NzYsImV4cCI6MjA4MTcxMjU3Nn0.TaAt4aqEhDsONWtDCagD5rlTMknEWfhq8fMVL1Rt4lg";
    const _supabase = supabase.createClient('https://nszwpwimtwxvjguolzwt.supabase.co', SUPABASE_KEY);

    const fortunes = ["財運亨通", "心想事成", "小星運降臨", "貴人相助", "驚喜連連", "美夢成真", "元氣滿滿", "步步高升", "萬事如意", "好運相隨"];
    let currentIndex = 0;
    let startX = 0, startY = 0, isFlipped = false;

    function init() {
        const carousel = document.getElementById('carousel');
        if (!carousel) return;
        
        for (let i = 0; i < 10; i++) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-face card-front"></div>
                <div class="card-back card-face">
                    <div class="fortune-text">${fortunes[i]}</div>
                </div>
            `;
            carousel.appendChild(card);
        }
        update();
        setupTouch();
    }

    function update() {
        const cards = document.querySelectorAll('.card');
        cards.forEach((card, i) => {
            card.classList.remove('active', 'prev', 'next');
            card.style.opacity = "0";
            if (i === currentIndex) {
                card.classList.add('active');
            } else if (i === (currentIndex - 1 + 10) % 10) {
                card.classList.add('prev');
                card.style.opacity = "1";
            } else if (i === (currentIndex + 1) % 10) {
                card.classList.add('next');
                card.style.opacity = "1";
            }
        });
    }

    function setupTouch() {
        const area = document.getElementById('touchArea');
        area.addEventListener('touchstart', e => {
            startX = e.touches[0].pageX;
            startY = e.touches[0].pageY;
        });

        area.addEventListener('touchend', e => {
            if (isFlipped) return;
            const dx = startX - e.changedTouches[0].pageX;
            const dy = startY - e.changedTouches[0].pageY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 40) {
                    currentIndex = dx > 0 ? (currentIndex + 1) % 10 : (currentIndex - 1 + 10) % 10;
                    update();
                }
            } else if (dy > 60) {
                const active = document.querySelector('.card.active');
                if (active) flip(active);
            }
        });
    }

    async function flip(card) {
        isFlipped = true;
        card.classList.add('is-flipped');
        const prize = card.querySelector('.fortune-text').innerText;
        // 背景寫入資料庫，不影響畫面呈現
        _supabase.from('cny_logs').insert([{ prize_name: prize, prize_type: 'STAR_EVENT' }]);
    }

    // 確保頁面載入後才執行
    window.onload = init;
</script>
</body>
</html>
