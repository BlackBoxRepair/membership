<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑盒子維修中心 - 官方網站</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- 核心樣式與顏色定義 (融入文青白底風格) --- */
        :root {
            --primary-black: #1a1a1a;
            --secondary-black: #2d2d2d;
            --gold-accent: #d4af37;
            --bg-light: #f9f9f9;
            --text-dark: #333333;
            --text-muted: #999999; /* 分類小標題顏色 */
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* --- 上排固定導覽列 (Top Header) --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #ffffff;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* 漢堡選單按鈕 */
        .menu-toggle {
            font-size: 24px;
            color: var(--primary-black);
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
            transition: var(--transition);
        }
        
        .menu-toggle:hover {
            color: var(--gold-accent);
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 28px;
            width: auto;
            object-fit: contain;
        }

        /* 右上角功能按鈕組 (維持圖片圓形底色風格) */
        .header-right {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: var(--primary-black);
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            transition: var(--transition);
            position: relative;
        }

        .nav-btn:hover {
            background-color: var(--gold-accent);
            transform: translateY(-2px);
        }

        .nav-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--secondary-black);
            color: #fff;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .nav-btn:hover::after {
            opacity: 1;
            visibility: visible;
        }

        /* --- 🎨 側邊展開選單 (參考森息日常風格改造) --- */
        .sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 320px;
            height: 100%;
            background-color: #ffffff; /* 改為與參考圖相同的純白底色 */
            z-index: 2000;
            transition: var(--transition);
            padding: 24px;
            box-shadow: 5px 0 25px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar.active {
            left: 0;
        }

        /* 頂部品牌 Logo 與 關閉按鈕 */
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo {
            height: 24px;
            width: auto;
        }

        .close-btn {
            font-size: 20px;
            color: #333333;
            background: none;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            padding: 5px;
        }

        .close-btn:hover {
            color: var(--gold-accent);
        }

        /* 選單容器樣式 */
        .sidebar-content {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 分類區塊 */
        .menu-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 分類小標題 (如：商品、探索) */
        .group-title {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 4px;
            padding-left: 8px;
        }

        /* 單個連結項目 */
        .menu-item {
            color: var(--text-dark);
            text-decoration: none;
            font-size: 16px;
            font-weight: 400;
            padding: 8px 8px;
            border-radius: 6px;
            transition: var(--transition);
            display: block;
        }

        .menu-item:hover {
            color: var(--gold-accent);
            background-color: #fcfbf7; /* 輕微的暖色調懸停背景 */
            padding-left: 14px; /* 優雅的微幅內縮效果 */
        }

        /* 階層縮進項目 (如：維修案例內分類) */
        .menu-item.sub-item {
            padding-left: 24px;
            font-size: 15px;
            color: #555555;
        }

        .menu-item.sub-item:hover {
            padding-left: 30px;
        }

        /* 側邊選單開啟時的背景遮罩 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3); /* 稍微調淡，呈現乾淨感 */
            z-index: 1500;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* --- 網頁主要內容區 (暫時留白) --- */
        main {
            margin-top: 70px;
            padding: 40px 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            min-height: calc(100vh - 180px);
        }

        /* 頁尾 */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-gray);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="menu-toggle" id="openMenu" aria-label="開啟選單">
                <i class="fa-solid fa-bars"></i>
            </button>
            <a href="#" class="logo-container">
                <img src="site logo.png" alt="Black Box Logo" class="logo-img">
            </a>
        </div>
        <div class="header-right">
            <a href="https://blackboxrepair.github.io/membership/" class="nav-btn" data-tooltip="會員中心">
                <i class="fa-solid fa-user"></i>
            </a>
            <a href="https://blackboxrepair.github.io/bookingonline/" class="nav-btn" data-tooltip="線上預約">
                <i class="fa-solid fa-calendar-check"></i>
            </a>
        </div>
    </header>

    <div class="overlay" id="overlay"></div>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <img src="site logo.png" alt="Logo" class="sidebar-logo">
            </div>
            <button class="close-btn" id="closeMenu" aria-label="關閉選單">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        
        <div class="sidebar-content">
            
            <div class="menu-group">
                <a href="#" class="menu-item" style="font-weight: 500;">首頁</a>
            </div>

            <div class="menu-group">
                <div class="group-title">服務項目</div>
                <a href="#process" class="menu-item">服務流程</a>
                <a href="#prices" class="menu-item">價格查詢</a>
            </div>

            <div class="menu-group">
                <div class="group-title">實作紀錄</div>
                <a href="#cases" class="menu-item">全部維修案例</a>
                <a href="#cases-iphone" class="menu-item sub-item">iPhone 維修</a>
                <a href="#cases-macbook" class="menu-item sub-item">MacBook 維修</a>
            </div>

            <div class="menu-group">
                <div class="group-title">專屬帳號</div>
                <a href="https://blackboxrepair.github.io/membership/" class="menu-item">會員中心</a>
                <a href="#locations" class="menu-item">服務站點</a>
            </div>

        </div>
    </nav>

    <main>
        </main>

    <footer>
        <p>&copy; 2026 BLACK BOX 維修中心. All Rights Reserved.</p>
    </footer>

    <script>
        const openMenuBtn = document.getElementById('openMenu');
        const closeMenuBtn = document.getElementById('closeMenu');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const sidebarLinks = document.querySelectorAll('.sidebar-content a');

        function toggleMenu() {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        openMenuBtn.addEventListener('click', toggleMenu);
        closeMenuBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        // 點擊選單連結後，自動關閉選單
        sidebarLinks.forEach(link => {
            link.addEventListener('click', () => {
                // 如果是連到外部(如會員中心)，不用特別阻止預設行為
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            });
        });
    </script>
</body>
</html>
