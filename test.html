<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BLACK BOX 黑盒子維修中心 2.0</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <style>
    :root{
      --bg:#eaf4ff;
      --bg2:#f7fbff;
      --blue:#2f72ff;
      --blue2:#7db2ff;
      --deep:#101824;
      --text:#121826;
      --muted:#627084;
      --line:rgba(16,24,36,.10);
      --card:rgba(255,255,255,.78);
      --card2:rgba(255,255,255,.92);
      --shadow:0 18px 45px rgba(45,104,190,.16);
      --soft-shadow:0 10px 25px rgba(15,30,60,.10);
      --radius:22px;
      --safe-bottom:env(safe-area-inset-bottom, 0px);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      color:var(--text);
      background:
        linear-gradient(rgba(255,255,255,.10), rgba(255,255,255,.06)),
        url("main_background.png") center center / cover no-repeat fixed;
      background-color:#7fc8ff;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 42%,rgba(255,255,255,.06));
      z-index:-1;
    }

    a{color:inherit;text-decoration:none}
    button,input,select,textarea{font-family:inherit}
    button{border:0;cursor:pointer}

    .app{
      width:min(100%, 480px);
      min-height:100vh;
      margin:0 auto;
      position:relative;
      padding:22px 20px calc(104px + var(--safe-bottom));
    }

    .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin:14px 0 18px}
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .brand-logo{
      display:block;
      width:180px;
      height:auto;
      object-fit:contain;
      filter:drop-shadow(0 8px 18px rgba(0,0,0,.10));
      position:relative;
      left:0px;
      top:-20px;
    }
    .quick-actions{display:flex;align-items:center;gap:10px}
    .quick-btn{
      width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);display:grid;place-items:center;box-shadow:var(--soft-shadow);position:relative;color:#0b1220;
    }
    .quick-btn iconify-icon{font-size:24px;color:currentColor}
    .quick-btn .bubble{position:absolute;top:-18px;left:50%;transform:translateX(-50%);background:#0a0e15;color:#fff;border-radius:14px;padding:4px 9px;font-size:11px;font-weight:800;white-space:nowrap}

    .hero{position:relative;margin-top:-10px;margin-bottom:16px;min-height:330px}
    .hero-copy{position:relative;z-index:2;width:57%;padding-top:10px}
    .hello{font-size:14px;color:#41516a;margin-bottom:11px;font-weight:650}
    .hero h1{margin:0 0 4px;font-size:22px;line-height:1.16;letter-spacing:-1px;font-weight:950;color:#0b1020}
    .hero h2{margin:0 0 13px;font-size:25px;line-height:1.08;letter-spacing:-1.1px;font-weight:950;color:var(--blue)}
    .hero p{margin:0 0 15px;font-size:12px;line-height:1.6;color:#4e5d72;font-weight:600}
    .primary-btn{
      min-height:38px;border-radius:999px;background:linear-gradient(145deg,#111a27,#02060c);color:#fff;padding:0 14px;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:850;box-shadow:0 12px 20px rgba(5,12,24,.18), inset 0 1px 0 rgba(255,255,255,.14);
    }
    .primary-btn iconify-icon{font-size:18px;color:currentColor}

    .hero-art{position:absolute;right:-22px;top:0px;width:64%;height:300px;z-index:1;display:flex;align-items:flex-start;justify-content:center;pointer-events:none}
    .main-photo{width:88%;height:auto;object-fit:contain;display:block;filter:drop-shadow(0 18px 28px rgba(28,81,164,.20))}
    .phone{
      position:absolute;right:38px;top:14px;width:142px;height:244px;border:8px solid #1b273c;border-radius:32px;transform:rotate(4deg);background:linear-gradient(155deg,#93c5ff,#e9f5ff);box-shadow:0 18px 32px rgba(28,81,164,.26);
    }
    .phone::before{content:"";position:absolute;top:-2px;left:39px;width:50px;height:14px;background:#1b273c;border-radius:0 0 12px 12px}
    .phone::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:86px;border-radius:12px;background:linear-gradient(160deg,#8ff0e9,#fff);box-shadow:0 8px 20px rgba(30,101,196,.18)}
    .bolt{position:absolute;right:84px;top:120px;font-size:45px;z-index:3;color:#111827;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
    .discount{position:absolute;border-radius:13px;background:linear-gradient(145deg,#3180ff,#1d5eff);color:#fff;box-shadow:0 15px 25px rgba(47,114,255,.35);padding:14px 17px;left:0;top:92px;transform:rotate(-1deg);z-index:4}
    .discount small{display:block;font-size:13px;font-weight:700;opacity:.9}.discount b{font-size:26px;letter-spacing:.3px}.discount span{font-size:18px;font-weight:900}
    .discount.white{background:rgba(255,255,255,.94);color:#111;left:-26px;top:182px;padding:12px 20px;box-shadow:0 12px 18px rgba(12,34,75,.12)}.discount.white b{font-size:22px}.discount.white small{color:#293142}
    .cloud{position:absolute;background:#fff;border-radius:999px;filter:drop-shadow(0 12px 20px rgba(80,128,180,.13));opacity:.92}.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud.c1{width:78px;height:31px;left:35px;top:0}.cloud.c1::before{width:37px;height:37px;left:13px;top:-18px}.cloud.c1::after{width:44px;height:44px;right:10px;top:-23px}.cloud.c2{width:108px;height:42px;right:-22px;bottom:34px}.cloud.c2::before{width:56px;height:56px;left:14px;top:-26px}.cloud.c2::after{width:62px;height:62px;right:14px;top:-31px}
    .bb-robot{position:absolute;right:0;bottom:0;width:128px;height:128px;border-radius:50%;background:linear-gradient(145deg,#fff,#dde8f7);box-shadow:0 20px 35px rgba(24,67,135,.18);z-index:5}.bb-face{position:absolute;left:23px;top:25px;width:72px;height:56px;border-radius:22px;background:#070b13}.bb-eye{position:absolute;top:20px;width:10px;height:24px;border-radius:999px;background:#fff}.bb-eye.e1{left:20px}.bb-eye.e2{right:20px}.bb-ear{position:absolute;right:-8px;top:43px;width:24px;height:34px;border-radius:50%;background:linear-gradient(#fff,#dce8f8);box-shadow:inset 0 -5px 8px rgba(25,70,130,.12)}.bb-hand{position:absolute;left:-22px;bottom:21px;width:32px;height:62px;border-radius:20px;background:linear-gradient(#fff,#dce8f8);transform:rotate(24deg)}.wrench{position:absolute;left:-42px;bottom:40px;font-size:54px;color:#c5cfdd;transform:rotate(-12deg);z-index:6}.bb-logo{position:absolute;left:43px;bottom:20px;width:38px;height:38px;border-radius:10px;background:#07090c;display:grid;place-items:center;color:#fff}.bb-logo iconify-icon{font-size:24px;color:currentColor}

    .glass-nav{display:grid;grid-template-columns:repeat(4,1fr);width:100%;background:rgba(255,255,255,.75);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.75);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;margin:-110px auto 18px}
    .nav-tile{min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;position:relative;color:var(--blue);font-weight:850;font-size:16px;background:transparent}
    .nav-tile:not(:last-child)::after{content:"";position:absolute;right:0;top:18%;height:64%;width:1px;background:rgba(17,24,39,.10)}
    .nav-tile iconify-icon{font-size:38px;color:currentColor;filter:drop-shadow(0 9px 8px rgba(47,114,255,.24))}
    .nav-tile img{width:46px;height:46px;object-fit:contain;display:block;filter:drop-shadow(0 9px 8px rgba(47,114,255,.24))}
    .nav-tile span{color:#121826}

    .cards{
      --card-gap:12px;
      --small-card-height:112px;
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      grid-template-rows:var(--small-card-height) var(--small-card-height) var(--small-card-height);
      gap:var(--card-gap);
      margin-top:8px;
      align-items:stretch;
    }
    .feature-card{
      position:relative;
      width:100%;
      height:100%;
      min-height:0;
      border-radius:18px;
      padding:18px;
      overflow:hidden;
      background:#ffffff;
      box-shadow:var(--soft-shadow);
      border:1px solid rgba(255,255,255,.72);
      aspect-ratio:auto;
    }
    .feature-card.big{grid-column:1;grid-row:1 / span 2;background:#6fadf5;color:#fff;overflow:visible}.feature-card.dark{background:#383a3c;color:#fff}.feature-card.wide{min-height:0}
    .feature-card:nth-child(2),.feature-card:nth-child(4),.feature-card:nth-child(5){background:#ffffff;color:#0f172a}
    .feature-card:nth-child(3){background:#383a3c;color:#fff}
    .card-kicker{display:block;width:100%;text-align:left;font-size:11px;line-height:1.2;font-weight:750;letter-spacing:.02em;color:rgba(15,23,42,.68);margin-bottom:9px}
    .feature-card.big .card-kicker,.feature-card.dark .card-kicker{color:rgba(255,255,255,.78)}
    .feature-card.big .card-text-group{position:absolute;left:18px;top:18px;right:18px;z-index:2}
    .card-title{margin:0;width:100%;text-align:left;font-size:16px;line-height:1.16;letter-spacing:-.04em;font-weight:950;color:currentColor}
    .card-subtitle{margin:9px 0 0;width:100%;text-align:left;font-size:10px;line-height:1.38;font-weight:650;color:rgba(15,23,42,.62)}
    .feature-card.big .card-subtitle,.feature-card.dark .card-subtitle{color:rgba(255,255,255,.78)}
    .card-pill{position:absolute;left:18px;bottom:18px;height:30px;border-radius:999px;background:#fff;color:#111827;padding:0 13px;display:inline-flex;align-items:center;justify-content:flex-start;gap:7px;font-size:11.5px;font-weight:900;box-shadow:0 10px 20px rgba(20,70,140,.14);text-align:left;z-index:3}
    .card-ornament{position:absolute;right:-21%;bottom:0;width:86%;max-width:226px;height:auto;object-fit:contain;display:block;pointer-events:none;filter:drop-shadow(0 14px 22px rgba(20,70,140,.18));z-index:1}
    .feature-card.big .card-kicker{font-size:10px}
    .feature-card.big .card-title{font-size:16px;line-height:1.16}
    .feature-card.big .card-subtitle{font-size:10px;line-height:1.38;margin-top:6px}
    .card-pill iconify-icon{font-size:15px;color:currentColor}
    .feature-card:nth-child(2) .card-title,.feature-card:nth-child(3) .card-title,.feature-card:nth-child(4) .card-title,.feature-card:nth-child(5) .card-title{font-size:16px;line-height:1.16;text-align:left}
    .feature-card:nth-child(2) .card-subtitle,.feature-card:nth-child(3) .card-subtitle,.feature-card:nth-child(4) .card-subtitle,.feature-card:nth-child(5) .card-subtitle{font-size:10px;line-height:1.38;margin-top:6px;text-align:left}
    .feature-card:nth-child(2){grid-column:2;grid-row:1}
    .feature-card:nth-child(3){grid-column:2;grid-row:2}
    .feature-card:nth-child(4){grid-column:1;grid-row:3}
    .feature-card:nth-child(5){grid-column:2;grid-row:3}
    .tag{display:inline-flex;align-items:center;border-radius:999px;background:rgba(255,255,255,.28);padding:5px 12px;font-size:12px;font-weight:850;margin-bottom:10px}.feature-card:not(.big):not(.dark) .tag{background:#e9f2ff;color:#2a61c8}
    .feature-card h3{margin:0;font-size:20px;line-height:1.28;letter-spacing:-.4px}.feature-card.big h3{font-size:28px}.feature-card p{margin:9px 0 0;color:currentColor;opacity:.78;font-weight:650;font-size:13px;line-height:1.55}.feature-card .mini-btn{position:absolute;left:18px;bottom:18px;background:#fff;color:#0f172a;border-radius:999px;padding:10px 14px;font-size:14px;font-weight:900;display:inline-flex;align-items:center;gap:6px}.feature-card .mini-btn iconify-icon{color:currentColor}.card-icon{position:absolute;right:12px;bottom:10px;font-size:86px;color:rgba(47,114,255,.9);filter:drop-shadow(0 12px 15px rgba(31,93,190,.18))}.big .card-icon{right:-5px;bottom:-3px;font-size:128px;color:#fff}.dark .card-icon{color:#70a7ff}.coin{color:#f7c545!important}

    .member-strip{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.88);border-radius:16px;overflow:hidden;box-shadow:var(--soft-shadow);margin-top:14px}.member-item{display:flex;align-items:center;gap:12px;min-height:66px;padding:12px 16px;background:rgba(255,255,255,.72)}.member-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#2f72ff,#87b8ff);color:#fff;box-shadow:0 10px 17px rgba(47,114,255,.22)}.member-icon iconify-icon{font-size:28px;color:currentColor}.member-text small{display:block;color:#68768b;font-weight:700;font-size:12px}.member-text b{font-size:18px;line-height:1.2}.member-arrow{margin-left:auto;color:#101827;font-size:23px}

    .section{display:none;animation:fadeUp .28s ease both}.section.active{display:block}.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin:18px 0 16px}.page-title small{display:block;color:var(--blue);font-weight:950;margin-bottom:5px}.page-title h2{margin:0;font-size:30px;letter-spacing:-1px}.back-home{border-radius:999px;background:#0e1724;color:#fff;padding:10px 14px;font-weight:850}
    .search-box{display:flex;gap:8px;background:rgba(255,255,255,.82);border-radius:16px;padding:10px;box-shadow:var(--soft-shadow);margin-bottom:12px}.search-box input,.search-box select{height:44px;border:0;outline:0;background:#f3f7fc;border-radius:11px;padding:0 12px;font-size:15px;min-width:0}.search-box input{flex:1}.search-box select{width:124px}.list{display:grid;gap:10px}.list-card{background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.75);border-radius:16px;padding:16px;box-shadow:var(--soft-shadow)}.list-card h3{margin:0 0 6px;font-size:18px}.list-card p{margin:0;color:#617085;line-height:1.6;font-size:14px}.price{margin-top:10px;color:var(--blue);font-size:22px;font-weight:950}.skeleton{height:86px;border-radius:22px;background:linear-gradient(90deg,rgba(255,255,255,.55),rgba(255,255,255,.95),rgba(255,255,255,.55));background-size:200% 100%;animation:shine 1.2s linear infinite}.empty{padding:28px;text-align:center;color:#6b7789;background:rgba(255,255,255,.72);border-radius:16px;font-weight:700}

    .bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,480px);padding:8px 18px calc(10px + var(--safe-bottom));z-index:50}.bottom-shell{height:72px;border-radius:28px 28px 0 0;background:rgba(255,255,255,.82);backdrop-filter:blur(26px);box-shadow:0 -16px 35px rgba(18,44,86,.14);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;border:1px solid rgba(255,255,255,.8)}.bottom-link{height:60px;background:transparent;color:#6b7688;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:850}.bottom-link iconify-icon{font-size:25px;color:currentColor}.bottom-link.active{color:#05080d}.reserve-fab{width:72px;height:72px;margin-top:-38px;border-radius:50%;background:linear-gradient(145deg,#111a27,#02060c);color:#fff;display:grid;place-items:center;box-shadow:0 18px 28px rgba(0,0,0,.25);border:5px solid rgba(255,255,255,.86);font-size:12px;font-weight:900}.reserve-fab iconify-icon{font-size:28px;margin-bottom:2px;color:currentColor}

    .modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;background:rgba(5,10,20,.36);backdrop-filter:blur(8px)}.modal.show{display:flex}.modal-card{width:min(100%,480px);background:#fff;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + var(--safe-bottom));box-shadow:0 -18px 45px rgba(0,0,0,.2);animation:sheet .24s ease both}.modal-card h2{margin:0 0 16px}.form{display:grid;gap:10px}.form input,.form select,.form textarea{width:100%;border:0;background:#f2f6fb;border-radius:12px;padding:14px;font-size:16px;outline:0}.form textarea{min-height:90px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.submit-btn{height:52px;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:950}.ghost-btn{height:48px;border-radius:12px;background:#eef3f9;color:#1f2937;font-weight:900}

    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes shine{to{background-position:-200% 0}}
    @keyframes sheet{from{transform:translateY(100%)}to{transform:none}}

    @media (max-width:380px){
      .brand-logo{width:158px}
      .app{padding-left:14px;padding-right:14px}.hero h1{font-size:27px}.hero h2{font-size:31px}.hero p{font-size:14px}.hero-copy{width:58%}.hero-art{right:-35px;width:67%}.nav-tile{font-size:13px}.nav-tile iconify-icon{font-size:34px}.feature-card{padding:15px}.feature-card h3{font-size:18px}.feature-card.big h3{font-size:25px}.quick-actions{gap:6px}.quick-btn{width:42px;height:42px}
    }
  </style>
</head>
<body>
  <main class="app">

    <header class="topbar">
      <a class="brand" href="#home" data-route="home" aria-label="BLACK BOX 首頁">
        <img class="brand-logo" src="site logo.png" alt="BLACK BOX Fix My Device" />
      </a>

    </header>

    <section id="home" class="section active">
      <div class="hero">
        <div class="hero-copy">
          <div class="hello">您好！ 👋</div>
          <h1>現在更換電池</h1>
          <h2>最高享 20% 優惠</h2>
          <p>BLACK BOX 會員專屬優惠<br>為您的裝置提供最佳維護服務。</p>
          <button class="primary-btn" data-route="wallet">查看優惠詳情 <iconify-icon icon="solar:arrow-right-linear"></iconify-icon></button>
        </div>
        <div class="hero-art" aria-hidden="true">
          <img class="main-photo" src="main_photo.png" alt="" />
        </div>
      </div>


      <nav class="glass-nav" aria-label="主要功能">
        <button class="nav-tile" data-route="flow"><img src="bottom/bottom_process.png" alt="服務流程" /><span>服務流程</span></button>
        <button class="nav-tile" data-route="quote"><img src="bottom/bottom_price.png" alt="維修報價" /><span>維修報價</span></button>
        <button class="nav-tile" data-route="search"><img src="bottom/bottom_accessories.png" alt="配件挑選" /><span>配件挑選</span></button>
        <button class="nav-tile" data-route="stores"><img src="bottom/bottom_store.png" alt="門市據點" /><span>門市據點</span></button>
      </nav>

      <section class="cards">
        <button class="feature-card big" data-route="quote">
          <div class="card-text-group">
            <span class="card-kicker">電池更換</span>
            <h3 class="card-title">原廠品質<br>安心保證</h3>
            <p class="card-subtitle">所有 iPhone 電池皆享優惠</p>
          </div>
          <img class="card-ornament" src="ornamets/ornaments_battery.png" alt="" />
          <span class="card-pill">立即查看 <iconify-icon icon="solar:arrow-right-linear"></iconify-icon></span>
        </button>

        <button class="feature-card" data-route="booking">
          <span class="card-kicker">現場維修</span>
          <h3 class="card-title">快速維修<br>立即解決</h3>
          <p class="card-subtitle">現場最快 40 分鐘立即取件</p>
        </button>

        <button class="feature-card dark" data-route="booking">
          <span class="card-kicker">線上預約</span>
          <h3 class="card-title">免等待<br>快速預約</h3>
          <p class="card-subtitle">選擇時間，輕鬆預約</p>
        </button>

        <button class="feature-card" data-route="cases">
          <span class="card-kicker">維修案例</span>
          <h3 class="card-title">各式型號<br>維修無礙</h3>
          <p class="card-subtitle">從手機到遊戲機，筆電、平板包羅萬象！</p>
        </button>

        <button class="feature-card" data-route="member">
          <span class="card-kicker">會員專屬</span>
          <h3 class="card-title">累積點數<br>換取折扣</h3>
          <p class="card-subtitle">更多會員專屬優惠等你來拿！</p>
        </button>
      </section>

      <div class="member-strip">
        <button class="member-item" data-route="wallet"><span class="member-icon"><iconify-icon icon="solar:letter-p-bold"></iconify-icon></span><span class="member-text"><small>我的點數</small><b id="homePoints">12,500 P</b></span><iconify-icon class="member-arrow" icon="solar:alt-arrow-right-linear"></iconify-icon></button>
        <button class="member-item" data-route="wallet"><span class="member-icon"><iconify-icon icon="solar:ticket-sale-bold-duotone"></iconify-icon></span><span class="member-text"><small>優惠券</small><b id="homeCoupons">3 張</b></span><iconify-icon class="member-arrow" icon="solar:alt-arrow-right-linear"></iconify-icon></button>
      </div>
    </section>

    <section id="search" class="section">
      <div class="page-head"><div class="page-title"><small>ACCESSORIES</small><h2>配件挑選</h2></div><button class="back-home" data-route="home">首頁</button></div>
      <div class="search-box"><input id="productKeyword" placeholder="搜尋型號、商品或維修項目"><select id="productType"><option value="">全部分類</option><option value="battery">電池</option><option value="screen">螢幕</option><option value="repair">維修</option></select></div>
      <div id="productList" class="list"></div>
    </section>

    <section id="stores" class="section">
      <div class="page-head"><div class="page-title"><small>STORES</small><h2>門市據點</h2></div><button class="back-home" data-route="home">首頁</button></div>
      <div id="storeList" class="list"></div>
    </section>

    <section id="flow" class="section">
      <div class="page-head"><div class="page-title"><small>SERVICE FLOW</small><h2>服務流程</h2></div><button class="back-home" data-route="home">首頁</button></div>
      <div id="flowList" class="list"></div>
    </section>

    <section id="quote" class="section">
      <div class="page-head"><div class="page-title"><small>REPAIR QUOTE</small><h2>維修報價</h2></div><button class="back-home" data-route="home">首頁</button></div>
      <div class="search-box"><input id="quoteKeyword" placeholder="輸入 iPhone 型號或維修項目"><select id="quoteCategory"><option value="">全部報價</option><option value="battery">電池</option><option value="screen">螢幕</option><option value="backglass">背蓋</option><option value="storage">容量擴充</option></select></div>
      <div id="quoteList" class="list"></div>
    </section>

    <section id="wallet" class="section">
      <div class="page-head"><div class="page-title"><small>MEMBER WALLET</small><h2>會員錢包</h2></div><button class="back-home" data-route="home">首頁</button></div>
      <div id="walletList" class="list"></div>
    </section>

    <section id="booking" class="section">
      <div class="page-head"><div class="page-title"><small>BOOKING</small><h2>預約維修</h2></div><button class="back-home" data-route="home">首頁</button></div>
      <div class="list-card"><h3>快速預約</h3><p>填寫資料後可送出到 Supabase 的 <b>bookings</b> 資料表。若您目前資料庫尚未建立 bookings 表，請先建立欄位。</p><button class="submit-btn" style="margin-top:14px;width:100%" data-open-booking>開始預約</button></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="底部選單">
    <div class="bottom-shell">
      <button class="bottom-link active" data-route="home"><iconify-icon icon="solar:home-2-bold"></iconify-icon><span>首頁</span></button>
      <button class="bottom-link" data-route="wallet"><iconify-icon icon="solar:wallet-money-bold-duotone"></iconify-icon><span>會員錢包</span></button>
      <button class="bottom-link reserve-fab" data-route="booking"><iconify-icon icon="solar:plain-3-bold"></iconify-icon><span>預約維修</span></button>
      <button class="bottom-link" data-route="quote"><iconify-icon icon="solar:bill-list-bold-duotone"></iconify-icon><span>我的預約</span></button>
      <button class="bottom-link" data-route="wallet"><iconify-icon icon="solar:user-rounded-bold-duotone"></iconify-icon><span>會員專區</span></button>
    </div>
  </nav>

  <div class="modal" id="bookingModal" aria-hidden="true">
    <div class="modal-card">
      <h2>預約維修</h2>
      <form class="form" id="bookingForm">
        <input name="name" placeholder="姓名" required>
        <input name="phone" placeholder="手機號碼" required>
        <div class="form-row"><select name="store"><option>勤美公益店</option><option>沙鹿站前店</option></select><input name="date" type="date" required></div>
        <div class="form-row"><input name="time" type="time" required><input name="model" placeholder="裝置型號"></div>
        <textarea name="issue" placeholder="故障狀況 / 想維修的項目"></textarea>
        <button class="submit-btn" type="submit">送出預約</button>
        <button class="ghost-btn" type="button" data-close-modal>稍後再說</button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://nszwpwimwxvjguoalzwt.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIc3N1cGFyYmFzZSIsInJlZiI6Im5zendwd2ltd3h2amd1b2Fsend0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMzY1NzYsImV4cCI6MjA4MTcxMjU3Nn0.TaAt4aqEhDsONWtDCagD5rlTMknEWfhq8fMVL1Rt4lg';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (s, root=document) => root.querySelector(s);
    const $$ = (s, root=document) => [...root.querySelectorAll(s)];

    const fallback = {
      stores: [
        { name:'勤美公益店', address:'台中市西區公益路145號', hours:'每日 11:00-20:00', phone:'04-23015157', map_url:'https://maps.app.goo.gl/tKzhoHtaeiHUD1d76?g_st=ic' },
        { name:'沙鹿站前店', address:'台中市沙鹿區沙田路149號', hours:'每日 12:00-21:00', phone:'04-26633009', map_url:'https://maps.app.goo.gl/rppbPCmLMn7TUNiv7?g_st=ic' }
      ],
      flows: [
        { title:'手機維修流程', description:'初步評估報價 → 功能檢測 → 拆機檢修 → 更換零件 → 修後檢測 → 通知取件 → 現場交機' },
        { title:'筆電維修流程', description:'初步檢測 → 報價確認 → 等候料件 → 完整維修 → 整機檢測 → 現場交機' },
        { title:'資料救援流程', description:'初步介紹 → 填寫維修單 → 實驗室檢測報價 → 確認檔案清單 → 備份資料 → 現場驗收' }
      ],
      quotes: [
        { model:'iPhone 15 Pro', category:'battery', item:'原廠電池更換', price:3390, note:'現場快速更換，資料不流失。' },
        { model:'iPhone 14 Pro', category:'screen', item:'原廠螢幕更換', price:11200, note:'原廠零件，維修後完整檢測。' },
        { model:'iPhone 13', category:'storage', item:'容量擴充 256GB', price:4500, note:'完修後提供 3 個月保固。' }
      ],
      products: [
        { name:'iPhone 原廠電池', type:'battery', description:'蘋果原廠認證 IRP 維修中心，支援更換後系統顯示原廠零件。' },
        { name:'iPhone 螢幕維修', type:'screen', description:'現場面對面維修，修後進行基本功能檢測。' },
        { name:'iPhone 容量擴充', type:'repair', description:'支援多款 iPhone NAND 容量升級服務。' }
      ],
      wallet: [
        { title:'我的點數', description:'目前累積點數', value:'12,500 P' },
        { title:'優惠券', description:'可使用優惠券', value:'3 張' },
        { title:'會員等級', description:'BLACK BOX 會員專屬', value:'VIP' }
      ]
    };

    function money(n){ return Number(n || 0).toLocaleString('zh-TW', { style:'currency', currency:'TWD', maximumFractionDigits:0 }); }
    function showSkeleton(el, count=3){ el.innerHTML = Array.from({length:count}).map(()=>'<div class="skeleton"></div>').join(''); }
    function showEmpty(el, msg='目前沒有資料'){ el.innerHTML = `<div class="empty">${msg}</div>`; }

    async function fetchTable(table, fallbackData, order='id'){
      try{
        let query = supabaseClient.from(table).select('*');
        query = query.order(order, { ascending:true });
        const { data, error } = await query;
        if(error) throw error;
        return data && data.length ? data : fallbackData;
      }catch(err){
        console.warn(`[Supabase] ${table} 讀取失敗，使用預設資料：`, err.message);
        return fallbackData;
      }
    }

    function routeTo(id){
      $$('.section').forEach(s => s.classList.toggle('active', s.id === id));
      $$('.bottom-link').forEach(b => b.classList.toggle('active', b.dataset.route === id));
      window.scrollTo({top:0, behavior:'smooth'});
      if(id === 'search') loadProducts();
      if(id === 'stores') loadStores();
      if(id === 'flow') loadFlows();
      if(id === 'quote') loadQuotes();
      if(id === 'wallet') loadWallet();
    }

    $$('[data-route]').forEach(btn => btn.addEventListener('click', e => { e.preventDefault(); routeTo(btn.dataset.route); }));

    async function loadStores(){
      const el = $('#storeList'); showSkeleton(el,2);
      const rows = await fetchTable('stores', fallback.stores, 'id');
      el.innerHTML = rows.map(r => `<article class="list-card"><h3>${r.name || '門市'}</h3><p>${r.address || ''}<br>${r.hours || ''}<br>${r.phone ? `客服電話：${r.phone}` : ''}</p>${r.map_url ? `<a class="price" style="display:inline-block;font-size:16px" href="${r.map_url}" target="_blank">查看地圖 →</a>` : ''}</article>`).join('');
    }

    async function loadFlows(){
      const el = $('#flowList'); showSkeleton(el,3);
      const rows = await fetchTable('service_flows', fallback.flows, 'id');
      el.innerHTML = rows.map((r,i) => `<article class="list-card"><h3>${String(i+1).padStart(2,'0')}　${r.title || r.name || '服務流程'}</h3><p>${r.description || r.steps || ''}</p></article>`).join('');
    }

    async function loadQuotes(){
      const el = $('#quoteList'); showSkeleton(el,3);
      const rows = await fetchTable('repair_quotes', fallback.quotes, 'id');
      const keyword = ($('#quoteKeyword').value || '').trim().toLowerCase();
      const cat = $('#quoteCategory').value;
      const filtered = rows.filter(r => {
        const text = `${r.model || ''} ${r.item || ''} ${r.name || ''}`.toLowerCase();
        return (!keyword || text.includes(keyword)) && (!cat || r.category === cat);
      });
      if(!filtered.length) return showEmpty(el,'找不到符合的報價');
      el.innerHTML = filtered.map(r => `<article class="list-card"><h3>${r.model || ''} ${r.item || r.name || ''}</h3><p>${r.note || r.description || '實際價格依現場檢測為準。'}</p><div class="price">${r.price ? money(r.price) : '請洽門市'}</div></article>`).join('');
    }

    async function loadProducts(){
      const el = $('#productList'); showSkeleton(el,3);
      const rows = await fetchTable('products', fallback.products, 'id');
      const keyword = ($('#productKeyword').value || '').trim().toLowerCase();
      const type = $('#productType').value;
      const filtered = rows.filter(r => {
        const text = `${r.name || ''} ${r.title || ''} ${r.description || ''}`.toLowerCase();
        return (!keyword || text.includes(keyword)) && (!type || r.type === type || r.category === type);
      });
      if(!filtered.length) return showEmpty(el,'找不到符合的產品或服務');
      el.innerHTML = filtered.map(r => `<article class="list-card"><h3>${r.name || r.title || '服務項目'}</h3><p>${r.description || r.note || ''}</p></article>`).join('');
    }

    async function loadWallet(){
      const el = $('#walletList'); showSkeleton(el,3);
      const rows = await fetchTable('member_wallet', fallback.wallet, 'id');
      el.innerHTML = rows.map(r => `<article class="list-card"><h3>${r.title || r.name}</h3><p>${r.description || ''}</p><div class="price">${r.value || ''}</div></article>`).join('');
    }

    $('#quoteKeyword').addEventListener('input', loadQuotes);
    $('#quoteCategory').addEventListener('change', loadQuotes);
    $('#productKeyword').addEventListener('input', loadProducts);
    $('#productType').addEventListener('change', loadProducts);

    function openBooking(){ $('#bookingModal').classList.add('show'); $('#bookingModal').setAttribute('aria-hidden','false'); }
    function closeBooking(){ $('#bookingModal').classList.remove('show'); $('#bookingModal').setAttribute('aria-hidden','true'); }
    $$('[data-open-booking]').forEach(b => b.addEventListener('click', openBooking));
    $('[data-close-modal]').addEventListener('click', closeBooking);
    $('#bookingModal').addEventListener('click', e => { if(e.target.id === 'bookingModal') closeBooking(); });
    $('[data-open-cs]').addEventListener('click', () => window.open('https://lin.ee/', '_blank'));

    $('#bookingForm').addEventListener('submit', async e => {
      e.preventDefault();
      const form = new FormData(e.currentTarget);
      const payload = Object.fromEntries(form.entries());
      payload.created_at = new Date().toISOString();
      const btn = e.currentTarget.querySelector('.submit-btn');
      const old = btn.textContent;
      btn.textContent = '送出中...'; btn.disabled = true;
      try{
        const { error } = await supabaseClient.from('bookings').insert(payload);
        if(error) throw error;
        alert('預約已送出，我們會盡快與您聯繫。');
        e.currentTarget.reset(); closeBooking();
      }catch(err){
        console.warn('[Supabase] bookings 寫入失敗：', err.message);
        alert('目前無法寫入 bookings 資料表，請確認 Supabase 是否已建立表格與 RLS insert 權限。');
      }finally{
        btn.textContent = old; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
