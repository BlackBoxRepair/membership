<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小星運 - 黑盒子手機維修</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --w: 180px; --h: 270px; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #000; overflow: hidden; }
        
        /* 載入畫面 */
        #loading {
            position: fixed; inset: 0; background: #000; z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s;
        }
        .lds-dual-ring { width: 40px; height: 40px; border: 4px solid #fff; border-color: #fff transparent #fff transparent; border-radius: 50%; animation: spin 1.2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 背景與卡牌 */
        .game-bg { position: fixed; inset: 0; background: url('game desk.png') center/cover; z-index: 1; }
        .stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; perspective: 1200px; z-index: 10; }
        .carousel { position: relative; width: var(--w); height: var(--h); transform-style: preserve-3d; }
        
        .card { position: absolute; inset: 0; transform-style: preserve-3d; transition: all 0.5s ease; opacity: 0; pointer-events: none; }
        .card-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card-front { background: url('Taro Front.png') center/100% 100%; }
        .card-back { background: url('Taro Back.png') center/100% 100%; transform: rotateY(180deg); display: flex; align-items: center; justify-content: center; }
        .fortune { color: #432a0a; font-size: 1.5rem; font-weight: bold; text-align: center; opacity: 0; }

        .card.is-flipped { transform: translateZ(400px) rotateY(180deg) translateY(-100px) !important; z-index: 100 !important; opacity: 1 !important; }
        .card.is-flipped .fortune { opacity: 1; transition: 0.5s 0.3s; }
    </style>
</head>
<body>
    <div id="loading"><div class="lds-dual-ring"></div><p style="color:white; margin-top:20px;">載入中...</p></div>
    <div class="game-bg"></div>
    <div class="stage" id="main"><div class="carousel" id="box"></div></div>

<script>
    // 配置資料 
    const URL = 'https://nszwpwimtwxvjguolzwt.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zendwd2ltd3h2amd1b2Fsend0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMzY1NzYsImV4cCI6MjA4MTcxMjU3Nn0.TaAt4aqEhDsONWtDCagD5rlTMknEWfhq8fMVL1Rt4lg';
    const FORTUNES = ["財運大吉", "心想事成", "萬事如意", "驚喜連連", "美夢成真", "元氣滿滿", "步步高升", "福氣滿門", "貴人相助", "吉星高照"];

    let idx = 0, sx = 0, sy = 0, isFlip = false, sb = null;

    function render() {
        const cards = document.querySelectorAll('.card');
        cards.forEach((c, i) => {
            let css = "opacity: 0; pointer-events: none; z-index: 1; transform: translateZ(-1000px);"; // 預設全藏 
            if (i === idx) {
                css = "opacity: 1; pointer-events: auto; z-index: 20; transform: translateZ(200px);"; // 中間亮的 
            } else if (i === (idx - 1 + 10) % 10) {
                css = "opacity: 0.4; z-index: 10; transform: translateX(-150px) rotateY(30deg) translateZ(0px);"; // 左邊暗的 
            } else if (i === (idx + 1) % 10) {
                css = "opacity: 0.4; z-index: 10; transform: translateX(150px) rotateY(-30deg) translateZ(0px);"; // 右邊暗的 
            }
            c.style.cssText = css;
        });
    }

    // 啟動流程
    window.addEventListener('load', () => {
        const b = document.getElementById('box');
        for (let i = 0; i < 10; i++) {
            const d = document.createElement('div');
            d.className = 'card';
            d.innerHTML = `<div class="card-face card-front"></div><div class="card-back card-face"><div class="fortune">${FORTUNES[i]}</div></div>`;
            b.appendChild(d);
        }
        render();

        // 不管 SDK 載入成功沒，1.5秒後一定關閉載入畫面 
        setTimeout(() => {
            const ld = document.getElementById('loading');
            if(ld) { ld.style.opacity = '0'; setTimeout(()=> ld.remove(), 500); }
        }, 1500);

        // 安全初始化 Supabase 
        try {
            if (typeof supabase !== 'undefined') {
                sb = supabase.createClient(URL, KEY);
            }
        } catch (e) { console.log("SDK not ready"); }

        const m = document.getElementById('main');
        m.ontouchstart = e => { sx = e.touches[0].pageX; sy = e.touches[0].pageY; };
        m.ontouchend = e => {
            if (isFlip) return;
            const dx = sx - e.changedTouches[0].pageX;
            const dy = sy - e.changedTouches[0].pageY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) {
                    idx = dx > 0 ? (idx + 1) % 10 : (idx - 1 + 10) % 10;
                    render();
                }
            } else if (dy > 60) {
                const ac = document.querySelectorAll('.card')[idx];
                if (ac) { isFlip = true; ac.classList.add('is-flipped'); }
            }
        };
    });
</script>
</body>
</html>
