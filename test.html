<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小星運 - 黑盒子手機維修中心</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --card-w: 180px; --card-h: 270px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; width: 100vw; height: 100vh; 
            background-color: #000; overflow: hidden; 
        }

        .game-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('game%20desk.png') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        .stage {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            perspective: 1200px; z-index: 10;
        }

        .carousel {
            position: relative; width: var(--card-w); height: var(--card-h);
            transform-style: preserve-3d;
        }

        .card {
            position: absolute; width: 100%; height: 100%;
            left: 0; top: 0;
            transform-style: preserve-3d;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0; /* 預設全部隱藏 */
            pointer-events: none;
        }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .card-front { 
            background: url('Taro%20Front.png') no-repeat center center; 
            background-size: 100% 100%; 
        }

        .card-back { 
            background: url('Taro%20Back.png') no-repeat center center; 
            background-size: 100% 100%; 
            transform: rotateY(180deg); 
            display: flex; align-items: center; justify-content: center; 
        }

        .fortune-text { 
            color: #432a0a; font-size: 1.5rem; font-weight: bold; text-align: center; 
            padding: 0 20px; opacity: 0; margin-top: -15px; 
        }

        .card.is-flipped {
            transform: translateZ(450px) rotateY(180deg) translateY(-120px) !important;
            z-index: 100 !important;
            opacity: 1 !important;
        }
        .card.is-flipped .fortune-text { opacity: 1; transition: 0.5s 0.3s; }

        #mask { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); z-index: 1000; 
            display: none; color: white; flex-direction: column; 
            align-items: center; justify-content: center; 
        }
    </style>
</head>
<body>
    <div id="mask"><h2>您已參加過活動</h2></div>
    <div class="game-bg"></div>
    <div class="stage" id="touchArea">
        <div class="carousel" id="cardBox"></div>
    </div>

<script>
    const STAR_CONFIG = {
        url: 'https://nszwpwimtwxvjguolzwt.supabase.co',
        key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zendwd2ltd3h2amd1b2Fsend0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMzY1NzYsImV4cCI6MjA4MTcxMjU3Nn0.TaAt4aqEhDsONWtDCagD5rlTMknEWfhq8fMVL1Rt4lg', // [cite: 67]
        fortunes: ["財運大吉", "心想事成", "驚喜連連", "貴人相助", "元氣滿滿", "萬事如意", "美夢成真", "步步高升", "福氣滿滿", "吉星高照"]
    };

    let star_supabase = null;
    let star_currentIndex = 0;
    let star_startX = 0;
    let star_startY = 0;
    let star_isFlipped = false;

    function updateStarCards() {
        const cards = document.querySelectorAll('.card');
        const total = cards.length;
        if (total === 0) return;

        cards.forEach((card, i) => {
            // 一率初始化為不可見與低層級
            card.style.opacity = "0";
            card.style.zIndex = "1";
            card.style.pointerEvents = "none";

            if (i === star_currentIndex) {
                // 正中間：100% 透明度
                card.style.opacity = "1";
                card.style.zIndex = "20";
                card.style.transform = "translateZ(200px)";
                card.style.pointerEvents = "auto";
            } else if (i === (star_currentIndex - 1 + total) % total) {
                // 左側：40% 透明度
                card.style.opacity = "0.4";
                card.style.zIndex = "10";
                card.style.transform = "translateX(-150px) rotateY(30deg) translateZ(0px)";
            } else if (i === (star_currentIndex + 1) % total) {
                // 右側：40% 透明度
                card.style.opacity = "0.4";
                card.style.zIndex = "10";
                card.style.transform = "translateX(150px) rotateY(-30deg) translateZ(0px)";
            } else {
                // 遠離視線避免干擾
                card.style.transform = "translateZ(-1000px)";
            }
        });
    }

    // 確保頁面資源（包括 SDK）載入完畢
    window.onload = function() {
        const box = document.getElementById('cardBox');
        for (let i = 0; i < 10; i++) {
            const el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = `
                <div class="card-face card-front"></div>
                <div class="card-back card-face">
                    <div class="fortune-text">${STAR_CONFIG.fortunes[i]}</div>
                </div>`;
            box.appendChild(el);
        }

        // 初始化 Supabase [cite: 67]
        if (typeof supabase !== 'undefined') {
            star_supabase = supabase.createClient(STAR_CONFIG.url, STAR_CONFIG.key);
        }

        // 立即顯示第一張卡牌
        updateStarCards();

        const area = document.getElementById('touchArea');
        area.addEventListener('touchstart', e => { 
            star_startX = e.touches[0].pageX; 
            star_startY = e.touches[0].pageY; 
        });

        area.addEventListener('touchend', e => {
            if (star_isFlipped) return;
            const dx = star_startX - e.changedTouches[0].pageX;
            const dy = star_startY - e.changedTouches[0].pageY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) {
                    star_currentIndex = dx > 0 ? (star_currentIndex + 1) % 10 : (star_currentIndex - 1 + 10) % 10;
                    updateStarCards();
                }
            } else if (dy > 60) {
                const activeCard = document.querySelectorAll('.card')[star_currentIndex];
                if (activeCard && !star_isFlipped) {
                    star_isFlipped = true;
                    activeCard.classList.add('is-flipped');
                    // 這裡可以呼叫後端 Function 寫入紀錄 [cite: 24, 59]
                }
            }
        });
    };
</script>
</body>
</html>
