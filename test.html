<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小星運 - 黑盒子手機維修中心</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --card-w: 180px; --card-h: 270px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; width: 100vw; height: 100vh; 
            background-color: #000; overflow: hidden; 
        }

        /* 網站背景 */
        .game-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('game desk.png') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        .stage {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            perspective: 1200px; z-index: 10;
        }

        .carousel {
            position: relative; width: var(--card-w); height: var(--card-h);
            transform-style: preserve-3d;
        }

        /* 基礎卡牌樣式：完全透明，不設預設樣式避免衝突 */
        .card {
            position: absolute; width: 100%; height: 100%;
            left: 0; top: 0;
            transform-style: preserve-3d;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0;
            pointer-events: none;
        }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            background-color: transparent;
        }

        .card-front { background: url('Taro Front.png') no-repeat center center; background-size: 100% 100%; }
        .card-back { background: url('Taro Back.png') no-repeat center center; background-size: 100% 100%; transform: rotateY(180deg); display: flex; align-items: center; justify-content: center; }

        .fortune-text { color: #432a0a; font-size: 1.5rem; font-weight: bold; text-align: center; padding: 0 20px; opacity: 0; margin-top: -15px; }

        /* 翻牌動畫 */
        .card.is-flipped {
            transform: translateZ(450px) rotateY(180deg) translateY(-120px) !important;
            z-index: 100 !important;
            opacity: 1 !important;
        }
        .card.is-flipped .fortune-text { opacity: 1; transition: 0.5s 0.3s; }

        #mask { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: none; color: white; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="mask"><h2>您已參加過活動</h2></div>
    <div class="game-bg"></div>
    <div class="stage" id="touchArea">
        <div class="carousel" id="cardBox"></div>
    </div>

<script>
    const SUPABASE_URL = 'https://nszwpwimtwxvjguolzwt.supabase.co';
    const SUPABASE_KEY = '[cite: 67]';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const fortunes = ["財運大吉", "心想事成", "驚喜連連", "貴人相助", "元氣滿滿", "萬事如意", "美夢成真", "步步高升", "福氣滿滿", "吉星高照"];
    let currentIndex = 0, startX = 0, startY = 0, isFlipped = false;

    // 核心優化：JS 強制控制每一張牌的屬性
    function update() {
        const cards = document.querySelectorAll('.card');
        const total = cards.length;

        cards.forEach((card, i) => {
            // 預設全部隱藏
            card.style.opacity = "0";
            card.style.zIndex = "1";
            card.style.pointerEvents = "none";

            if (i === currentIndex) {
                // 正中央：100% 透明度 [cite: 1]
                card.style.opacity = "1";
                card.style.zIndex = "20";
                card.style.transform = "translateZ(200px)";
                card.style.pointerEvents = "auto";
            } else if (i === (currentIndex - 1 + total) % total) {
                // 左側：40% 透明度 [cite: 1]
                card.style.opacity = "0.4";
                card.style.zIndex = "10";
                card.style.transform = "translateX(-150px) rotateY(30deg) translateZ(0px)";
            } else if (i === (currentIndex + 1) % total) {
                // 右側：40% 透明度 [cite: 1]
                card.style.opacity = "0.4";
                card.style.zIndex = "10";
                card.style.transform = "translateX(150px) rotateY(-30deg) translateZ(0px)";
            } else {
                // 其他牌徹底移出視野防止干擾
                card.style.transform = "translateZ(-1000px)";
            }
        });
    }

    async function checkAuth(lineId) {
        const { data: profile } = await _supabase.from('profiles').select('id').eq('line_id', lineId).single(); [cite: 1, 2]
        if (profile) {
            const { data: logs } = await _supabase.from('cny_logs').select('*').eq('user_id', profile.id).eq('prize_type', 'STAR_EVENT'); [cite: 1, 15]
            if (logs && logs.length > 0) document.getElementById('mask').style.display = 'flex';
        }
    }

    window.onload = () => {
        const box = document.getElementById('cardBox');
        for (let i = 0; i < 10; i++) {
            const el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = `<div class="card-face card-front"></div><div class="card-back card-face"><div class="fortune-text">${fortunes[i]}</div></div>`;
            box.appendChild(el);
        }
        
        update(); // 初始化渲染
        
        // 模擬 Line Login 後檢查
        checkAuth('USER_LINE_ID');

        const area = document.getElementById('touchArea');
        area.addEventListener('touchstart', e => { startX = e.touches[0].pageX; startY = e.touches[0].pageY; });
        area.addEventListener('touchend', e => {
            if (isFlipped) return;
            const dx = startX - e.changedTouches[0].pageX;
            const dy = startY - e.changedTouches[0].pageY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) {
                    currentIndex = dx > 0 ? (currentIndex + 1) % 10 : (currentIndex - 1 + 10) % 10;
                    update();
                }
            } else if (dy > 60) {
                const active = document.querySelectorAll('.card')[currentIndex];
                if (active) flip(active);
            }
        });
    };

    async function flip(card) {
        isFlipped = true;
        card.classList.add('is-flipped');
        const prize = card.querySelector('.fortune-text').innerText;
        // 這裡建議串接 add_lion_points 或類似 Function [cite: 3]
        console.log("抽到：", prize);
    }
</script>
</body>
</html>
