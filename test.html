<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小星運 - 黑盒子手機維修中心</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --card-w: 180px;
            --card-h: 270px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: #000; /* 防止背景閃爍 */
        }

        /* 遊戲背景層 */
        .game-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('game desk.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }

        /* 舞台容器，限制只能看到中間區域 */
        .stage {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            overflow: hidden; /* 隱藏超出邊界的卡牌 */
        }

        .carousel {
            position: relative;
            width: var(--card-w);
            height: var(--card-h);
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* 卡牌樣式 */
        .card {
            position: absolute;
            width: var(--card-w);
            height: var(--card-h);
            left: 0; top: 0;
            transform-style: preserve-3d;
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0;
            pointer-events: none;
        }

        /* 中間那張牌 */
        .card.active {
            opacity: 1;
            z-index: 10;
            transform: translateZ(150px) translateY(-20px);
            pointer-events: auto;
        }

        /* 左邊那張（露出約 1/3） */
        .card.prev {
            opacity: 0.8;
            z-index: 5;
            transform: translateX(-140px) translateZ(-100px) rotateY(35deg);
        }

        /* 右邊那張（露出約 1/3） */
        .card.next {
            opacity: 0.8;
            z-index: 5;
            transform: translateX(140px) translateZ(-100px) rotateY(-35deg);
        }

        .card-face {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 2px solid rgba(255, 215, 0, 0.3); /* 淡淡的金邊感 */
        }

        /* 直接使用你的檔名，請確保圖片在同目錄 */
        .card-front {
            background: url('Taro Front.jpg') no-repeat center center;
            background-size: cover;
        }

        .card-back {
            background: url('Taro Back.jpg') no-repeat center center;
            background-size: cover;
            transform: rotateY(180deg);
            display: flex; align-items: center; justify-content: center;
        }

        /* 運勢文字 */
        .fortune-text {
            color: #3e2723;
            font-size: 1.4rem; font-weight: bold; text-align: center;
            padding: 0 20px;
            margin-top: -10px; /* 根據黃色框框位置微調 */
            opacity: 0;
        }

        /* 向上滑動翻牌動畫 */
        .card.is-flipped {
            transform: translateZ(300px) rotateY(180deg) translateY(-120px) !important;
            z-index: 100 !important;
        }
        .card.is-flipped .fortune-text { opacity: 1; transition: 0.6s 0.4s; }

        /* 滑動提示 */
        .hint {
            position: absolute; bottom: 10%; color: #fff; font-size: 0.9rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="game-bg"></div>

<div class="stage" id="touchArea">
    <div class="carousel" id="carousel"></div>
    <div class="hint">← 左右滑動切換卡牌，向上滑動開啟好運 →</div>
</div>

<script>
    // 配置 Supabase (請填入你的 Anon Key)
    const _supabase = supabase.createClient('https://nszwpwimtwxvjguolzwt.supabase.co', 'YOUR_ANON_KEY');

    const fortunes = ["財運亨通", "心想事成", "萬事順利", "驚喜連連", "美夢成真", "元氣滿滿", "好運相隨", "步步高升", "福氣滿門", "貴人相助"];
    let currentIndex = 0;
    let startX = 0;
    let startY = 0;
    let isFlipped = false;
    const totalCards = 10;

    function renderCards() {
        const carousel = document.getElementById('carousel');
        for (let i = 0; i < totalCards; i++) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-face card-front"></div>
                <div class="card-back card-face">
                    <div class="fortune-text">${fortunes[i % fortunes.length]}</div>
                </div>
            `;
            carousel.appendChild(card);
        }
        updateCardPositions();
    }

    function updateCardPositions() {
        const cards = document.querySelectorAll('.card');
        cards.forEach((card, i) => {
            card.classList.remove('active', 'prev', 'next');
            
            if (i === currentIndex) {
                card.classList.add('active');
            } else if (i === (currentIndex - 1 + totalCards) % totalCards) {
                card.classList.add('prev');
            } else if (i === (currentIndex + 1) % totalCards) {
                card.classList.add('next');
            } else {
                card.style.opacity = "0";
                card.style.transform = "translateZ(-500px)";
            }
        });
    }

    // 觸控交互邏輯
    const touchArea = document.getElementById('touchArea');
    touchArea.addEventListener('touchstart', e => {
        startX = e.touches[0].pageX;
        startY = e.touches[0].pageY;
    }, {passive: true});

    touchArea.addEventListener('touchend', e => {
        if (isFlipped) return;
        const endX = e.changedTouches[0].pageX;
        const endY = e.changedTouches[0].pageY;
        const diffX = startX - endX;
        const diffY = startY - endY;

        // 判斷滑動方向
        if (Math.abs(diffX) > Math.abs(diffY)) {
            // 左右滑動
            if (Math.abs(diffX) > 40) {
                if (diffX > 0) {
                    currentIndex = (currentIndex + 1) % totalCards;
                } else {
                    currentIndex = (currentIndex - 1 + totalCards) % totalCards;
                }
                updateCardPositions();
            }
        } else {
            // 向上滑動：翻開中間那張牌
            if (diffY > 60) {
                const activeCard = document.querySelector('.card.active');
                if (activeCard) handleFlip(activeCard);
            }
        }
    }, {passive: true});

    async function handleFlip(card) {
        isFlipped = true;
        card.classList.add('is-flipped');
        
        const resultText = card.querySelector('.fortune-text').innerText;
        
        // 寫入 Supabase 紀錄
        // 注意：這裡假設你已經有 line_id 的邏輯，這裡先用 mock 代替
        const mockLineId = 'user_line_id_here'; 
        const { error } = await _supabase.from('cny_logs').insert([
            { 
                prize_name: resultText, 
                prize_type: 'STAR_EVENT',
                created_at: new Date().toISOString()
            }
        ]);
        
        if(error) console.log('Database error:', error);
    }

    // 啟動邏輯
    async function init() {
        // 你可以加入檢查是否參與過的邏輯 checkUser();
        renderCards();
    }

    init();
</script>
</body>
</html>
