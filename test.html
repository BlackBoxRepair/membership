<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小星運 - 黑盒子手機維修中心</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --card-w: 180px; --card-h: 270px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; width: 100vw; height: 100vh; 
            background-color: #000; overflow: hidden; 
        }

        /* 網站背景 */
        .game-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('game desk.png') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        .stage {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            perspective: 1200px; z-index: 10;
        }

        .carousel {
            position: relative; width: var(--card-w); height: var(--card-h);
            transform-style: preserve-3d;
        }

        /* 基礎卡牌樣式 */
        .card {
            position: absolute; width: 100%; height: 100%;
            left: 0; top: 0;
            transform-style: preserve-3d;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            /* 初始狀態設為隱藏 */
            opacity: 0; 
            pointer-events: none;
        }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            background-color: transparent;
        }

        /* 抽取前：Taro Front.png */
        .card-front { 
            background: url('Taro Front.png') no-repeat center center; 
            background-size: 100% 100%; 
        }

        /* 抽取後：Taro Back.png */
        .card-back { 
            background: url('Taro Back.png') no-repeat center center; 
            background-size: 100% 100%; 
            transform: rotateY(180deg); 
            display: flex; align-items: center; justify-content: center; 
        }

        .fortune-text { 
            color: #432a0a; font-size: 1.5rem; font-weight: bold; text-align: center; 
            padding: 0 20px; opacity: 0; margin-top: -15px; 
        }

        /* 翻牌動畫 */
        .card.is-flipped {
            transform: translateZ(450px) rotateY(180deg) translateY(-120px) !important;
            z-index: 100 !important;
            opacity: 1 !important;
        }
        .card.is-flipped .fortune-text { opacity: 1; transition: 0.5s 0.3s; }

        #mask { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); z-index: 1000; 
            display: none; color: white; flex-direction: column; 
            align-items: center; justify-content: center; 
        }
    </style>
</head>
<body>
    <div id="mask"><h2>您已參加過活動</h2></div>
    <div class="game-bg"></div>
    <div class="stage" id="touchArea">
        <div class="carousel" id="cardBox"></div>
    </div>

<script>
    // 從你提供的資料中提取的連線資訊 
    const SUPABASE_URL = 'https://nszwpwimtwxvjguolzwt.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zendwd2ltd3h2amd1b2Fsend0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMzY1NzYsImV4cCI6MjA4MTcxMjU3Nn0.TaAt4aqEhDsONWtDCagD5rlTMknEWfhq8fMVL1Rt4lg';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const fortunes = ["財運大吉", "心想事成", "驚喜連連", "貴人相助", "元氣滿滿", "萬事如意", "美夢成真", "步步高升", "福氣滿滿", "吉星高照"];
    let currentIndex = 0, startX = 0, startY = 0, isFlipped = false;

    // 核心優化：JS 強制控制每一張牌的屬性，確保不跑位
    function update() {
        const cards = document.querySelectorAll('.card');
        const total = cards.length;
        if (total === 0) return;

        cards.forEach((card, i) => {
            // 預設全隱藏
            card.style.opacity = "0";
            card.style.zIndex = "1";
            card.style.pointerEvents = "none";

            if (i === currentIndex) {
                // 正中央：100% 透明度
                card.style.opacity = "1";
                card.style.zIndex = "20";
                card.style.transform = "translateZ(200px)";
                card.style.pointerEvents = "auto";
            } else if (i === (currentIndex - 1 + total) % total) {
                // 左側：40% 透明度
                card.style.opacity = "0.4";
                card.style.zIndex = "10";
                card.style.transform = "translateX(-150px) rotateY(30deg) translateZ(0px)";
            } else if (i === (currentIndex + 1) % total) {
                // 右側：40% 透明度
                card.style.opacity = "0.4";
                card.style.zIndex = "10";
                card.style.transform = "translateX(150px) rotateY(-30deg) translateZ(0px)";
            } else {
                // 徹底移開，避免遮擋
                card.style.transform = "translateZ(-1000px)";
            }
        });
    }

    async function checkAuth() {
        // 實際發布時請替換為 LINE 的 line_id
        const testLineId = "USER_LINE_ID"; 
        const { data: profile } = await _supabase.from('profiles').select('id').eq('line_id', testLineId).single();
        if (profile) {
            const { data: logs } = await _supabase.from('cny_logs').select('*').eq('user_id', profile.id).eq('prize_type', 'STAR_EVENT');
            if (logs && logs.length > 0) document.getElementById('mask').style.display = 'flex';
        }
    }

    window.onload = () => {
        const box = document.getElementById('cardBox');
        for (let i = 0; i < 10; i++) {
            const el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = `
                <div class="card-face card-front"></div>
                <div class="card-back card-face">
                    <div class="fortune-text">${fortunes[i]}</div>
                </div>`;
            box.appendChild(el);
        }
        
        // 確保 DOM 渲染完畢後執行
        setTimeout(update, 100); 
        checkAuth();

        const area = document.getElementById('touchArea');
        area.addEventListener('touchstart', e => { 
            startX = e.touches[0].pageX; 
            startY = e.touches[0].pageY; 
        });

        area.addEventListener('touchend', e => {
            if (isFlipped) return;
            const dx = startX - e.changedTouches[0].pageX;
            const dy = startY - e.changedTouches[0].pageY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) {
                    currentIndex = dx > 0 ? (currentIndex + 1) % 10 : (currentIndex - 1 + 10) % 10;
                    update();
                }
            } else if (dy > 60) {
                const cards = document.querySelectorAll('.card');
                if (cards[currentIndex]) flip(cards[currentIndex]);
            }
        });
    };

    async function flip(card) {
        if (isFlipped) return;
        isFlipped = true;
        card.classList.add('is-flipped');
        const prize = card.querySelector('.fortune-text').innerText;
        
        // 寫入紀錄 (需配合實際 user_id)
        console.log("中獎獎項：", prize);
    }
</script>
</body>
</html>
