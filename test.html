<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小星運 - 黑盒子會員中心</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --card-w: 200px;
            --card-h: 300px;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            /* 修正圖片路徑，確保與你上傳的檔名一致 */
            background: url('game desk.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: "Microsoft JhengHei", sans-serif;
        }

        .scene {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1500px;
            position: relative;
        }

        .carousel {
            position: relative;
            width: var(--card-w);
            height: var(--card-h);
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .card {
            position: absolute;
            width: var(--card-w);
            height: var(--card-h);
            left: 0; top: 0;
            transform-style: preserve-3d;
            transition: all 0.5s ease;
            opacity: 0; /* 預設隱藏所有卡牌 */
            pointer-events: none;
        }

        /* 核心邏輯：只顯示特定索引的卡牌 */
        .card.active { opacity: 1; z-index: 10; transform: translateZ(200px); pointer-events: auto; }
        .card.prev { opacity: 0.7; transform: translateX(-140px) translateZ(0px) rotateY(25deg); }
        .card.next { opacity: 0.7; transform: translateX(140px) translateZ(0px) rotateY(-25deg); }

        .card-face {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card-front {
            background: url('Taro Front.jpg') no-repeat center center;
            background-size: cover;
        }

        .card-back {
            background: url('Taro Back.jpg') no-repeat center center;
            background-size: cover;
            transform: rotateY(180deg);
            display: flex; align-items: center; justify-content: center;
        }

        .fortune-text {
            color: #432a0a;
            font-size: 1.5rem; font-weight: bold; text-align: center;
            padding: 0 25px; margin-top: -15px;
            opacity: 0;
        }

        /* 翻牌動畫 */
        .card.is-flipped {
            transform: translateZ(400px) rotateY(180deg) translateY(-80px) !important;
            z-index: 100 !important;
        }
        .card.is-flipped .fortune-text { opacity: 1; transition: 0.5s 0.3s; }

        /* 防止左右兩側點擊干擾 */
        .card.prev, .card.next { pointer-events: none; }
    </style>
</head>
<body>

<div class="scene" id="swipeZone">
    <div class="carousel" id="carousel"></div>
</div>

<script>
    const SUPABASE_URL = 'https://nszwpwimtwxvjguolzwt.supabase.co';
    const SUPABASE_KEY = 'YOUR_ANON_KEY'; // 請替換成你的實際 Key
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const fortunes = ["財運亨通", "萬事如意", "心想事成", "貴人相助", "驚喜連連", "美夢成真", "元氣滿滿", "步步高升"];
    let currentIndex = 0;
    let startX = 0;
    let isFlipped = false;
    const totalCards = 10;

    function renderCards() {
        const carousel = document.getElementById('carousel');
        for (let i = 0; i < totalCards; i++) {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.index = i;
            card.innerHTML = `
                <div class="card-face card-front"></div>
                <div class="card-back card-face">
                    <div class="fortune-text">${fortunes[Math.floor(Math.random() * fortunes.length)]}</div>
                </div>
            `;
            // 點擊中間那張才觸發翻牌
            card.addEventListener('click', () => {
                if (card.classList.contains('active') && !isFlipped) flipCard(card);
            });
            carousel.appendChild(card);
        }
        updateCardPositions();
    }

    function updateCardPositions() {
        const cards = document.querySelectorAll('.card');
        cards.forEach((card, i) => {
            card.classList.remove('active', 'prev', 'next');
            card.style.opacity = "0";

            if (i === currentIndex) {
                card.classList.add('active');
                card.style.opacity = "1";
            } else if (i === (currentIndex - 1 + totalCards) % totalCards) {
                card.classList.add('prev');
                card.style.opacity = "0.6";
            } else if (i === (currentIndex + 1) % totalCards) {
                card.classList.add('next');
                card.style.opacity = "0.6";
            }
        });
    }

    // 滑動處理
    const swipeZone = document.getElementById('swipeZone');
    swipeZone.addEventListener('touchstart', e => { startX = e.touches[0].pageX; });
    swipeZone.addEventListener('touchend', e => {
        if (isFlipped) return;
        let endX = e.changedTouches[0].pageX;
        let diff = startX - endX;

        if (Math.abs(diff) > 50) {
            if (diff > 0) {
                currentIndex = (currentIndex + 1) % totalCards;
            } else {
                currentIndex = (currentIndex - 1 + totalCards) % totalCards;
            }
            updateCardPositions();
        }
    });

    async function flipCard(el) {
        isFlipped = true;
        el.classList.add('is-flipped');
        
        // 取得該牌運勢並寫入 Supabase
        const result = el.querySelector('.fortune-text').innerText;
        await _supabase.from('cny_logs').insert([{ 
            prize_name: result, 
            prize_type: 'STAR_EVENT',
            created_at: new Date().toLocaleString("zh-TW", {timeZone: "Asia/Taipei"})
        }]);
    }

    // 初始化檢核邏輯
    async function checkUser() {
        // 此處應接 LINE ID 獲取邏輯
        const mockLineId = "USER_TEST_001"; 
        const { data } = await _supabase.from('cny_logs').select('*').eq('prize_type', 'STAR_EVENT').limit(1);
        
        if (data && data.length > 0) {
            document.body.innerHTML = "<div style='color:white; text-align:center; margin-top:50vh;'>已參與過活動，請靜候開獎。</div>";
        } else {
            renderCards();
        }
    }

    checkUser();
</script>
</body>
</html>
