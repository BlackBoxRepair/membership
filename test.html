<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小星運 - 黑盒子手機維修中心</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --card-w: 180px; --card-h: 270px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* 基礎畫布設定 */
        body, html { 
            margin: 0; padding: 0; 
            width: 100vw; height: 100vh; 
            overflow: hidden; 
            background-color: #000; 
        }

        /* 修正：背景圖容器 */
        .game-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('game desk.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            z-index: 1; /* 確保在最底層但高於 body */
        }

        /* 互動舞台 */
        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            z-index: 10; /* 確保在背景之上 */
        }

        .carousel {
            position: relative;
            width: var(--card-w);
            height: var(--card-h);
            transform-style: preserve-3d;
        }

        /* 卡牌樣式：移除所有灰框與邊界 */
        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            transform-style: preserve-3d;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0; 
            background: transparent;
        }

        /* 扇形排列與強制顯示邏輯 */
        .card.active { opacity: 1 !important; z-index: 20; transform: translateZ(200px); }
        .card.prev { opacity: 0.8 !important; z-index: 15; transform: translateX(-150px) rotateY(30deg); }
        .card.next { opacity: 0.8 !important; z-index: 15; transform: translateX(150px) rotateY(-30deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background-color: transparent;
            border: none;
        }

        /* 抽取前 */
        .card-front {
            background-image: url('Taro Front.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 抽取後 */
        .card-back {
            background-image: url('Taro Back.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            transform: rotateY(180deg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fortune-text {
            color: #432a0a;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            padding: 0 20px;
            opacity: 0;
            margin-top: -10px;
        }

        /* 翻牌動畫 */
        .card.is-flipped {
            transform: translateZ(400px) rotateY(180deg) translateY(-120px) !important;
            z-index: 100 !important;
        }
        .card.is-flipped .fortune-text { opacity: 1; transition: 0.5s 0.3s; }
    </style>
</head>
<body>

    <div class="game-bg"></div>

    <div class="stage" id="touchArea">
        <div class="carousel" id="cardContainer"></div>
    </div>

<script>
    const config = {
        url: 'https://nszwpwimtwxvjguolzwt.supabase.co',
        key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zendwd2ltd3h2amd1b2Fsend0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMzY1NzYsImV4cCI6MjA4MTcxMjU3Nn0.TaAt4aqEhDsONWtDCagD5rlTMknEWfhq8fMVL1Rt4lg',
        fortunes: ["財運大吉", "心想事成", "驚喜連連", "貴人相助", "元氣滿滿", "萬事如意", "美夢成真", "步步高升", "福氣滿滿", "吉星高照"]
    };

    let currentIndex = 0;
    let startX = 0, startY = 0, isFlipped = false;
    let _supabase = null;

    // 更新顯示狀態
    function update() {
        const cards = document.querySelectorAll('.card');
        cards.forEach((card, i) => {
            // 先清除所有狀態
            card.classList.remove('active', 'prev', 'next');
            card.style.opacity = "0";
            card.style.pointerEvents = "none";
            
            if (i === currentIndex) {
                card.classList.add('active');
                card.style.opacity = "1";
                card.style.pointerEvents = "auto";
            } else if (i === (currentIndex - 1 + 10) % 10) {
                card.classList.add('prev');
                card.style.opacity = "1";
            } else if (i === (currentIndex + 1) % 10) {
                card.classList.add('next');
                card.style.opacity = "1";
            }
        });
    }

    window.onload = function() {
        const container = document.getElementById('cardContainer');
        
        // 生成 10 張牌
        for (let i = 0; i < 10; i++) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-face card-front"></div>
                <div class="card-back card-face">
                    <div class="fortune-text">${config.fortunes[i]}</div>
                </div>
            `;
            container.appendChild(card);
        }
        
        // 強制立即渲染第一次
        setTimeout(update, 50);

        try {
            _supabase = supabase.createClient(config.url, config.key);
        } catch (e) { console.error("Supabase 連線失敗"); }

        const area = document.getElementById('touchArea');
        area.addEventListener('touchstart', e => {
            startX = e.touches[0].pageX;
            startY = e.touches[0].pageY;
        });

        area.addEventListener('touchend', e => {
            if (isFlipped) return;
            const dx = startX - e.changedTouches[0].pageX;
            const dy = startY - e.changedTouches[0].pageY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) {
                    currentIndex = dx > 0 ? (currentIndex + 1) % 10 : (currentIndex - 1 + 10) % 10;
                    update();
                }
            } else if (dy > 60) {
                const activeCard = document.querySelector('.card.active');
                if (activeCard) flip(activeCard);
            }
        });
    };

    async function flip(card) {
        isFlipped = true;
        card.classList.add('is-flipped');
        const prize = card.querySelector('.fortune-text').innerText;
        if (_supabase) {
            await _supabase.from('cny_logs').insert([{ 
                prize_name: prize, 
                prize_type: 'STAR_EVENT',
                created_at: new Date().toISOString()
            }]);
        }
    }
</script>
</body>
</html>
