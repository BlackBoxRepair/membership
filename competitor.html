<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>iPhone 同行維修報價</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=TASA+Explorer:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: #d2d2d7;
      --soft-line: #ececf0;
      --blue: #0071e3;
      --blue-soft: rgba(0, 113, 227, 0.12);
      --danger: #d70015;
      --radius: 26px;
      --shadow: 0 18px 42px rgba(0, 0, 0, 0.07);
      --shadow-strong: 0 24px 60px rgba(0, 0, 0, 0.11);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: "TASA Explorer", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    input,
    select,
    button {
      font-family: inherit;
    }

    .page {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 16px 40px;
    }

    .hero {
      padding: 26px 4px 18px;
      text-align: center;
      animation: fadeUp 0.55s ease both;
    }

    h1 {
      margin: 0 auto;
      max-width: 100%;
      font-size: clamp(24px, 6.8vw, 30px);
      line-height: 1.1;
      letter-spacing: -0.045em;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
    }

    .dealer-card,
    .selector-card {
      margin: 18px 0 16px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(210, 210, 215, 0.62);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      animation: fadeUp 0.55s 0.08s ease both;
      backdrop-filter: blur(18px);
    }

    .dealer-title {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.15;
      letter-spacing: -0.045em;
      font-weight: 800;
      color: var(--text);
    }

    .dealer-desc {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      font-weight: 600;
    }

    .dealer-form {
      display: grid;
      gap: 10px;
    }

    .dealer-input {
      width: 100%;
      height: 54px;
      border-radius: 17px;
      border: 1px solid var(--line);
      outline: none;
      background: #fff;
      color: var(--text);
      padding: 0 16px;
      font-size: 16px;
      font-weight: 800;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .dealer-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px var(--blue-soft);
      transform: translateY(-1px);
    }

    .dealer-button {
      width: 100%;
      height: 54px;
      border-radius: 17px;
      border: none;
      outline: none;
      background: var(--blue);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .dealer-button:active {
      transform: scale(0.98);
    }

    .dealer-error {
      display: none;
      margin: 2px 0 0;
      color: var(--danger);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }

    .dealer-card.error-shake {
      animation: shake 0.34s ease both;
    }

    .selector-card {
      display: none;
    }

    .selector-card.unlocked {
      display: block;
      animation: popIn 0.46s cubic-bezier(.2, .9, .2, 1) both;
    }

    .selector-label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }

    .select-wrap {
      position: relative;
    }

    select {
      appearance: none;
      width: 100%;
      height: 56px;
      border-radius: 17px;
      border: 1px solid var(--line);
      outline: none;
      background: #fff;
      color: var(--text);
      padding: 0 48px 0 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px var(--blue-soft);
      transform: translateY(-1px);
    }

    .select-arrow {
      position: absolute;
      right: 18px;
      top: 50%;
      width: 10px;
      height: 10px;
      border-right: 2px solid #86868b;
      border-bottom: 2px solid #86868b;
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
      transition: transform 0.2s ease;
    }

    select:focus + .select-arrow {
      transform: translateY(-35%) rotate(225deg);
    }

    .summary {
      display: none;
    }

    .price-panel {
      display: none;
      background: var(--card);
      border: 1px solid rgba(210, 210, 215, 0.62);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transform: translateY(18px) scale(0.96);
      opacity: 0;
      will-change: transform, opacity;
    }

    .price-panel.show {
      display: block;
      animation: popIn 0.48s cubic-bezier(.2, .9, .2, 1) both;
    }

    .selected-cover {
      padding: 24px 20px 20px;
      background:
        radial-gradient(circle at right top, rgba(0, 113, 227, 0.08), transparent 42%),
        #ffffff;
      border-bottom: 1px solid var(--soft-line);
      text-align: center;
    }

    .selected-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: 0.04em;
    }

    .selected-model {
      font-size: clamp(28px, 8vw, 38px);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.055em;
      margin: 0;
      color: var(--text);
    }

    .selected-note {
      display: none;
    }

    .price-list {
      padding: 2px 20px 10px;
      display: grid;
      gap: 0;
    }

    .price-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 17px 0;
      border-bottom: 1px solid var(--soft-line);
      opacity: 0;
      transform: translateY(10px);
      animation: rowUp 0.42s ease both;
    }

    .price-row:last-child {
      border-bottom: none;
    }

    .repair-name {
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      word-break: break-word;
    }

    .repair-price {
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      white-space: nowrap;
      letter-spacing: -0.02em;
    }

    .repair-price.empty {
      color: #a1a1a6;
    }

    .status {
      display: none;
      padding: 36px 22px;
      text-align: center;
      color: var(--muted);
      background: #ffffff;
      border-radius: var(--radius);
      border: 1px solid rgba(210, 210, 215, 0.62);
      box-shadow: var(--shadow);
      font-size: 14px;
      line-height: 1.7;
      animation: fadeUp 0.46s 0.14s ease both;
    }

    .status.show {
      display: block;
    }

    .status.error {
      color: var(--danger);
      border-color: rgba(215, 0, 21, 0.18);
      background: #fffafa;
    }

    .store-footer {
      margin: 28px auto 0;
      padding: 18px 10px 4px;
      text-align: center;
      color: #86868b;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      animation: fadeUp 0.55s 0.18s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translateY(22px) scale(0.94);
        box-shadow: var(--shadow);
      }
      70% {
        opacity: 1;
        transform: translateY(-3px) scale(1.012);
        box-shadow: var(--shadow-strong);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        box-shadow: var(--shadow);
      }
    }

    @keyframes rowUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(4px); }
    }

    @media (min-width: 768px) {
      body {
        background:
          radial-gradient(circle at top, rgba(255,255,255,0.85), transparent 32%),
          var(--bg);
      }

      .page {
        padding-top: 42px;
      }
    }

    @media (max-width: 390px) {
      h1 {
        font-size: 23px;
      }

      .repair-name {
        font-size: 14px;
      }

      .repair-price {
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="hero">
      <h1>iPhone 同行維修報價</h1>
    </section>

    <section id="dealerGate" class="dealer-card">
      <h2 class="dealer-title">請輸入經銷商代碼</h2>
      <p class="dealer-desc">輸入正確代碼後，才可以查看同行 iPhone 維修報價。</p>

      <form id="dealerForm" class="dealer-form">
        <input
          id="dealerCodeInput"
          class="dealer-input"
          type="password"
          inputmode="text"
          autocomplete="off"
          placeholder="輸入經銷商代碼"
        />
        <button class="dealer-button" type="submit">開始查看報價</button>
        <div id="dealerError" class="dealer-error">代碼錯誤，請重新輸入。</div>
      </form>
    </section>

    <section id="selectorCard" class="selector-card">
      <label class="selector-label" for="modelSelect">選擇 iPhone 型號</label>
      <div class="select-wrap">
        <select id="modelSelect">
          <option value="">請選擇 iPhone 型號</option>
        </select>
        <span class="select-arrow"></span>
      </div>
    </section>

    <div class="summary">
      <div id="resultCount">正在讀取資料...</div>
      <div id="updatedAt">資料來源：competitor_iphone_price_matrix</div>
    </div>

    <section id="statusBox" class="status">資料載入中...</section>

    <section id="pricePanel" class="price-panel">
      <div class="selected-cover">
        <div class="selected-label">目前選擇</div>
        <h2 id="selectedModel" class="selected-model">請選擇型號</h2>
        <p id="selectedNote" class="selected-note"></p>
      </div>

      <div id="priceList" class="price-list"></div>
    </section>

    <footer class="store-footer">
      黑盒子維修中心-沙鹿站前店
    </footer>
  </main>

  <script>
    const DEALER_CODE = "blk";
    const SUPABASE_URL = "https://hkygeqtxtvnslyrmfiux.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhreWdlcXR4dHZuc2x5cm1maXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMTY2MDUsImV4cCI6MjA5MjU5MjYwNX0.VY_XEmXpuiKaYiIH2H57gMTozaZtEDiqvaBSZ9A6kfQ";
    const TABLE_NAME = "competitor_iphone_price_matrix";

    /*
      是否把「電池-蘋果原廠電池」顯示成「蘋果原廠電池」
      false = 直接顯示 Supabase 欄位名稱
      true = 自動拿掉第一個 "-" 前面的分類
    */
    const STRIP_CATEGORY_PREFIX = false;

    /*
      這裡是非報價欄位的對照表。
      程式會自動排除這些欄位，不會把它們顯示成維修項目。
    */
    const FIELD_ALIASES = {
      id: [
        "編號",
        "id"
      ],
      model: [
        "型號",
        "model",
        "iphone_model",
        "phone_model",
        "model_name",
        "phone_name",
        "device_model"
      ],
      enabled: [
        "是否啟用",
        "is_enabled",
        "is_active",
        "enabled",
        "active",
        "status",
        "visible"
      ],
      sort: [
        "排序",
        "sort_order",
        "display_order",
        "sort",
        "order",
        "position"
      ]
    };

    const EXTRA_EXCLUDED_COLUMNS = [
      "created_at",
      "updated_at",
      "createdAt",
      "updatedAt",
      "deleted_at",
      "deletedAt",
      "建立時間",
      "更新時間",
      "刪除時間",
      "備註",
      "note",
      "notes",
      "remark",
      "remarks",
      "description",
      "說明"
    ];

    let allRows = [];
    let repairItems = [];
    let hasLoadedData = false;

    const dealerGate = document.getElementById("dealerGate");
    const dealerForm = document.getElementById("dealerForm");
    const dealerCodeInput = document.getElementById("dealerCodeInput");
    const dealerError = document.getElementById("dealerError");
    const selectorCard = document.getElementById("selectorCard");

    const modelSelect = document.getElementById("modelSelect");
    const statusBox = document.getElementById("statusBox");
    const pricePanel = document.getElementById("pricePanel");
    const resultCount = document.getElementById("resultCount");
    const updatedAt = document.getElementById("updatedAt");
    const selectedModel = document.getElementById("selectedModel");
    const selectedNote = document.getElementById("selectedNote");
    const priceList = document.getElementById("priceList");

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getValue(row, keys, fallback = "") {
      for (const key of keys) {
        if (Object.prototype.hasOwnProperty.call(row, key)) {
          return row[key];
        }
      }

      return fallback;
    }

    function getField(row, fieldName, fallback = "") {
      return getValue(row, FIELD_ALIASES[fieldName] || [fieldName], fallback);
    }

    function getExcludedColumnNames() {
      const names = [];

      Object.values(FIELD_ALIASES).forEach((aliases) => {
        aliases.forEach((name) => names.push(name));
      });

      EXTRA_EXCLUDED_COLUMNS.forEach((name) => names.push(name));

      return new Set(names);
    }

    function formatRepairLabel(columnName) {
      if (!STRIP_CATEGORY_PREFIX) {
        return columnName;
      }

      if (!columnName.includes("-")) {
        return columnName;
      }

      return columnName.split("-").slice(1).join("-");
    }

    function buildRepairItemsFromRows(rows) {
      const excludedColumns = getExcludedColumnNames();
      const columns = [];

      rows.forEach((row) => {
        Object.keys(row).forEach((columnName) => {
          if (excludedColumns.has(columnName)) return;
          if (columns.includes(columnName)) return;

          columns.push(columnName);
        });
      });

      repairItems = columns.map((columnName) => {
        return {
          label: formatRepairLabel(columnName),
          key: columnName
        };
      });
    }

    function isTrueValue(value) {
      if (value === true) return true;
      if (value === 1) return true;
      if (value === "1") return true;

      const normalized = String(value).trim().toLowerCase();

      return normalized === "true" ||
        normalized === "yes" ||
        normalized === "y" ||
        normalized === "on" ||
        normalized === "啟用" ||
        normalized === "顯示";
    }

    function isEmptyPrice(value) {
      return value === null || value === undefined || value === "";
    }

    function formatPrice(value) {
      if (isEmptyPrice(value)) return "—";

      const numberValue = Number(value);

      if (!Number.isNaN(numberValue)) {
        return "$" + numberValue.toLocaleString("zh-TW");
      }

      return String(value);
    }

    function getRepairPrice(row, item) {
      return row[item.key];
    }

    function countAvailablePrices(row) {
      return repairItems.filter((item) => !isEmptyPrice(getRepairPrice(row, item))).length;
    }

    function getModelName(row, index = 0) {
      return getField(row, "model") || `未命名型號 ${index + 1}`;
    }

    function getSortValue(row) {
      const value = getField(row, "sort", 999999);
      const numberValue = Number(value);

      if (Number.isNaN(numberValue)) {
        return 999999;
      }

      return numberValue;
    }

    function populateModelSelect() {
      modelSelect.innerHTML = "";

      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "請選擇 iPhone 型號";
      placeholder.selected = true;
      modelSelect.appendChild(placeholder);

      if (allRows.length === 0) {
        placeholder.textContent = "目前沒有可選擇的型號";
        modelSelect.disabled = true;
        return;
      }

      modelSelect.disabled = false;

      allRows.forEach((row, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = getModelName(row, index);
        modelSelect.appendChild(option);
      });

      modelSelect.value = "";
    }

    function showStatus(message, isError = false) {
      statusBox.className = isError ? "status show error" : "status show";
      statusBox.textContent = message;
    }

    function hideStatus() {
      statusBox.classList.remove("show");
      statusBox.style.display = "none";
    }

    function showPricePanel() {
      pricePanel.style.display = "block";
      pricePanel.classList.remove("show");

      void pricePanel.offsetWidth;

      requestAnimationFrame(() => {
        pricePanel.classList.add("show");
      });
    }

    function renderSelectedPrice() {
      const selectedIndex = Number(modelSelect.value);
      const row = allRows[selectedIndex];

      if (!row || Number.isNaN(selectedIndex)) {
        pricePanel.classList.remove("show");
        pricePanel.style.display = "none";
        statusBox.style.display = "block";
        showStatus("請先選擇 iPhone 型號查看報價。");
        return;
      }

      hideStatus();

      selectedModel.textContent = getModelName(row, selectedIndex);

      const availableCount = countAvailablePrices(row);
      selectedNote.textContent = availableCount > 0
        ? `目前共有 ${availableCount} 個維修項目有填寫價格。`
        : "這個型號目前尚未填寫任何維修價格。";

      if (repairItems.length === 0) {
        priceList.innerHTML = `
          <div class="price-row" style="animation-delay:80ms">
            <div class="repair-name">目前沒有可顯示的維修項目</div>
            <div class="repair-price empty">—</div>
          </div>
        `;

        showPricePanel();
        return;
      }

      priceList.innerHTML = repairItems.map((item, index) => {
        const value = getRepairPrice(row, item);
        const emptyClass = isEmptyPrice(value) ? " empty" : "";
        const delay = 80 + index * 35;

        return `
          <div class="price-row" style="animation-delay:${delay}ms">
            <div class="repair-name">${escapeHtml(item.label)}</div>
            <div class="repair-price${emptyClass}">${escapeHtml(formatPrice(value))}</div>
          </div>
        `;
      }).join("");

      showPricePanel();
    }

    async function loadData() {
      try {
        statusBox.style.display = "block";
        showStatus("資料載入中...");
        pricePanel.classList.remove("show");
        pricePanel.style.display = "none";
        resultCount.textContent = "正在讀取資料...";
        modelSelect.innerHTML = `<option value="">資料載入中...</option>`;
        modelSelect.disabled = true;

        const { data, error } = await client
          .from(TABLE_NAME)
          .select("*");

        if (error) throw error;

        const rawRows = Array.isArray(data) ? data : [];

        buildRepairItemsFromRows(rawRows);

        allRows = rawRows
          .filter((row) => {
            const enabledValue = getField(row, "enabled", true);

            if (enabledValue === "" || enabledValue === null || enabledValue === undefined) {
              return true;
            }

            return isTrueValue(enabledValue);
          })
          .sort((a, b) => {
            const sortA = getSortValue(a);
            const sortB = getSortValue(b);

            if (sortA !== sortB) {
              return sortA - sortB;
            }

            return String(getField(a, "model")).localeCompare(
              String(getField(b, "model")),
              "zh-Hant"
            );
          });

        hasLoadedData = true;

        const now = new Date();
        updatedAt.textContent = "最後更新：" + now.toLocaleString("zh-TW", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        });

        resultCount.innerHTML = `共讀取 <strong>${allRows.length}</strong> 筆型號資料`;

        populateModelSelect();

        if (allRows.length === 0) {
          showStatus("目前資料表沒有可顯示的報價資料。");
          pricePanel.style.display = "none";
          return;
        }

        showStatus("請先選擇 iPhone 型號查看報價。");
        pricePanel.style.display = "none";

      } catch (error) {
        console.error(error);

        modelSelect.innerHTML = `<option value="">讀取失敗</option>`;
        modelSelect.disabled = true;

        pricePanel.classList.remove("show");
        pricePanel.style.display = "none";
        statusBox.style.display = "block";
        statusBox.className = "status show error";
        statusBox.innerHTML = `
          <strong>資料讀取失敗</strong><br />
          ${escapeHtml(error.message || "請確認 Supabase Key、RLS 權限與資料表名稱是否正確。")}
        `;

        resultCount.textContent = "無法讀取資料";
      }
    }

    function unlockDealerArea() {
      dealerGate.style.display = "none";
      selectorCard.classList.add("unlocked");

      if (!hasLoadedData) {
        loadData();
      }
    }

    dealerForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const code = dealerCodeInput.value.trim().toLowerCase();

      if (code === DEALER_CODE) {
        dealerError.style.display = "none";
        unlockDealerArea();
        return;
      }

      dealerError.style.display = "block";
      dealerCodeInput.value = "";
      dealerCodeInput.focus();

      dealerGate.classList.remove("error-shake");
      void dealerGate.offsetWidth;
      dealerGate.classList.add("error-shake");
    });

    modelSelect.addEventListener("change", renderSelectedPrice);

    dealerCodeInput.focus();
  </script>
</body>
</html>
