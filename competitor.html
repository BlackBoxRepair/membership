<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>iPhone 同行維修報價</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=TASA+Explorer:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: #d2d2d7;
      --soft-line: #ececf0;
      --blue: #0071e3;
      --blue-soft: rgba(0, 113, 227, 0.12);
      --danger: #d70015;
      --radius: 26px;
      --shadow: 0 18px 42px rgba(0, 0, 0, 0.07);
      --shadow-strong: 0 24px 60px rgba(0, 0, 0, 0.11);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: "TASA Explorer", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    input,
    select,
    button {
      font-family: inherit;
    }

    .page {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 16px 40px;
    }

    .page-view {
      display: none;
      min-height: calc(100vh - 68px);
    }

    .page-view.active {
      display: block;
      animation: pageIn 0.32s ease both;
    }

    .result-header {
      display: flex;
      align-items: center;
      min-height: 48px;
      margin: 0 0 12px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 42px;
      margin: 0;
      padding: 8px 10px 8px 4px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--blue);
      font-size: 15px;
      line-height: 1;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.16s ease, transform 0.16s ease;
    }

    .back-button:hover {
      background: var(--blue-soft);
    }

    .back-button:active {
      transform: scale(0.97);
    }

    .back-icon {
      display: inline-block;
      font-size: 27px;
      line-height: 0.7;
      font-weight: 500;
      transform: translateY(-1px);
    }

    .hero {
      padding: 26px 4px 18px;
      text-align: center;
      animation: fadeUp 0.55s ease both;
    }

    h1 {
      margin: 0 auto;
      max-width: 100%;
      font-size: clamp(24px, 6.8vw, 30px);
      line-height: 1.1;
      letter-spacing: -0.045em;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
    }

    .dealer-card,
    .selector-card {
      margin: 18px 0 16px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(210, 210, 215, 0.62);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      animation: fadeUp 0.55s 0.08s ease both;
      backdrop-filter: blur(18px);
    }

    .dealer-title {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.15;
      letter-spacing: -0.045em;
      font-weight: 800;
      color: var(--text);
    }

    .dealer-desc {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      font-weight: 600;
    }

    .dealer-form {
      display: grid;
      gap: 10px;
    }

    .dealer-input {
      width: 100%;
      height: 54px;
      border-radius: 17px;
      border: 1px solid var(--line);
      outline: none;
      background: #fff;
      color: var(--text);
      padding: 0 16px;
      font-size: 16px;
      font-weight: 800;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .dealer-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px var(--blue-soft);
      transform: translateY(-1px);
    }

    .dealer-button {
      width: 100%;
      height: 54px;
      border-radius: 17px;
      border: none;
      outline: none;
      background: var(--blue);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .dealer-button:active {
      transform: scale(0.98);
    }

    .dealer-error {
      display: none;
      margin: 2px 0 0;
      color: var(--danger);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }

    .dealer-card.error-shake {
      animation: shake 0.34s ease both;
    }

    .selector-card {
      display: block;
    }

    .selector-card.unlocked {
      display: block;
      animation: popIn 0.46s cubic-bezier(.2, .9, .2, 1) both;
    }

    .selector-label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }

    .model-groups {
      display: grid;
      gap: 16px;
    }

    .model-series {
      border: 1px solid var(--soft-line);
      border-radius: 20px;
      background: #f7f7f9;
      padding: 14px;
    }

    .model-series-title {
      margin: 0 0 10px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    .model-button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .model-button {
      min-width: 0;
      min-height: 50px;
      padding: 10px 8px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: #fff;
      color: var(--text);
      font-size: 14px;
      line-height: 1.2;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
    }

    .model-button:hover {
      border-color: rgba(0, 113, 227, 0.42);
    }

    .model-button:active {
      transform: scale(0.97);
    }

    .model-button.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
      box-shadow: 0 7px 16px rgba(0, 113, 227, 0.2);
    }

    .model-empty {
      padding: 18px 4px 4px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .summary {
      display: none;
    }

    .price-panel {
      display: none;
      scroll-margin-top: 16px;
      background: var(--card);
      border: 1px solid rgba(210, 210, 215, 0.62);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transform: translateY(18px) scale(0.96);
      opacity: 0;
      will-change: transform, opacity;
    }

    .price-panel.show {
      display: block;
      animation: popIn 0.48s cubic-bezier(.2, .9, .2, 1) both;
    }

    .selected-cover {
      padding: 24px 20px 20px;
      background:
        radial-gradient(circle at right top, rgba(0, 113, 227, 0.08), transparent 42%),
        #ffffff;
      border-bottom: 1px solid var(--soft-line);
      text-align: center;
    }

    .selected-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: 0.04em;
    }

    .selected-model {
      font-size: clamp(28px, 8vw, 38px);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.055em;
      margin: 0;
      color: var(--text);
    }

    .selected-note {
      display: none;
    }

    .price-list {
      padding: 16px;
      display: grid;
      gap: 14px;
      background: #f5f5f7;
    }

    .price-category-card {
      background: #ffffff;
      border: 1px solid rgba(210, 210, 215, 0.72);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.045);
      opacity: 0;
      transform: translateY(10px);
      animation: rowUp 0.42s ease both;
    }

    .price-category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 6px;
    }

    .price-category-title {
      margin: 0;
      color: var(--text);
      font-size: 18px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .price-category-body {
      padding: 0 16px 2px;
    }

    .price-category-note {
      margin: 0;
      padding: 0 16px 16px;
      color: #d70015;
      font-size: 12px;
      line-height: 1.6;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .price-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid var(--soft-line);
      opacity: 0;
      transform: translateY(10px);
      animation: rowUp 0.42s ease both;
    }

    .price-row:last-child {
      border-bottom: none;
    }

    .price-row.empty-row {
      grid-template-columns: 1fr;
      color: #a1a1a6;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
    }

    .repair-name {
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      word-break: break-word;
    }

    .repair-price {
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      white-space: nowrap;
      letter-spacing: -0.02em;
    }

    .repair-price.empty {
      color: #a1a1a6;
    }

    .status {
      display: none;
      padding: 36px 22px;
      text-align: center;
      color: var(--muted);
      background: #ffffff;
      border-radius: var(--radius);
      border: 1px solid rgba(210, 210, 215, 0.62);
      box-shadow: var(--shadow);
      font-size: 14px;
      line-height: 1.7;
      animation: fadeUp 0.46s 0.14s ease both;
    }

    .status.show {
      display: block;
    }

    .status.error {
      color: var(--danger);
      border-color: rgba(215, 0, 21, 0.18);
      background: #fffafa;
    }

    .store-footer {
      margin: 28px auto 0;
      padding: 18px 10px 4px;
      text-align: center;
      color: #86868b;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      animation: fadeUp 0.55s 0.18s ease both;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateX(12px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translateY(22px) scale(0.94);
        box-shadow: var(--shadow);
      }
      70% {
        opacity: 1;
        transform: translateY(-3px) scale(1.012);
        box-shadow: var(--shadow-strong);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        box-shadow: var(--shadow);
      }
    }

    @keyframes rowUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(4px); }
    }

    @media (min-width: 768px) {
      body {
        background:
          radial-gradient(circle at top, rgba(255,255,255,0.85), transparent 32%),
          var(--bg);
      }

      .page {
        padding-top: 42px;
      }
    }

    @media (max-width: 390px) {
      h1 {
        font-size: 23px;
      }

      .repair-name {
        font-size: 14px;
      }

      .repair-price {
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div id="selectionPage" class="page-view active">
      <section class="hero">
        <h1>iPhone 同行維修報價</h1>
      </section>

      <section id="selectorCard" class="selector-card">
        <div class="selector-label">選擇 iPhone 型號</div>
        <div id="modelGroups" class="model-groups"></div>
      </section>

      <div class="summary">
        <div id="resultCount">正在讀取資料...</div>
        <div id="updatedAt">資料來源：competitor_iphone_price_matrix</div>
      </div>

      <section id="statusBox" class="status">資料載入中...</section>

      <footer class="store-footer">
        黑盒子維修中心-沙鹿站前店

    </div>

    <div id="resultPage" class="page-view">

        <button id="backToModels" class="back-button" type="button" aria-label="返回選擇型號">
          <span class="back-icon" aria-hidden="true">‹</span>

      <section id="pricePanel" class="price-panel">

        </div>

        <div id="priceList" class="price-list"></div>
      </section>

      <footer class="store-footer">
        黑盒子維修中心-沙鹿站前店
      </footer>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://hkygeqtxtvnslyrmfiux.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhreWdlcXR4dHZuc2x5cm1maXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMTY2MDUsImV4cCI6MjA5MjU5MjYwNX0.VY_XEmXpuiKaYiIH2H57gMTozaZtEDiqvaBSZ9A6kfQ";
    const TABLE_NAME = "competitor_iphone_price_matrix";

    /*
      是否把「電池-蘋果原廠電池」顯示成「蘋果原廠電池」
      false = 直接顯示 Supabase 欄位名稱
      true = 自動拿掉第一個 "-" 前面的分類
    */
    const STRIP_CATEGORY_PREFIX = true;

    /*
      這裡是非報價欄位的對照表。
      程式會自動排除這些欄位，不會把它們顯示成維修項目。
    */
    const FIELD_ALIASES = {
      id: [
        "編號",
        "id"
      ],
      model: [
        "型號",
        "model",
        "iphone_model",
        "phone_model",
        "model_name",
        "phone_name",
        "device_model"
      ],
      enabled: [
        "是否啟用",
        "is_enabled",
        "is_active",
        "enabled",
        "active",
        "status",
        "visible"
      ],
      sort: [
        "排序",
        "sort_order",
        "display_order",
        "sort",
        "order",
        "position"
      ]
    };

    const EXTRA_EXCLUDED_COLUMNS = [
      "created_at",
      "updated_at",
      "createdAt",
      "updatedAt",
      "deleted_at",
      "deletedAt",
      "建立時間",
      "更新時間",
      "刪除時間",
      "備註",
      "note",
      "notes",
      "remark",
      "remarks",
      "description",
      "說明"
    ];

    const PRICE_GROUPS = [
      {
        id: "battery",
        title: "電池",
        emptyText: "目前沒有電池報價欄位",
        keywords: ["電池", "battery"],
        note: "更換 [蘋果原廠零件] 需關閉尋找，或提供蘋果帳號密碼"
      },
      {
        id: "screen",
        title: "螢幕",
        emptyText: "目前沒有螢幕報價欄位",
        keywords: ["螢幕", "屏幕", "面板", "總成", "觸控", "display", "screen", "lcd", "oled"],
        note: "更換 [蘋果原廠零件] 需關閉尋找，或提供蘋果帳號密碼"
      },
      {
        id: "other",
        title: "其他維修項目",
        emptyText: "目前沒有其他維修項目",
        keywords: []
      }
    ];

    let allRows = [];
    let repairItems = [];
    let hasLoadedData = false;
    let selectedModelIndex = null;

    const selectorCard = document.getElementById("selectorCard");
    const selectionPage = document.getElementById("selectionPage");
    const resultPage = document.getElementById("resultPage");
    const backToModels = document.getElementById("backToModels");

    const modelGroups = document.getElementById("modelGroups");
    const statusBox = document.getElementById("statusBox");
    const pricePanel = document.getElementById("pricePanel");
    const resultCount = document.getElementById("resultCount");
    const updatedAt = document.getElementById("updatedAt");
    const selectedModel = document.getElementById("selectedModel");
    const selectedNote = document.getElementById("selectedNote");
    const priceList = document.getElementById("priceList");

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getValue(row, keys, fallback = "") {
      for (const key of keys) {
        if (Object.prototype.hasOwnProperty.call(row, key)) {
          return row[key];
        }
      }

      return fallback;
    }

    function getField(row, fieldName, fallback = "") {
      return getValue(row, FIELD_ALIASES[fieldName] || [fieldName], fallback);
    }

    function getExcludedColumnNames() {
      const names = [];

      Object.values(FIELD_ALIASES).forEach((aliases) => {
        aliases.forEach((name) => names.push(name));
      });

      EXTRA_EXCLUDED_COLUMNS.forEach((name) => names.push(name));

      return new Set(names);
    }

    function formatRepairLabel(columnName) {
      if (!STRIP_CATEGORY_PREFIX) {
        return columnName;
      }

      if (!columnName.includes("-")) {
        return columnName;
      }

      return columnName.split("-").slice(1).join("-");
    }

    function buildRepairItemsFromRows(rows) {
      const excludedColumns = getExcludedColumnNames();
      const columns = [];

      rows.forEach((row) => {
        Object.keys(row).forEach((columnName) => {
          if (excludedColumns.has(columnName)) return;
          if (columns.includes(columnName)) return;

          columns.push(columnName);
        });
      });

      repairItems = columns.map((columnName) => {
        return {
          label: formatRepairLabel(columnName),
          key: columnName
        };
      });
    }

    function isTrueValue(value) {
      if (value === true) return true;
      if (value === 1) return true;
      if (value === "1") return true;

      const normalized = String(value).trim().toLowerCase();

      return normalized === "true" ||
        normalized === "yes" ||
        normalized === "y" ||
        normalized === "on" ||
        normalized === "啟用" ||
        normalized === "顯示";
    }

    function isEmptyPrice(value) {
      return value === null || value === undefined || value === "";
    }

    function formatPrice(value) {
      if (isEmptyPrice(value)) return "—";

      const numberValue = Number(value);

      if (!Number.isNaN(numberValue)) {
        return "$" + numberValue.toLocaleString("zh-TW");
      }

      return String(value);
    }

    function getRepairPrice(row, item) {
      return row[item.key];
    }

    function countAvailablePrices(row) {
      return repairItems.filter((item) => !isEmptyPrice(getRepairPrice(row, item))).length;
    }

    function getItemSearchText(item) {
      return `${item.key} ${item.label}`.toLowerCase();
    }

    function matchesGroup(item, group) {
      if (!group.keywords || group.keywords.length === 0) return false;

      const searchText = getItemSearchText(item);
      return group.keywords.some((keyword) => searchText.includes(String(keyword).toLowerCase()));
    }

    function getGroupedRepairItems() {
      const batteryGroup = PRICE_GROUPS.find((group) => group.id === "battery");
      const screenGroup = PRICE_GROUPS.find((group) => group.id === "screen");

      const grouped = PRICE_GROUPS.map((group) => {
        return {
          ...group,
          items: []
        };
      });

      repairItems.forEach((item) => {
        if (matchesGroup(item, batteryGroup)) {
          grouped.find((group) => group.id === "battery").items.push(item);
          return;
        }

        if (matchesGroup(item, screenGroup)) {
          grouped.find((group) => group.id === "screen").items.push(item);
          return;
        }

        grouped.find((group) => group.id === "other").items.push(item);
      });

      return grouped;
    }

    function countGroupAvailablePrices(row, items) {
      return items.filter((item) => !isEmptyPrice(getRepairPrice(row, item))).length;
    }

    function renderPriceRows(row, group, groupIndex) {
      if (!group.items || group.items.length === 0) {
        return `
          <div class="price-row empty-row" style="animation-delay:${140 + groupIndex * 90}ms">
            ${escapeHtml(group.emptyText)}
          </div>
        `;
      }

      return group.items.map((item, itemIndex) => {
        const value = getRepairPrice(row, item);
        const emptyClass = isEmptyPrice(value) ? " empty" : "";
        const delay = 140 + groupIndex * 90 + itemIndex * 35;

        return `
          <div class="price-row" style="animation-delay:${delay}ms">
            <div class="repair-name">${escapeHtml(item.label)}</div>
            <div class="repair-price${emptyClass}">${escapeHtml(formatPrice(value))}</div>
          </div>
        `;
      }).join("");
    }

    function renderPriceGroupCard(row, group, groupIndex) {
      const cardDelay = 80 + groupIndex * 70;

      return `
        <section class="price-category-card" style="animation-delay:${cardDelay}ms">
          <div class="price-category-header">
            <h3 class="price-category-title">${escapeHtml(group.title)}</h3>
          </div>
          <div class="price-category-body">
            ${renderPriceRows(row, group, groupIndex)}
          </div>
          ${group.note ? `<p class="price-category-note">${escapeHtml(group.note)}</p>` : ""}
        </section>
      `;
    }

    function getModelName(row, index = 0) {
      return getField(row, "model") || `未命名型號 ${index + 1}`;
    }

    function getSortValue(row) {
      const value = getField(row, "sort", 999999);
      const numberValue = Number(value);

      if (Number.isNaN(numberValue)) {
        return 999999;
      }

      return numberValue;
    }

    function getSeriesInfo(modelName) {
      const name = String(modelName || "").trim();

      // iPhone 17 / 16 / 15 / 14 ... 數字世代自動分在同一系列
      const numericMatch = name.match(/iphone\s*(\d+)/i);
      if (numericMatch) {
        const generation = Number(numericMatch[1]);
        return {
          key: `numeric-${generation}`,
          title: `iPhone ${generation} 系列`,
          order: 1000 - generation
        };
      }

      // X 世代：iPhone X / XR / XS / XS Max
      if (/iphone\s*(x|xr|xs)/i.test(name)) {
        return { key: "iphone-x", title: "iPhone X 系列", order: 2000 };
      }

      // SE 世代
      if (/iphone\s*se/i.test(name)) {
        return { key: "iphone-se", title: "iPhone SE 系列", order: 3000 };
      }

      // 其他未符合規則的型號仍會顯示
      return { key: `other-${name}`, title: "其他型號", order: 9999 };
    }

    function getShortModelName(modelName) {
      const name = String(modelName || "").trim();
      return name.replace(/^iPhone\s*/i, "").trim() || name;
    }

    function buildModelGroups() {
      modelGroups.innerHTML = "";
      selectedModelIndex = null;

      if (allRows.length === 0) {
        modelGroups.innerHTML = `<div class="model-empty">目前沒有可選擇的型號</div>`;
        return;
      }

      const groupedMap = new Map();

      allRows.forEach((row, index) => {
        const modelName = getModelName(row, index);
        const series = getSeriesInfo(modelName);

        if (!groupedMap.has(series.key)) {
          groupedMap.set(series.key, { ...series, models: [] });
        }

        groupedMap.get(series.key).models.push({
          index,
          name: modelName,
          sort: getSortValue(row)
        });
      });

      const groups = Array.from(groupedMap.values()).sort((a, b) => {
        if (a.order !== b.order) return a.order - b.order;
        return a.title.localeCompare(b.title, "zh-Hant");
      });

      modelGroups.innerHTML = groups.map((group) => {
        group.models.sort((a, b) => {
          if (a.sort !== b.sort) return a.sort - b.sort;
          return a.name.localeCompare(b.name, "zh-Hant");
        });

        const buttons = group.models.map((model) => {
          const buttonText = getShortModelName(model.name);
          return `
            <button
              type="button"
              class="model-button"
              data-model-index="${model.index}"
              aria-label="選擇 ${escapeHtml(model.name)}"
            >
              ${escapeHtml(buttonText)}
            </button>
          `;
        }).join("");

        return `
          <section class="model-series">
            <h3 class="model-series-title">${escapeHtml(group.title)}</h3>
            <div class="model-button-grid">${buttons}</div>
          </section>
        `;
      }).join("");
    }

    function showSelectionPage() {
      resultPage.classList.remove("active");
      selectionPage.classList.add("active");
      window.scrollTo({ top: 0, behavior: "auto" });
    }

    function showResultPage() {
      selectionPage.classList.remove("active");
      resultPage.classList.add("active");
      window.scrollTo({ top: 0, behavior: "auto" });
    }

    function selectModel(index, button) {
      selectedModelIndex = Number(index);

      modelGroups.querySelectorAll(".model-button").forEach((item) => {
        item.classList.toggle("active", item === button);
      });

      renderSelectedPrice();
      showResultPage();
    }

    function showStatus(message, isError = false) {
      statusBox.className = isError ? "status show error" : "status show";
      statusBox.textContent = message;
    }

    function hideStatus() {
      statusBox.classList.remove("show");
      statusBox.style.display = "none";
    }

    function showPricePanel() {
      pricePanel.style.display = "block";
      pricePanel.classList.remove("show");

      void pricePanel.offsetWidth;

      requestAnimationFrame(() => {
        pricePanel.classList.add("show");
      });
    }

    function renderSelectedPrice() {
      const selectedIndex = selectedModelIndex;
      const row = selectedIndex === null ? null : allRows[selectedIndex];

      if (!row || Number.isNaN(selectedIndex)) {
        pricePanel.classList.remove("show");
        pricePanel.style.display = "none";
        statusBox.style.display = "block";
        showStatus("請先選擇 iPhone 型號查看報價。");
        return;
      }

      hideStatus();

      selectedModel.textContent = getModelName(row, selectedIndex);

      const availableCount = countAvailablePrices(row);
      selectedNote.textContent = availableCount > 0
        ? `目前共有 ${availableCount} 個維修項目有填寫價格。`
        : "這個型號目前尚未填寫任何維修價格。";

      const groupedRepairItems = getGroupedRepairItems();

      priceList.innerHTML = groupedRepairItems
        .map((group, groupIndex) => renderPriceGroupCard(row, group, groupIndex))
        .join("");

      showPricePanel();
    }

    async function loadData() {
      try {
        statusBox.style.display = "block";
        showStatus("資料載入中...");
        pricePanel.classList.remove("show");
        pricePanel.style.display = "none";
        resultCount.textContent = "正在讀取資料...";
        modelGroups.innerHTML = `<div class="model-empty">資料載入中...</div>`;
        selectedModelIndex = null;

        const { data, error } = await client
          .from(TABLE_NAME)
          .select("*");

        if (error) throw error;

        const rawRows = Array.isArray(data) ? data : [];

        buildRepairItemsFromRows(rawRows);

        allRows = rawRows
          .filter((row) => {
            const enabledValue = getField(row, "enabled", true);

            if (enabledValue === "" || enabledValue === null || enabledValue === undefined) {
              return true;
            }

            return isTrueValue(enabledValue);
          })
          .sort((a, b) => {
            const sortA = getSortValue(a);
            const sortB = getSortValue(b);

            if (sortA !== sortB) {
              return sortA - sortB;
            }

            return String(getField(a, "model")).localeCompare(
              String(getField(b, "model")),
              "zh-Hant"
            );
          });

        hasLoadedData = true;

        const now = new Date();
        updatedAt.textContent = "最後更新：" + now.toLocaleString("zh-TW", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        });

        resultCount.innerHTML = `共讀取 <strong>${allRows.length}</strong> 筆型號資料`;

        buildModelGroups();

        if (allRows.length === 0) {
          showStatus("目前資料表沒有可顯示的報價資料。");
          pricePanel.style.display = "none";
          return;
        }

        showStatus("請先選擇 iPhone 型號查看報價。");
        pricePanel.style.display = "none";

      } catch (error) {
        console.error(error);

        modelGroups.innerHTML = `<div class="model-empty">型號讀取失敗</div>`;
        selectedModelIndex = null;

        pricePanel.classList.remove("show");
        pricePanel.style.display = "none";
        statusBox.style.display = "block";
        statusBox.className = "status show error";
        statusBox.innerHTML = `
          <strong>資料讀取失敗</strong><br />
          ${escapeHtml(error.message || "請確認 Supabase Key、RLS 權限與資料表名稱是否正確。")}
        `;

        resultCount.textContent = "無法讀取資料";
      }
    }

    modelGroups.addEventListener("click", (event) => {
      const button = event.target.closest(".model-button");
      if (!button) return;

      selectModel(button.dataset.modelIndex, button);
    });

    backToModels.addEventListener("click", () => {
      showSelectionPage();
    });


    // 免驗證：進入頁面後直接載入型號與報價資料
    selectorCard.classList.add("unlocked");
    loadData();
  </script>
</body>
</html>
