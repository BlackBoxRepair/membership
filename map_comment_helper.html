<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>黑盒子｜Google 評論小幫手</title>
  <meta name="description" content="黑盒子維修中心 Google 評論小幫手，協助依照實際維修體驗整理評論文字。" />
  <meta name="theme-color" content="#ffc542" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=TASA+Explorer:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

  <style>
    :root {
      --yellow: #ffc542;
      --black: #111111;
      --white: #ffffff;
      --gray-50: #fafafa;
      --gray-100: #f5f5f5;
      --gray-200: #eeeeee;
      --gray-300: #dddddd;
      --gray-500: #888888;
      --gray-700: #555555;
      --gray-900: #222222;
      --shadow: 0 20px 44px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--white);
      color: var(--black);
      font-family: "TASA Explorer", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    .app {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 22px 18px 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--black);
      color: var(--yellow);
      display: grid;
      place-items: center;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -0.04em;
      flex: 0 0 auto;
    }

    .hello {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .subhello {
      margin-top: 4px;
      color: var(--gray-700);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .assist-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 38px;
      padding: 9px 12px;
      border-radius: 999px;
      background: var(--gray-100);
      color: var(--black);
      border: 1px solid var(--gray-100);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      min-height: 286px;
      border-radius: 34px;
      background:
        radial-gradient(circle at 92% 14%, rgba(255, 197, 66, 0.32), transparent 26%),
        linear-gradient(135deg, #111111 0%, #222222 62%, #333333 100%);
      color: var(--white);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 8px 15px;
      border-radius: 999px;
      background: var(--yellow);
      color: var(--black);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .hero-card h1 {
      margin: 28px 0 16px;
      font-size: 46px;
      line-height: 0.98;
      letter-spacing: -0.06em;
      font-weight: 900;
    }

    .hero-card p {
      margin: 0;
      max-width: 320px;
      color: var(--gray-300);
      font-size: 17px;
      line-height: 1.7;
      font-weight: 700;
    }

    .hero-tags {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: var(--white);
      font-size: 13px;
      font-weight: 900;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin: 30px 0 12px;
    }

    .section-kicker {
      display: block;
      color: var(--gray-700);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.14em;
      margin-bottom: 4px;
    }

    .section-title {
      margin: 0;
      color: var(--black);
      font-size: 22px;
      line-height: 1.12;
      font-weight: 900;
      letter-spacing: -0.035em;
    }

    .step-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 8px 13px;
      border-radius: 999px;
      border: 1px solid var(--gray-300);
      color: var(--gray-700);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .form-panel,
    .result-card {
      background: var(--white);
      border: 1px solid var(--gray-100);
      border-radius: 26px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .field-row {
      margin-bottom: 18px;
    }

    .field-row:last-child {
      margin-bottom: 0;
    }

    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--black);
      font-size: 15px;
      font-weight: 900;
    }

    .field-label small {
      color: var(--gray-700);
      font-size: 12px;
      font-weight: 900;
    }

    .store-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .store-option,
    .repair-option,
    .more-toggle,
    .main-action,
    .secondary-action,
    .copy-action,
    .map-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 54px;
      border-radius: 18px;
      border: 1px solid var(--gray-300);
      background: var(--white);
      color: var(--black);
      cursor: pointer;
      font-weight: 900;
      text-decoration: none;
      user-select: none;
    }

    .store-option.active,
    .repair-option.active,
    .chip input:checked + span {
      background: var(--yellow);
      border-color: var(--yellow);
      color: var(--black);
    }

    .text-field {
      width: 100%;
      min-height: 56px;
      padding: 0 18px;
      border-radius: 18px;
      border: 1px solid var(--gray-300);
      background: var(--white);
      color: var(--black);
      outline: none;
      font-size: 16px;
      font-weight: 800;
    }

    .text-field::placeholder,
    textarea::placeholder {
      color: var(--gray-500);
    }

    .text-field:focus,
    textarea:focus {
      border-color: var(--yellow);
      box-shadow: 0 0 0 4px rgba(255, 197, 66, 0.22);
    }

    .repair-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .repair-option {
      min-height: 50px;
      padding: 10px 8px;
      font-size: 14px;
    }

    .other-repair-panel {
      margin-top: 12px;
      display: none;
    }

    .other-repair-panel.show {
      display: block;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
    }

    .chip {
      position: relative;
      display: inline-flex;
    }

    .chip input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .chip span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 9px 13px;
      border-radius: 999px;
      border: 1px solid var(--gray-300);
      background: var(--white);
      color: var(--black);
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      user-select: none;
    }

    .collapsed[data-collapsed="true"] .more-chip {
      display: none;
    }

    .more-toggle {
      width: 100%;
      min-height: 44px;
      margin-top: 14px;
      border-radius: 999px;
      background: var(--gray-100);
      border-color: var(--gray-100);
      font-size: 13px;
    }

    .more-toggle.active iconify-icon {
      transform: rotate(180deg);
    }

    .ai-action-panel {
      margin-top: 18px;
      margin-bottom: 46px;
    }

    .main-action {
      width: 100%;
      min-height: 60px;
      border: none;
      border-radius: 22px;
      background: var(--yellow);
      color: var(--black);
      font-size: 18px;
      box-shadow: 0 14px 28px rgba(255, 197, 66, 0.28);
    }

    .main-action:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 12px;
      padding: 13px 14px;
      border-radius: 18px;
      background: var(--gray-100);
      color: var(--black);
      border: 1px solid var(--gray-300);
      font-size: 13px;
      line-height: 1.6;
      font-weight: 800;
    }

    .message.show {
      display: block;
    }

    .result-page {
      display: none;
    }

    .app.result-mode .input-page {
      display: none;
    }

    .app.result-mode .result-page {
      display: block;
    }

    .result-card {
      margin-top: 14px;
    }

    .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 7px 12px;
      margin-bottom: 14px;
      border-radius: 999px;
      background: var(--yellow);
      color: var(--black);
      font-size: 12px;
      font-weight: 900;
    }

    textarea {
      width: 100%;
      min-height: 260px;
      padding: 16px;
      border-radius: 22px;
      border: 1px solid var(--gray-300);
      background: var(--white);
      color: var(--black);
      outline: none;
      resize: vertical;
      font-size: 16px;
      line-height: 1.85;
      font-weight: 700;
    }

    .result-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .copy-action,
    .map-action {
      width: 100%;
      min-height: 54px;
      border-radius: 18px;
      background: var(--yellow);
      border-color: var(--yellow);
      color: var(--black);
      font-size: 15px;
    }

    .secondary-action {
      width: 100%;
      min-height: 48px;
      margin-top: 10px;
      background: var(--white);
      border-color: var(--gray-300);
      font-size: 14px;
    }

    .footer-note {
      margin: 28px 0 0;
      text-align: center;
      color: var(--gray-700);
      font-size: 12px;
      line-height: 1.6;
      font-weight: 700;
    }

    .loading-dot::after {
      content: "";
      display: inline-block;
      width: 1.2em;
      text-align: left;
      animation: dots 1.2s steps(4, end) infinite;
    }

    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
      100% { content: ""; }
    }

    @media (max-width: 390px) {
      .app {
        padding-left: 15px;
        padding-right: 15px;
      }

      .hero-card {
        min-height: 270px;
        padding: 21px;
      }

      .hero-card h1 {
        font-size: 40px;
      }

      .form-panel,
      .result-card {
        padding: 18px;
      }
    }

    /* Wizard page flow */
    .wizard-status {
      margin: 18px 0 14px;
      padding: 14px 14px 13px;
      border-radius: 22px;
      background: var(--gray-100);
      border: 1px solid var(--gray-200);
    }

    .wizard-status-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .wizard-status-top span {
      color: var(--gray-700);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .wizard-status-top strong {
      color: var(--black);
      font-size: 15px;
      font-weight: 900;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: var(--gray-300);
      overflow: hidden;
    }

    .progress-fill {
      width: 25%;
      height: 100%;
      border-radius: 999px;
      background: var(--yellow);
      transition: width 0.25s ease;
    }

    .wizard-message {
      margin-top: 12px !important;
      margin-bottom: 0 !important;
      background: var(--white) !important;
    }

    .wizard-page {
      display: none;
      animation: pageIn 0.22s ease both;
    }

    .wizard-page.active {
      display: block;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .wizard-page .hero-card {
      margin-bottom: 28px;
    }

    .wizard-page .section-head:first-of-type {
      margin-top: 0;
    }

    .wizard-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 18px;
      margin-bottom: 26px;
    }

    .wizard-actions.two {
      grid-template-columns: 0.78fr 1fr;
    }

    .next-action,
    .prev-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 54px;
      border-radius: 18px;
      border: 1px solid var(--gray-300);
      cursor: pointer;
      font-weight: 900;
      text-decoration: none;
      user-select: none;
    }

    .next-action {
      background: var(--yellow);
      border-color: var(--yellow);
      color: var(--black);
      box-shadow: 0 12px 24px rgba(255, 197, 66, 0.22);
    }

    .prev-action {
      background: var(--white);
      color: var(--black);
    }

    .ai-action-panel {
      margin-bottom: 12px !important;
    }

    @media (max-width: 390px) {
      .wizard-actions.two {
        grid-template-columns: 1fr;
      }
    }


    /* Header logo version */
    .brand-logo {
      display: block;
      width: auto;
      height: 50px;
      max-width: 220px;
      object-fit: contain;
    }

    /* Four-segment progress line */
    .wizard-status {
      padding: 12px 0 0 !important;
      margin: 12px 0 20px !important;
      background: transparent !important;
      border: none !important;
    }

    .wizard-status-top,
    .progress-track,
    .progress-fill {
      display: none !important;
    }

    .progress-steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      width: 100%;
    }

    .progress-step {
      display: block;
      height: 5px;
      border-radius: 999px;
      background: var(--gray-300);
      transition: background 0.2s ease, opacity 0.2s ease;
    }

    .progress-step.active,
    .progress-step.done {
      background: var(--yellow);
    }

    .wizard-message {
      margin-top: 12px !important;
    }

    /* Show all step 3 / 4 options */
    #problems .more-chip,
    #experiences .more-chip {
      display: inline-flex !important;
    }


    .field-error {
      display: none;
      margin-left: 6px;
      color: #d93025;
      font-size: 12px;
      font-style: normal;
      font-weight: 900;
      letter-spacing: 0;
      vertical-align: baseline;
    }

    .field-error.show {
      display: inline;
    }

    .field-label.has-error,
    .section-title.has-error {
      color: var(--black);
    }

    .field-label.has-error + .store-options,
    .field-label.has-error + .text-field,
    .section-title.has-error ~ * {
      border-color: #d93025;
    }

    .form-panel.error-panel {
      border-color: rgba(217, 48, 37, 0.45);
      box-shadow: 0 20px 44px rgba(217, 48, 37, 0.08);
    }

  </style>
</head>

<body>
  <main class="app" id="app">
    <div class="input-page">
      <header class="topbar">
        <div class="brand">
          <img class="brand-logo" src="../site logo.png" alt="黑盒子維修中心" onerror="this.onerror=null; this.src='./site logo.png';">
        </div>
        <div class="assist-pill">
          <iconify-icon icon="mdi:map-marker" width="17"></iconify-icon>
          智能心意
        </div>
      </header>

      <section class="wizard-status">
        <div class="progress-steps" id="progressSteps" aria-label="填寫進度">
          <span class="progress-step active"></span>
          <span class="progress-step"></span>
          <span class="progress-step"></span>
          <span class="progress-step"></span>
        </div>
        <div class="message wizard-message" id="messageBox"></div>
      </section>

      <section class="wizard-page active" data-page="1" data-title="本次維修">
<section class="section-head">
        <div>
          <span class="section-kicker">SERVICE INFO</span>
          <h2 class="section-title">本次維修</h2>
        </div>
        <span class="step-pill">STEP 01</span>
      </section>

      <section class="form-panel">
        <div class="field-row">
          <div class="field-label">
            <span>維修門市<em class="field-error" id="storeError">請選擇門市</em></span>
            <small>必填</small>
          </div>
          <div class="store-options">
            <button class="store-option" type="button" data-value="勤美公益店">
              <iconify-icon icon="mdi:storefront-outline" width="21"></iconify-icon>
              勤美公益店
            </button>
            <button class="store-option" type="button" data-value="沙鹿站前店">
              <iconify-icon icon="mdi:storefront-outline" width="21"></iconify-icon>
              沙鹿站前店
            </button>
          </div>
          <input id="store" type="hidden" value="">
        </div>

        <div class="field-row">
          <div class="field-label">
            <span>設備型號<em class="field-error" id="deviceError">請輸入型號</em></span>
            <small>必填</small>
          </div>
          <input id="device" class="text-field" type="text" placeholder="例如：iPhone 15 Pro、VIVO X100、Switch">
        </div>
      </section>
        <div class="wizard-actions">
          <button class="next-action next-btn" type="button" data-next="2">
            下一步
            <iconify-icon icon="mdi:arrow-right" width="18"></iconify-icon>
          </button>
        </div>
      </section>

      <section class="wizard-page" data-page="2" data-title="維修項目">
        <section class="section-head">
        <div>
          <span class="section-kicker">REPAIR ITEM</span>
          <h2 class="section-title">維修項目<em class="field-error" id="repairError">請選擇項目</em></h2>
        </div>
        <span class="step-pill">STEP 02</span>
      </section>

      <section class="form-panel">
        <div class="repair-options" id="repairOptions">
          <button class="repair-option" type="button" data-value="電池更換"><iconify-icon icon="mdi:battery-charging-60" width="18"></iconify-icon>電池更換</button>
          <button class="repair-option" type="button" data-value="螢幕維修"><iconify-icon icon="mdi:cellphone-screenshot" width="18"></iconify-icon>螢幕維修</button>
          <button class="repair-option" type="button" data-value="前後相機"><iconify-icon icon="mdi:camera-iris" width="18"></iconify-icon>前後相機</button>
          <button class="repair-option" type="button" data-value="背蓋維修"><iconify-icon icon="mdi:cellphone" width="18"></iconify-icon>背蓋維修</button>
          <button class="repair-option" type="button" data-value="受潮清潔"><iconify-icon icon="mdi:water-alert-outline" width="18"></iconify-icon>受潮清潔</button>
          <button class="repair-option" type="button" data-value="資料救援"><iconify-icon icon="mdi:database-refresh-outline" width="18"></iconify-icon>資料救援</button>
          <button class="repair-option" type="button" data-value="容量擴充"><iconify-icon icon="mdi:harddisk-plus" width="18"></iconify-icon>容量擴充</button>
          <button class="repair-option" type="button" data-value="充電孔維修"><iconify-icon icon="mdi:power-plug-outline" width="18"></iconify-icon>充電孔維修</button>
          <button class="repair-option" type="button" data-value="主機板維修"><iconify-icon icon="mdi:chip" width="18"></iconify-icon>主機板維修</button>
          <button class="repair-option" type="button" data-value="全機清潔"><iconify-icon icon="mdi:spray-bottle" width="18"></iconify-icon>全機清潔</button>
          <button class="repair-option" type="button" data-value="聽筒維修"><iconify-icon icon="mdi:ear-hearing" width="18"></iconify-icon>聽筒維修</button>
          <button class="repair-option" type="button" data-value="喇叭維修"><iconify-icon icon="mdi:speaker" width="18"></iconify-icon>喇叭維修</button>
          <button class="repair-option" type="button" data-value="按鍵維修"><iconify-icon icon="mdi:gesture-tap-button" width="18"></iconify-icon>按鍵維修</button>
          <button class="repair-option" type="button" data-value="臉部辨識"><iconify-icon icon="mdi:face-recognition" width="18"></iconify-icon>臉部辨識</button>

    </div>

    <div class="result-page">
      <section class="section-head">
        <div>
          <span class="section-kicker">AI COMMENT</span>
          <h2 class="section-title">AI 生成內容</h2>
        </div>
        <span class="step-pill">DONE</span>
      </section>

      <section class="result-card">
        <div class="ai-badge">
          <iconify-icon icon="mdi:sparkles" width="15"></iconify-icon>
          本次內容由 Gemini AI 生成
        </div>
        <textarea id="reviewText" aria-label="AI 生成內容" placeholder="AI 生成內容會顯示在這裡"></textarea>
        <div class="result-actions">
          <button class="copy-action" id="copyBtn" type="button">
            <iconify-icon icon="mdi:content-copy" width="18"></iconify-icon>
            複製
          </button>
          <a class="map-action" id="mapBtn" href="#" target="_blank" rel="noopener">
            <iconify-icon icon="mdi:google-maps" width="18"></iconify-icon>
            前往門市 Google 地圖
          </a>
          <button class="secondary-action" id="backBtn" type="button">
            返回修改內容
          </button>
        </div>
      </section>
    </div>
  </main>

  <script>
    const FUNCTION_URL = "https://nszwpwimwxvjguoalzwt.supabase.co/functions/v1/generate-review";

    const MAP_LINKS = {
      "勤美公益店": "https://www.google.com/maps/search/?api=1&query=%E9%BB%91%E7%9B%92%E5%AD%90%E7%B6%AD%E4%BF%AE%E4%B8%AD%E5%BF%83%20%E5%8B%A4%E7%BE%8E%E5%85%AC%E7%9B%8A%E5%BA%97",
      "沙鹿站前店": "https://www.google.com/maps/search/?api=1&query=%E9%BB%91%E7%9B%92%E5%AD%90%E7%B6%AD%E4%BF%AE%E4%B8%AD%E5%BF%83%20%E6%B2%99%E9%B9%BF%E7%AB%99%E5%89%8D%E5%BA%97"
    };

    document.addEventListener("DOMContentLoaded", function () {
      const app = document.getElementById("app");
      const storeInput = document.getElementById("store");
      const repairInput = document.getElementById("repair");
      const otherPanel = document.getElementById("otherRepairPanel");
      const otherText = document.getElementById("otherRepairText");
      const generateBtn = document.getElementById("generateBtn");
      const messageBox = document.getElementById("messageBox");
      const reviewText = document.getElementById("reviewText");
      const copyBtn = document.getElementById("copyBtn");
      const mapBtn = document.getElementById("mapBtn");
      const backBtn = document.getElementById("backBtn");

      let selectedStore = "";

      function showMessage(text) {
        messageBox.textContent = text;
        messageBox.classList.add("show");
      }

      function clearMessage() {
        messageBox.textContent = "";
        messageBox.classList.remove("show");
      }

      function getCheckedValues(containerId) {
        return Array.from(document.querySelectorAll("#" + containerId + " input:checked"))
          .map(function (input) {
            return input.value.trim();
          })
          .filter(Boolean);
      }

      function updateRepairValue() {
        const selectedButtons = Array.from(document.querySelectorAll(".repair-option.active"));
        let repairs = selectedButtons
          .map(function (button) {
            return button.dataset.value || "";
          })
          .filter(Boolean);

        const hasOther = repairs.indexOf("其他維修") !== -1;
        otherPanel.classList.toggle("show", hasOther);

        if (!hasOther) {
          otherText.value = "";
        }

        repairs = repairs.map(function (item) {
          if (item === "其他維修" && otherText.value.trim()) {
            return "其他維修：" + otherText.value.trim();
          }
          return item;
        });

        repairInput.value = repairs.join("、");
        return repairs;
      }

      function getPayload() {
        const repairs = updateRepairValue();

        return {
          store: selectedStore,
          device: document.getElementById("device").value.trim(),
          repair: repairInput.value.trim(),
          repairs: repairs,
          otherRepairText: otherText.value.trim(),
          problems: getCheckedValues("problems"),
          experiences: getCheckedValues("experiences")
        };
      }

      function clearFieldErrors() {
        document.querySelectorAll(".field-error").forEach(function (item) {
          item.classList.remove("show");
        });

        document.querySelectorAll(".form-panel").forEach(function (panel) {
          panel.classList.remove("error-panel");
        });
      }

      function showFieldError(errorId, panelSelector) {
        const errorEl = document.getElementById(errorId);
        if (errorEl) {
          errorEl.classList.add("show");
        }

        if (panelSelector) {
          const target = document.querySelector(panelSelector);
          const panel = target ? target.closest(".form-panel") : null;

          if (panel) {
            panel.classList.add("error-panel");
          }
        }
      }

      function validate(payload) {
        clearFieldErrors();

        if (!payload.store) {
          showFieldError("storeError", '.store-options');
          return "store";
        }

        if (!payload.device) {
          showFieldError("deviceError", '#device');
          return "device";
        }

        if (!payload.repair) {
          showFieldError("repairError", '#repairOptions');
          return "repair";
        }

        if (payload.problems.length === 0) {
          showFieldError("problemsError", '#problems');
          return "problems";
        }

        if (payload.experiences.length === 0) {
          showFieldError("experiencesError", '#experiences');
          return "experiences";
        }

        return "";
      }

      const wizardPages = Array.from(document.querySelectorAll(".wizard-page"));
      const progressSteps = Array.from(document.querySelectorAll(".progress-step"));
      let currentPage = 1;

      function showPage(page) {
        currentPage = page;

        wizardPages.forEach(function (item) {
          const isActive = Number(item.dataset.page) === page;
          item.classList.toggle("active", isActive);
        });

        progressSteps.forEach(function (step, index) {
          step.classList.toggle("active", index + 1 === page);
          step.classList.toggle("done", index + 1 < page);
        });

        clearMessage();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function validateStep(page) {
        clearFieldErrors();
        const payload = getPayload();

        if (page === 1) {
          if (!payload.store) {
            showFieldError("storeError", ".store-options");
            return "store";
          }

          if (!payload.device) {
            showFieldError("deviceError", "#device");
            return "device";
          }
        }

        if (page === 2 && !payload.repair) {
          showFieldError("repairError", "#repairOptions");
          return "repair";
        }

        if (page === 3 && payload.problems.length === 0) {
          showFieldError("problemsError", "#problems");
          return "problems";
        }

        return "";
      }

      document.querySelectorAll(".next-btn").forEach(function (button) {
        button.addEventListener("click", function () {
          const error = validateStep(currentPage);

          if (error) {
            return;
          }

          showPage(Number(button.dataset.next));
        });
      });

      document.querySelectorAll(".prev-btn").forEach(function (button) {
        button.addEventListener("click", function () {
          showPage(Number(button.dataset.prev));
        });
      });

      document.querySelectorAll(".store-option").forEach(function (button) {
        button.addEventListener("click", function () {
          selectedStore = button.dataset.value || "";
          storeInput.value = selectedStore;

          document.querySelectorAll(".store-option").forEach(function (item) {
            item.classList.toggle("active", item === button);
          });

          clearMessage();
          clearFieldErrors();
        });
      });

      document.querySelectorAll(".repair-option").forEach(function (button) {
        button.addEventListener("click", function () {
          button.classList.toggle("active");
          updateRepairValue();
          clearMessage();
          clearFieldErrors();
        });
      });

      otherText.addEventListener("input", function () {
        updateRepairValue();
        clearMessage();
        clearFieldErrors();
      });

      document.querySelectorAll(".more-toggle").forEach(function (button) {
        button.addEventListener("click", function () {
          const target = document.getElementById(button.dataset.target);
          if (!target) return;

          const isCollapsed = target.dataset.collapsed !== "false";
          target.dataset.collapsed = isCollapsed ? "false" : "true";
          button.classList.toggle("active", isCollapsed);
          button.innerHTML = '<iconify-icon icon="mdi:chevron-down" width="18"></iconify-icon>' + (isCollapsed ? button.dataset.less : button.dataset.more);
        });
      });

      document.querySelectorAll("#problems input, #experiences input").forEach(function (input) {
        input.addEventListener("change", clearMessage);
      });

      generateBtn.addEventListener("click", async function () {
        clearMessage();

        const payload = getPayload();
        const error = validate(payload);

        if (error) {
          return;
        }

        generateBtn.disabled = true;
        generateBtn.innerHTML = '<span class="loading-dot">Gemini AI 生成中</span>';

        try {
          const response = await fetch(FUNCTION_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });

          const data = await response.json();

          if (!response.ok || !data.ok) {
            throw new Error(data.error || "AI 生成失敗，請稍後再試。");
          }

          const generatedText =
            data.review ||
            (data.reviews && data.reviews.natural) ||
            (data.reviews && data.reviews.short) ||
            (data.reviews && data.reviews.detailed) ||
            "";

          if (!generatedText) {
            throw new Error("AI 沒有回傳可用內容，請稍後再試。");
          }

          reviewText.value = generatedText;

          const mapLink = MAP_LINKS[payload.store] || "#";
          mapBtn.href = mapLink;
          mapBtn.innerHTML = '<iconify-icon icon="mdi:google-maps" width="18"></iconify-icon>前往' + payload.store + ' Google 地圖';

          app.classList.add("result-mode");
          window.scrollTo({ top: 0, behavior: "smooth" });

        } catch (error) {
          console.error(error);
          showMessage(error.message || "AI 生成失敗，請稍後再試。");
        } finally {
          generateBtn.disabled = false;
          generateBtn.innerHTML = '<iconify-icon icon="mdi:sparkles" width="20"></iconify-icon>AI 生成';
        }
      });

      copyBtn.addEventListener("click", async function () {
        const text = reviewText.value.trim();
        if (!text) return;

        try {
          await navigator.clipboard.writeText(text);
          copyBtn.innerHTML = '<iconify-icon icon="mdi:check" width="18"></iconify-icon>已複製';
          setTimeout(function () {
            copyBtn.innerHTML = '<iconify-icon icon="mdi:content-copy" width="18"></iconify-icon>複製';
          }, 1200);
        } catch (error) {
          reviewText.focus();
          reviewText.select();
        }
      });

      backBtn.addEventListener("click", function () {
        app.classList.remove("result-mode");
        showPage(4);
      });
    });
  </script>
